# The checks nobody can run locally.
#
# There is no Node on Brent's machine, so the smoke test, the page contracts
# and the column lists only ever ran when someone was working on the code.
# This runs all three on every push, against a Worker started from the same
# wrangler.toml the deployment uses and a D1 built from the migrations in this
# commit, so a column list that has drifted from the schema fails here rather
# than showing up as an empty field on a live screen weeks later.
#
# Deliberately separate from the deploy. Cloudflare Workers Builds ships main
# on its own; this reports on the same commit and does not gate it, because a
# failing check should not be able to leave the site down.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      # No account is involved: everything below runs against local D1 state.
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Cheapest of the lot: reads filenames. Goes first because a duplicated
      # migration number makes "applied up to N" ambiguous, and the person
      # applying them by hand is the one who pays for that.
      - name: Migration numbers
        run: npm run check:migrations

      # Cheap too, and guards the one class of bug the other checks are all
      # blind to: a route in the wrong half of the router. Nothing calls the
      # unsubscribe link from a page, so check-routes never asked, and it was
      # a 404 for as long as it existed.
      - name: Routes somewhere they can be reached
        run: npm run check:wiring

      # Also filenames-and-text cheap, and guards a rule that has been broken
      # on five screens: a soft payment row is the same balance as its hard
      # twin, so a total that counts both counts the money twice.
      - name: Payment totals against the soft twin
        run: npm run check:payments

      # The other half of the column check. That one reads SELECT lists; this
      # one asks whether two full-record saves of the same table agree, which
      # is how nickname and source were settable when a client was created and
      # silently dropped by every edit afterwards.
      - name: Full saves agree about their columns
        run: npm run check:writes

      # The same failure one layer up from the column checks: a box on a page
      # whose name nothing on the server reads accepts what somebody types,
      # saves without complaint and throws it away.
      - name: Somebody reads every box
        run: npm run check:forms

      # The other direction, and the one that takes a page down rather than
      # losing a field: a script reaching for an element the markup does not
      # have gets null, and the .addEventListener on the next line throws while
      # the module is still evaluating. trip-vara's Clients page shipped that
      # way, with the whole household flow in script and none of it in markup.
      - name: Every lookup has something behind it
        run: npm run check:dom

      # And declares it on every path. check-dom said yes about a checkbox that
      # exists in one arm of a ternary, the script bound to it for every row,
      # and a heading row had no checkbox: querySelector returned null,
      # addEventListener threw inside a forEach, and the rest of the render
      # went with it.
      - name: Declared on every branch, not just one
        run: npm run check:conditional

      # A named import that is gone is a build error and never ships. A member
      # of a namespace import that is gone is undefined, and undefined is only
      # a problem at the instant somebody calls it. trip-vara's Pipeline page
      # threw on every load for four days because db.reservationPipeline had
      # stopped existing and nothing was looking.
      - name: Every namespace member is really exported
        run: npm run check:members

      # The other portal, so a fix that crossed the fork and a fix that crossed
      # half of it can be told apart. Both repositories are public, so this
      # needs no token. If it ever cannot be fetched the check says it skipped
      # rather than passing quietly.
      - name: The other portal
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ccola4me2/trip-vara-website
          path: sibling

      - name: A fix that crossed the fork, or half of one
        run: npm run check:fork -- sibling

      # A house rule nothing else could keep. The em dash, in both spellings,
      # everywhere the portal writes its own words. An en dash between two
      # dates is a range and is fine. The two files that read an em dash out of
      # a pasted vendor confirmation are excused by name.
      - name: No em dashes anywhere
        run: npm run check:dashes

      # The one artifact that leaves this repository: the message a client
      # opens. Renders a marketing email and a transactional one and checks
      # that the first carries a way out in both halves of itself and the
      # second carries none at all.
      # \uXXXX is four hex digits. Five reads as four plus a stray letter,
      # silently, and three icons on the client's itinerary were wrong that way
      # from the day the page was written.
      - name: Escapes mean what they look like
        run: npm run check:escapes

      - name: Only an advisor sends a quote
        run: npm run check:sending

      - name: What a rendered email says
        run: npm run check:email

      # Offline, needs no server, and catches the cheapest class of bug, so it
      # goes first and fails fast.
      - name: Column lists against the schema
        run: npm run check:columns

      # The other end of the same question. That one reads the shared SELECT
      # constants against the schema; this reads what the JavaScript actually
      # reaches for, because a property that is not there is undefined rather
      # than an error, and the field is simply always blank.
      # Plain JavaScript has no compiler to notice that a call hands a
      # function a key it does not take. In shorthand the name is the property
      # as well as the variable, so renaming the variable renames the key, and
      # the callee reads undefined. That cost a 500 on every statement, every
      # invoice and every preview, and the smoke test reported it three times
      # as the word "undefined".
      # The reservation save writes the whole record, so a field the request
      # did not carry is written from whatever the parser defaulted to. That is
      # how taking the Totals box off the page turned every save of a
      # confirmation number into a save that zeroed the trip total and the
      # commission. KEEP_IF_ABSENT is what stops it; this is what stops the list
      # falling behind the fields.
      - name: Nothing is erased by a save that never mentioned it
        run: npm run check:keep

      - name: Calls pass the keys the function takes
        run: npm run check:shapes

      - name: Every column a handler reads is real
        run: npm run check:reads

      - name: Build the database from the migrations
        run: npx wrangler d1 migrations apply cttagents --local

      # Seeded before the Worker starts, so nothing is holding the SQLite file
      # open while wrangler writes to it.
      - name: Seed the test admin
        run: |
          node scripts/seed-admin.mjs > /tmp/seed.sql
          npx wrangler d1 execute cttagents --local --file /tmp/seed.sql

      - name: Start the Worker
        run: |
          # --test-scheduled exposes /__scheduled, so the smoke suite can run
          # the cron rather than leaving the whole scheduled handler as the one
          # part of this Worker nothing ever executes.
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 --test-scheduled > /tmp/dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/login; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the Worker never answered on 8787"
          cat /tmp/dev.log
          exit 1

      - name: Page contracts
        run: npm run check:contracts

      - name: Smoke test
        run: npm run check:smoke

      # The Worker's own output, which is where the cause usually is when one
      # of the three fails for a reason the assertion cannot see.
      - name: Worker log
        if: failure()
        run: cat /tmp/dev.log
