<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
  <a class="auth-brand" href="/">
    <img src="/logo-mark.png" alt="">
    <span><b>Cruises Tours &amp; Travel</b><small>Travel Advisor Portal</small></span>
  </a>
  <div class="auth-card">
    <div class="auth-card-head">
      <h1>Set a new password</h1>
      <p>Choose something you have not used before.</p>
    </div>
    <div class="auth-card-body">
      <div class="notice notice-error" hidden></div>
      <div class="notice notice-ok" id="done" hidden>
        Your password is set. <a href="/login">Sign in</a>.
      </div>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
          <p class="field-hint">At least 10 characters.</p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
        </div>
        <button class="btn btn-primary" type="submit">Save password</button>
      </form>
      <p class="auth-foot"><a href="/login">Back to sign in</a></p>
    </div>
  </div>
  <p class="auth-legal">&copy; 2026 Cruises Tours &amp; Travel. All rights reserved.<br>
    <!-- Seller of travel registration numbers go here once issued. Nothing is
         placed in this slot until the real numbers exist: a plausible looking
         licence number is worse than none. -->
  </p>
</div>
<script type="module">
import { api, onSubmit, enhancePasswordFields } from '/js/app.js';
enhancePasswordFields();
const token = new URLSearchParams(location.search).get('token') || '';
const form = document.getElementById('reset-form');
const box = form.parentElement.querySelector('.notice-error');
if (!token) { box.textContent = 'This reset link is missing its token. Request a new one.'; box.hidden = false; }
onSubmit(form, async (values) => {
  if (values.password !== values.confirmPassword) {
    throw new Error('The two passwords do not match.');
  }
  await api('/api/auth/reset', { method: 'POST', body: { token, password: values.password } });
  form.hidden = true;
  document.getElementById('done').hidden = false;
});
</script>
</body></html>
