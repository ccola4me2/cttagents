<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor products | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Vendor products</h1><p class="sub">Sellable items and their prices.</p></div>
      <div class="toolbar" style="margin:0;">
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        <button class="btn btn-primary btn-sm" id="new-product">Add a product</button>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <section class="card" id="panel"><p class="spinner">Loading products...</p></section>
    </div>
  </div>
</div>
<dialog id="prod-dialog">
  <form id="prod-form" method="dialog">
    <div class="card-head"><h2>Add a product</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dialog-body">
      <div class="notice notice-error" hidden></div>
      <div class="field"><label for="name">Name</label>
        <input id="name" name="name" required placeholder="Travel protection plan"></div>
      <div class="field"><label for="description">Description</label>
        <textarea id="description" name="description"></textarea></div>
      <div class="field-row">
        <div class="field"><label for="productType">Type</label>
          <select id="productType" name="productType">
            <option value="SERVICE">Service</option>
            <option value="PHYSICAL">Physical</option>
            <option value="DIGITAL">Digital</option>
          </select></div>
        <div class="field"><label for="amount">Price (USD)</label>
          <input id="amount" name="amount" inputmode="decimal" placeholder="0.00">
          <p class="field-hint">Optional, but it cannot be sold without one.</p></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Add product</button>
    </div>
  </form>
</dialog>

<script type="module">
import { api, mountShell, esc, money, showError, onSubmit } from '/js/app.js';
await mountShell();
const panel = document.getElementById('panel');

async function load() {
  panel.innerHTML = '<p class="spinner">Loading products...</p>';
  try {
    const d = await api('/api/catalog');
    if (d.unavailable && d.unavailable.products) {
      panel.innerHTML = '<div class="empty"><p>Products are not available with the current CTT Tools permissions.</p></div>';
      return;
    }
    if (!d.products.length) {
      panel.innerHTML = '<div class="empty"><h3>No products</h3><p>Products created in CTT Tools appear here.</p></div>';
      return;
    }
    panel.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Product</th><th>Type</th><th>Prices</th></tr></thead>
      <tbody>${d.products.map((p) => `<tr>
        <td><span class="name">${esc(p.name)}</span>
          ${p.description ? `<div class="muted">${esc(p.description.slice(0, 120))}</div>` : ''}</td>
        <td><span class="badge badge-navy">${esc(p.productType || 'product')}</span></td>
        <td>${p.prices.length
            ? p.prices.map((pr) => `<div>${money(pr.amountCents)}
                <span class="muted">${esc([pr.name, pr.type].filter(Boolean).join(' · '))}</span></div>`).join('')
            : '<span class="muted">no price set</span>'}</td>
      </tr>`).join('')}</tbody></table></div>`;
  } catch (err) { showError(document.getElementById('err'), err); panel.innerHTML = ''; }
}
const prodDlg = document.getElementById('prod-dialog');
document.getElementById('new-product').addEventListener('click', () => {
  const f = document.getElementById('prod-form');
  f.reset();
  f.querySelector('.notice-error').hidden = true;
  prodDlg.showModal();
});
prodDlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => prodDlg.close()));
onSubmit(document.getElementById('prod-form'), async (values) => {
  await api('/api/catalog/products', { method: 'POST', body: values });
  prodDlg.close();
  await load();
});

document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
