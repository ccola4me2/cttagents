<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Production</h1><p class="sub">Volume and commission by departure date.</p></div>
      <div class="toolbar" style="margin:0;">
      <span id="scope"></span>
      <select id="range" aria-label="Range" style="width:auto;">
        <option value="12">Last 12 months</option>
        <option value="24">Last 24 months</option>
        <option value="36">Last 36 months</option>
        <option value="custom">Between two dates</option>
      </select>
      <span id="dates" hidden style="display:inline-flex;align-items:center;gap:.35rem;">
        <input type="date" id="from" aria-label="From" style="width:auto;">
        <span class="muted" style="font-size:.8rem;">to</span>
        <input type="date" id="to" aria-label="To" style="width:auto;">
      </span>
      <select id="by" aria-label="Grouped by" style="width:auto;">
        <option value="month">By month</option>
        <option value="week">By week</option>
      </select>
      <select id="personal" aria-label="Whose travel" style="width:auto;">
        <option value="">Client trips only</option>
        <option value="1">Include my own travel</option>
      </select>
      </div>
    </header>
    <div class="content">
      <section id="stats" class="stat-grid"></section>
      <section class="card">
        <div class="card-head"><h2>Monthly production</h2></div>
        <div id="chart" class="card-pad"><p class="spinner">Loading...</p></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>This year against last</h2></div>
        <div class="card-pad" id="comparison"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Where clients come from</h2>
          <a class="btn btn-ghost btn-sm" href="/app/clients">Clients</a></div>
        <div id="attribution"><p class="spinner">Loading...</p></div>
      </section>
      <section class="card" id="referrers-card" hidden>
        <div class="card-head"><h2>Who sends you people</h2></div>
        <div id="referrers"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>How the selling is going</h2></div>
        <div class="card-pad" id="mix"></div>
      </section>
      <!-- The agency's own report: every advisor on one table, and a way to
           take it out of the portal. A report nobody can send is a screen. -->
      <section class="card" id="advisor-card" hidden>
        <div class="card-head"><h2>By advisor</h2>
          <span>
            <button class="btn btn-ghost btn-sm" type="button" id="advisor-csv">Download</button>
            <button class="btn btn-ghost btn-sm" type="button" id="advisor-print">Print</button>
          </span></div>
        <div id="by-advisor"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>By month</h2></div>
        <div id="table"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Client payments by month</h2>
          <a class="btn btn-ghost btn-sm" href="/app/payments">Manage payments</a></div>
        <div id="cashflow"></div>
      </section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, money, showError, mountScopePicker, advisorParam } from '/js/app.js';
await mountShell();

const chart = document.getElementById('chart');
const table = document.getElementById('table');
const statsEl = document.getElementById('stats');
const range = document.getElementById('range');
const personal = document.getElementById('personal');

function monthLabel(ym) {
  const s = String(ym);
  // A week bucket is the Sunday it began, so it arrives as a full date and a
  // month bucket does not. Which one is in the data decides how it reads,
  // rather than the page keeping its own note of what it asked for.
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const [y, m, dd] = s.split('-').map(Number);
    const d = new Date(y, m - 1, dd);
    return Number.isNaN(d.getTime()) ? s
      : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  const [y, m] = s.split('-');
  const d = new Date(Number(y), Number(m) - 1, 1);
  return Number.isNaN(d.getTime()) ? ym : d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
}

/** What the report is actually showing, said in words above the chart. */
function rangeLabel(data) {
  const said = (iso) => {
    const [y, m, d] = String(iso).split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return Number.isNaN(dt.getTime()) ? iso
      : dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  };
  const grouped = data.by === 'week' ? 'week' : 'month';
  if (!data.custom) return `Departures in the last ${data.months} months, by ${grouped}.`;
  if (data.from && data.to) return `Departures from ${said(data.from)} to ${said(data.to)}, by ${grouped}.`;
  if (data.to) return `Departures up to ${said(data.to)}, by ${grouped}.`;
  return `Departures from ${said(data.from)} onwards, by ${grouped}.`;
}

function render(data) {
  const s = data.stats;
  const everyone = Boolean(data.scope && data.scope.all);
  const pay = data.payments || {};
  const rate = s.grossCents ? (s.commissionCents / s.grossCents) * 100 : 0;
  statsEl.innerHTML = `
    <div class="stat"><p class="label">Trips booked</p><p class="value">${money(s.grossCents)}</p>
      <p class="meta">Value of travel sold, not your revenue</p></div>
    <div class="stat"><p class="label">${everyone ? 'Agency earnings' : 'Your earnings'}</p>
      <p class="value">${money(s.commissionCents)}</p>
      <p class="meta">${money(s.commissionPaidCents)} paid by vendors</p></div>
    <div class="stat"><p class="label">Effective rate</p><p class="value">${rate.toFixed(1)}%</p>
      <p class="meta">Commission as a share of trips booked</p></div>
    <div class="stat"><p class="label">Outstanding</p>
      <p class="value">${money(s.commissionCents - s.commissionPaidCents)}</p>
      <p class="meta">Commission earned, not yet paid ${everyone ? 'out' : 'to you'}</p></div>
    <div class="stat"><p class="label">Collection rate</p>
      <p class="value">${data.collectionRate === null
        ? '<span class="muted">nothing due yet</span>' : data.collectionRate + '%'}</p>
      <p class="meta">Of payments already due, how much was posted in time</p></div>
    <div class="stat"><p class="label">Past due date</p>
      <p class="value" style="${pay.pastDueCents ? 'color:var(--red-600);' : ''}">${money(pay.pastDueCents || 0)}</p>
      <p class="meta">${pay.pastDueCount || 0} reservation${pay.pastDueCount === 1 ? '' : 's'} to confirm with the vendor</p></div>`;

  const cf = data.cashflow || [];
  document.getElementById('cashflow').innerHTML = cf.length
    ? `<div class="table-wrap"><table>
        <thead><tr><th>${data.by === 'week' ? 'Week due' : 'Month due'}</th><th class="num">Payments</th>
          <th class="num">Posted</th><th class="num">Still due</th></tr></thead>
        <tbody>${cf.map((m) => `<tr>
          <td><span class="name">${esc(monthLabel(m.month))}</span></td>
          <td class="num">${m.payments}</td>
          <td class="num">${money(m.posted_cents)}</td>
          <td class="num" style="${m.outstanding_cents ? 'color:var(--amber-600);' : ''}">${money(m.outstanding_cents)}</td>
        </tr>`).join('')}</tbody></table></div>`
    : '<div class="empty"><p>No scheduled client payments yet. Build a schedule on a reservation to see this.</p></div>';

  if (!data.byMonth.length) {
    chart.innerHTML = '<div class="empty"><h3>Nothing to chart yet</h3><p>Reservations with a departure date and a booked status show up here.</p></div>';
    table.innerHTML = '';
    return;
  }

  const max = Math.max(...data.byMonth.map((m) => m.gross_cents || 0), 1);
  // Simple inline bar chart. Keeps the page dependency free.
  //
  // Weeks are narrower and only every third one is named. Fifty-two bars at
  // the month width is a chart nobody can see the shape of, and fifty-two
  // labels at that width overlap into a grey smear.
  const week = data.by === 'week';
  const bar = week ? 22 : 46;
  const every = week ? 3 : 1;
  chart.innerHTML = `<p class="muted" style="font-size:.78rem;margin:0 0 .6rem;">${esc(rangeLabel(data))}</p>
    <div style="display:flex;align-items:flex-end;gap:${week ? '.2rem' : '.5rem'};height:190px;overflow-x:auto;padding-top:.5rem;">
    ${data.byMonth.map((m, i) => {
      const h = Math.max(Math.round(((m.gross_cents || 0) / max) * 150), 3);
      const named = i % every === 0 || i === data.byMonth.length - 1;
      return `<div style="flex:0 0 ${bar}px;text-align:center;">
        <div title="${esc(monthLabel(m.month))}: ${esc(money(m.gross_cents))} gross, ${esc(money(m.commission_cents))} commission"
             style="height:${h}px;background:linear-gradient(180deg,var(--navy-600),var(--navy-800));border-radius:5px 5px 0 0;"></div>
        <div style="font-size:.66rem;color:var(--ink-400);margin-top:.35rem;white-space:nowrap;">${
          named ? esc(monthLabel(m.month)) : '&nbsp;'}</div>
      </div>`;
    }).join('')}
  </div>`;

  // Only an owner looking at more than themselves gets this, and only when
  // there is more than one line to compare.
  const rows = data.byAdvisor || [];
  const card = document.getElementById('advisor-card');
  card.hidden = !(data.scope && data.scope.all && rows.length > 1);
  if (!card.hidden) {
    const top = Math.max(...rows.map((r) => r.gross_cents || 0), 1);
    // Only shown when somebody is actually on a split. An agency of one would
    // otherwise get two identical columns and a question about which is which.
    const split = rows.some((r) => (r.advisor_share_cents || 0) !== (r.commission_cents || 0));
    // A totals line, because the first question anybody asks of a table of
    // people is what it comes to.
    const sum = (k) => rows.reduce((n, r) => n + (Number(r[k]) || 0), 0);

    advisorReport = {
      columns: ['Advisor', 'Clients', 'New this year', 'Reservations', 'Volume',
        'Commission billed', ...(split ? ['They keep', 'Agency keeps'] : []),
        'Received from vendors', 'Paid out', 'Still to pay'],
      rows: rows.map((r) => [r.advisor_name, r.clients || 0, r.new_clients || 0, r.bookings,
        money(r.gross_cents), money(r.commission_cents),
        ...(split ? [money(r.advisor_share_cents), money(r.agency_share_cents)] : []),
        money(r.commission_paid_cents), money(r.paid_out_cents), money(r.due_cents)]),
      total: ['All advisors', sum('clients'), sum('new_clients'), sum('bookings'),
        money(sum('gross_cents')), money(sum('commission_cents')),
        ...(split ? [money(sum('advisor_share_cents')), money(sum('agency_share_cents'))] : []),
        money(sum('commission_paid_cents')), money(sum('paid_out_cents')), money(sum('due_cents'))],
    };

    document.getElementById('by-advisor').innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Advisor</th><th class="num">Clients</th><th class="num" title="Clients whose first trip departs this year, or who have no trip yet and were added this year. The book an advisor brought with them when they joined is not counted as new.">New this year</th>
        <th class="num">Reservations</th><th class="num">Volume</th>
        <th class="num">Commission billed</th>${split
          ? '<th class="num">They keep</th><th class="num">Agency keeps</th>' : ''}
        <th class="num">Received</th><th class="num">Paid out</th>
        <th class="num">Still to pay</th><th>Share</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td><span class="name">${esc(r.advisor_name)}</span>${r.role === 'admin' ? ' <span class="badge badge-navy">owner</span>' : ''}</td>
        <td class="num">${r.clients || 0}</td>
        <td class="num">${r.new_clients || 0}</td>
        <td class="num">${r.bookings}</td>
        <td class="num">${money(r.gross_cents)}</td>
        <td class="num">${money(r.commission_cents)}</td>
        ${split ? `<td class="num">${money(r.advisor_share_cents)}${
          r.default_split_pct === null || r.default_split_pct === undefined ? ''
            : `<div class="muted" style="font-size:.72rem;">${esc(String(r.default_split_pct))}%</div>`}</td>
          <td class="num">${money(r.agency_share_cents)}</td>` : ''}
        <td class="num">${money(r.commission_paid_cents)}</td>
        <td class="num">${money(r.paid_out_cents)}${r.last_paid_on
          ? `<div class="muted" style="font-size:.72rem;">${esc(r.last_paid_on)}</div>` : ''}</td>
        <td class="num">${(r.due_cents || 0) > 0
          ? `<strong>${money(r.due_cents)}</strong>` : '<span class="muted">-</span>'}</td>
        <td style="min-width:120px;"><span style="display:block;height:8px;border-radius:4px;background:var(--navy-100);">
          <span style="display:block;height:8px;border-radius:4px;width:${Math.round(((r.gross_cents || 0) / top) * 100)}%;background:var(--coral-400);"></span>
        </span></td></tr>`).join('')}
        <tr class="grand"><th>All advisors</th>
          <th class="num">${sum('clients')}</th>
          <th class="num">${sum('new_clients')}</th>
          <th class="num">${sum('bookings')}</th>
          <th class="num">${money(sum('gross_cents'))}</th>
          <th class="num">${money(sum('commission_cents'))}</th>
          ${split ? `<th class="num">${money(sum('advisor_share_cents'))}</th>
            <th class="num">${money(sum('agency_share_cents'))}</th>` : ''}
          <th class="num">${money(sum('commission_paid_cents'))}</th>
          <th class="num">${money(sum('paid_out_cents'))}</th>
          <th class="num">${money(sum('due_cents'))}</th>
          <th></th></tr></tbody></table></div>`;
  }

  drawComparison(data);
  drawMix(data);

  table.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Month</th><th class="num">Reservations</th><th class="num">Volume</th>
      <th class="num">Commission</th></tr></thead>
    <tbody>${data.byMonth.map((m) => `<tr>
      <td><span class="name">${esc(monthLabel(m.month))}</span></td>
      <td class="num">${m.bookings}</td>
      <td class="num">${money(m.gross_cents)}</td>
      <td class="num">${money(m.commission_cents)}</td></tr>`).join('')}</tbody></table></div>`;
}

/**
 * The same days this year and last, on both bases.
 *
 * Departures is when the travel happens and the money lands. Purchases is
 * when the booking was taken, which is what this month's selling produced. A
 * quiet selling month with a busy departure month looks healthy on one and
 * alarming on the other, and only the pair tells you which is true.
 */
/**
 * The advisor table as plain rows, kept for the download.
 *
 * Built where the table is built rather than scraped back out of the page
 * afterwards: a file made by reading the screen carries whatever the screen
 * happens to be showing, including the bar chart cell and a percentage in
 * small type under a figure.
 */
let advisorReport = null;

/** One CSV field, quoted the way a spreadsheet expects. */
function csvField(v) {
  const s = String(v === null || v === undefined ? '' : v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function downloadAdvisorReport() {
  if (!advisorReport) return;
  const when = new Date().toISOString().slice(0, 10);
  const lines = [advisorReport.columns, ...advisorReport.rows, advisorReport.total]
    .map((row) => row.map(csvField).join(','));
  const blob = new Blob([`\ufeff${lines.join('\r\n')}\r\n`], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `advisors-${when}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoked on the next turn of the loop: revoking it immediately races the
  // download in Safari, which has not read the blob yet.
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById('advisor-csv').addEventListener('click', downloadAdvisorReport);
document.getElementById('advisor-print').addEventListener('click', () => window.print());

function drawComparison(data) {
  const c = data.comparison;
  if (!c) { document.getElementById('comparison').innerHTML = ''; return; }

  const pct = (v) => (v === null
    ? '<span class="muted">no base</span>'
    : `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${v}%</span>`);

  const block = (title, period) => `<div class="cmp">
    <p class="cmp-title">${esc(title)}
      <span class="muted">${esc(period.from.slice(5))} to ${esc(period.to.slice(5))}</span></p>
    <!-- Four columns of money on a phone is wider than a phone. Every other
         table in the portal sits in one of these; this one did not. -->
    <div class="table-wrap">
    <table><thead><tr><th></th>
      <th class="num">${esc(period.from.slice(0, 4))}</th>
      <th class="num">${esc(period.prevFrom.slice(0, 4))}</th>
      <th class="num">Change</th></tr></thead>
    <tbody>
      <tr><td>Trips booked</td><td class="num">${money(period.now.grossCents)}</td>
        <td class="num muted">${money(period.prev.grossCents)}</td>
        <td class="num">${pct(period.change.gross)}</td></tr>
      <tr><td>Commission</td><td class="num">${money(period.now.commissionCents)}</td>
        <td class="num muted">${money(period.prev.commissionCents)}</td>
        <td class="num">${pct(period.change.commission)}</td></tr>
      <tr><td>Reservations</td><td class="num">${period.now.bookings}</td>
        <td class="num muted">${period.prev.bookings}</td>
        <td class="num">${pct(period.change.bookings)}</td></tr>
    </tbody></table></div></div>`;

  document.getElementById('comparison').innerHTML = `
    <p class="field-hint" style="margin:0 0 1rem;">Departures counts when people travel, which is when
      commission is earned. Purchases counts when the reservation was taken, which is what your selling
      produced. The same days are compared in both years, so eight months is never held against twelve.</p>
    <div class="cmp-grid">
      ${block('Departures, month to date', c.departure.mtd)}
      ${block('Departures, year to date', c.departure.ytd)}
      ${block('Purchases, month to date', c.purchase.mtd)}
      ${block('Purchases, year to date', c.purchase.ytd)}
    </div>`;
}

function drawMix(data) {
  const m = data.mix;
  if (!m) { document.getElementById('mix').innerHTML = ''; return; }
  document.getElementById('mix').innerHTML = `<div class="stat-grid">
    <div class="stat"><p class="label">Average spend</p><p class="value">${money(m.avgSpendCents)}</p>
      <p class="meta">Per client this year, not per reservation</p></div>
    <div class="stat"><p class="label">Insurance attached</p>
      <p class="value" style="${m.insuranceAttach !== null && m.insuranceAttach < 40 ? 'color:var(--amber-600);' : ''}">${
        m.insuranceAttach === null ? '-' : m.insuranceAttach + '%'}</p>
      <p class="meta">Of clients travelling this year who also bought cover</p></div>
    <div class="stat"><p class="label">Repeat clients</p>
      <p class="value">${m.repeatRate === null ? '-' : m.repeatRate + '%'}</p>
      <p class="meta">${m.repeatClients} of ${m.totalClients} have booked more than once</p></div>
    <div class="stat"><p class="label">Clients travelling</p><p class="value">${m.clients}</p>
      <p class="meta">Across ${m.bookings} reservation${m.bookings === 1 ? '' : 's'} this year</p></div>
  </div>`;
}


// ---------------------------------------------------------------------------
// Where clients come from
//
// Its own request, because it answers a different question from everything
// above and because the month range and the personal-travel switch mean nothing
// to it: a client came from where they came from, whatever window you are
// looking at.
// ---------------------------------------------------------------------------
function drawAttribution(a) {
  const host = document.getElementById('attribution');
  const recorded = a.rows.filter((r) => r.kind);
  const blank = a.rows.find((r) => !r.kind);

  if (!recorded.length) {
    host.innerHTML = `<div class="empty"><h3>Nothing is recorded yet</h3>
      <p>Every client can carry where they came from, and then this says what each
        channel has been worth. Set it on a lead as you take it, or on the client
        record.</p></div>`;
    document.getElementById('referrers-card').hidden = true;
    return;
  }

  host.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Channel</th><th class="num">Clients</th><th class="num">Booked</th>
        <th class="num">First</th><th class="num">Repeat</th>
        <th class="num">Trips booked</th><th class="num">Commission</th>
        <th class="num">Per client</th></tr></thead>
      <tbody>${a.rows.map((r) => `<tr${r.kind ? '' : ' class="muted"'}>
        <td><span class="name">${esc(r.name)}</span></td>
        <td class="num">${r.clients}</td>
        <td class="num">${r.bookedClients || '<span class="muted">-</span>'}</td>
        <td class="num">${r.firstBookings || '<span class="muted">-</span>'}</td>
        <td class="num">${r.repeatBookings || '<span class="muted">-</span>'}</td>
        <td class="num">${r.grossCents ? money(r.grossCents) : '<span class="muted">-</span>'}</td>
        <td class="num">${r.commissionCents ? money(r.commissionCents) : '<span class="muted">-</span>'}</td>
        <td class="num">${r.grossCents ? money(r.perClientCents) : '<span class="muted">-</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
    <p class="field-hint" style="padding:.8rem 1.25rem 1rem;margin:0;">
      A reservation is counted under the channel its client came from, so a client who
      books four trips is worth all four to whatever brought them in.
      <strong>Per client</strong> is the column to read: forty leads who never booked are
      worth less than four who did.${blank
        ? ` ${blank.clients} client${blank.clients === 1 ? ' has' : 's have'} no channel
           recorded and ${blank.clients === 1 ? 'is' : 'are'} in no total above except
           their own row.` : ''}${a.unattributed.bookings
        ? ` ${a.unattributed.bookings} reservation${a.unattributed.bookings === 1 ? '' : 's'}
           worth ${money(a.unattributed.grossCents)} ${a.unattributed.bookings === 1
             ? 'is' : 'are'} attached to no client record at all, so ${
             a.unattributed.bookings === 1 ? 'it is' : 'they are'} in no channel.` : ''}</p>`;

  const refs = a.referrers;
  document.getElementById('referrers-card').hidden = !refs.length;
  if (!refs.length) return;
  document.getElementById('referrers').innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Client</th><th class="num">Sent</th><th class="num">Booked</th>
        <th class="num">Trips booked</th></tr></thead>
      <tbody>${refs.map((r) => `<tr>
        <td><a class="name" href="/app/client?id=${esc(r.id)}">${esc(r.name)}</a></td>
        <td class="num">${r.sent}</td>
        <td class="num">${r.booked || '<span class="muted">-</span>'}</td>
        <td class="num">${r.grossCents ? money(r.grossCents) : '<span class="muted">-</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
    <p class="field-hint" style="padding:.8rem 1.25rem 1rem;margin:0;">
      Worth a thank you, and worth asking again: a client who has sent you somebody once
      is the likeliest person in the book to do it twice.</p>`;
}

async function loadAttribution() {
  try {
    const a = await api(`/api/reports/attribution${
      advisorParam() ? '?' + advisorParam() : ''}`);
    drawAttribution(a);
  } catch (err) { showError(document.getElementById('attribution'), err); }
}

const dates = document.getElementById('dates');
const fromEl = document.getElementById('from');
const toEl = document.getElementById('to');
const byEl = document.getElementById('by');

function query() {
  const q = [];
  if (range.value === 'custom') {
    if (fromEl.value) q.push(`from=${encodeURIComponent(fromEl.value)}`);
    if (toEl.value) q.push(`to=${encodeURIComponent(toEl.value)}`);
    // Neither filled in yet is still a request, and it should mean the same
    // as it did a moment ago rather than the whole book.
    if (!q.length) q.push('months=12');
  } else {
    q.push(`months=${range.value}`);
  }
  if (byEl.value === 'week') q.push('by=week');
  if (personal.value) q.push('personal=1');
  if (advisorParam()) q.push(advisorParam());
  return q.join('&');
}

async function load() {
  chart.innerHTML = '<p class="spinner">Loading...</p>';
  try {
    const d = await api(`/api/reports/production?${query()}`);
    mountScopePicker(document.getElementById('scope'), d, load);
    render(d);
  }
  catch (err) { showError(chart, err); }
}
range.addEventListener('change', () => {
  dates.hidden = range.value !== 'custom';
  // Nothing to ask for until one of them is filled in, and reloading on the
  // way to the date picker throws the report away for no reason.
  if (range.value === 'custom' && !fromEl.value && !toEl.value) return;
  load();
});
fromEl.addEventListener('change', load);
toEl.addEventListener('change', load);
byEl.addEventListener('change', load);
personal.addEventListener('change', load);
await load();
await loadAttribution();
</script>
</body></html>
