<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Campaigns &amp; funnels</h1><p class="sub">Funnels, campaigns, email templates, links, social and blog, from CTT Tools.</p></div>
      <div class="toolbar" style="margin:0;">
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        <button class="btn btn-primary btn-sm" id="new-post">New social post</button>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <div class="tabs" id="tabs"></div>
      <section class="card" id="panel"><p class="spinner">Loading...</p></section>
    </div>
  </div>
</div>
<dialog id="post-dialog">
  <form id="post-form" method="dialog">
    <div class="card-head"><h2>New social post</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dialog-body">
      <div class="notice notice-error" hidden></div>
      <div class="field"><label>Post to</label>
        <div id="accounts"></div>
        <p class="field-hint" id="no-accounts" hidden>No connected social accounts.</p></div>
      <div class="field"><label for="summary">Post</label>
        <textarea id="summary" name="summary" required placeholder="Five nights to the Bahamas from $499..."></textarea></div>
      <div class="field"><label for="scheduleDate">Schedule for</label>
        <input id="scheduleDate" name="scheduleDate" type="datetime-local">
        <p class="field-hint">Leave blank to save it as a draft.</p></div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Create post</button>
    </div>
  </form>
</dialog>

<script type="module">
import { api, mountShell, esc, timeAgo, showError, onSubmit } from '/js/app.js';
await mountShell();

const tabsEl = document.getElementById('tabs');
const panel = document.getElementById('panel');
let data = null;
let active = 'funnels';

const TABS = [
  { key: 'funnels', label: 'Funnels' },
  { key: 'campaigns', label: 'Campaigns' },
  { key: 'emailTemplates', label: 'Email templates' },
  { key: 'triggerLinks', label: 'Trigger links' },
  { key: 'socialAccounts', label: 'Social accounts' },
  { key: 'socialPosts', label: 'Social posts' },
  { key: 'blogPosts', label: 'Blog posts' },
];

const ROW = {
  funnels: (f) => [f.name, [f.type, f.url].filter(Boolean).join('  ·  '), f.updatedAt],
  campaigns: (c) => [c.name, c.status, c.createdAt],
  emailTemplates: (t) => [t.name, t.type, t.updatedAt],
  triggerLinks: (l) => [l.name, l.redirectTo, null],
  socialAccounts: (a) => [a.name, a.platform, null],
  socialPosts: (p) => [p.summary || '(no text)', p.status, p.publishedAt || p.createdAt],
  blogPosts: (b) => [b.title, b.status, b.publishedAt],
};

function renderTabs() {
  tabsEl.innerHTML = TABS.map((t) => {
    const n = (data && Array.isArray(data[t.key])) ? data[t.key].length : 0;
    const off = data && data.unavailable && data.unavailable[t.key];
    return `<button class="tab" type="button" role="tab" data-key="${t.key}"
      aria-selected="${t.key === active}">${esc(t.label)}<span class="n">${off ? '—' : n}</span></button>`;
  }).join('');
  tabsEl.querySelectorAll('[data-key]').forEach((b) =>
    b.addEventListener('click', () => { active = b.dataset.key; renderTabs(); renderPanel(); }));
}

function renderPanel() {
  const off = data.unavailable && data.unavailable[active];
  const items = Array.isArray(data[active]) ? data[active] : [];
  if (off) {
    panel.innerHTML = '<div class="empty"><p>This area is not available with the current CTT Tools permissions.</p></div>';
    return;
  }
  if (!items.length) {
    panel.innerHTML = '<div class="empty"><h3>Nothing here yet</h3><p>Anything created in CTT Tools shows up on this tab.</p></div>';
    return;
  }
  panel.innerHTML = `<ul class="rows">${items.map((it) => {
    const [title, meta, when] = ROW[active](it);
    return `<li><div class="row-between">
      <div style="min-width:0;"><div class="t">${esc(title || 'Untitled')}</div>
        ${meta ? `<div class="m">${esc(meta)}</div>` : ''}</div>
      <div class="muted" style="white-space:nowrap;">${esc(when ? timeAgo(when) : '')}</div>
    </div></li>`;
  }).join('')}</ul>`;
}

async function load() {
  panel.innerHTML = '<p class="spinner">Loading...</p>';
  try { data = await api('/api/marketing'); renderTabs(); renderPanel(); }
  catch (err) { tabsEl.innerHTML = ''; showError(document.getElementById('err'), err); panel.innerHTML = ''; }
}
const postDlg = document.getElementById('post-dialog');
document.getElementById('new-post').addEventListener('click', () => {
  const f = document.getElementById('post-form');
  f.reset();
  f.querySelector('.notice-error').hidden = true;
  const accounts = (data && Array.isArray(data.socialAccounts)) ? data.socialAccounts : [];
  document.getElementById('accounts').innerHTML = accounts.map((a) =>
    `<label style="display:flex;gap:.5rem;align-items:center;font-weight:400;margin-bottom:.35rem;">
       <input type="checkbox" class="acct" value="${esc(a.id)}" style="width:auto;">
       ${esc(a.name)} <span class="muted">${esc(a.platform)}</span></label>`).join('');
  document.getElementById('no-accounts').hidden = accounts.length > 0;
  postDlg.showModal();
});
postDlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => postDlg.close()));
onSubmit(document.getElementById('post-form'), async (values) => {
  const accountIds = [...document.querySelectorAll('.acct:checked')].map((c) => c.value);
  if (!accountIds.length) throw new Error('Choose at least one account to post to.');
  await api('/api/marketing/social', {
    method: 'POST',
    body: { ...values, accountIds, scheduleDate: values.scheduleDate ? new Date(values.scheduleDate).toISOString() : '' },
  });
  postDlg.close();
  active = 'socialPosts';
  await load();
});

document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
