<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Invoices</h1><p class="sub">Invoices and payments from CTT Tools, against what your reservations expect.</p></div>
      <div class="toolbar" style="margin:0;">
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        <button class="btn btn-primary btn-sm" id="new-invoice">Raise invoice</button>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <section id="stats" class="stat-grid"></section>
      <section class="card" id="reconcile" hidden></section>
      <section class="card">
        <div class="card-head"><h2>Invoices</h2><span class="muted" id="inv-count"></span></div>
        <div id="invoices"><p class="spinner">Loading...</p></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Transactions</h2><span class="muted" id="tx-count"></span></div>
        <div id="transactions"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Subscriptions</h2><span class="muted" id="sub-count"></span></div>
        <div id="subscriptions"></div>
      </section>
    </div>
  </div>
</div>
<dialog id="inv-dialog">
  <form id="inv-form" method="dialog">
    <div class="card-head"><h2>Raise an invoice</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dialog-body">
      <div class="notice notice-error" hidden></div>
      <div class="field picker">
        <label for="contact-search">Client</label>
        <input id="contact-search" autocomplete="off" placeholder="Search a name, email or phone">
        <input type="hidden" name="contactId" id="contactId">
        <div class="picker-results" id="picker" hidden></div>
        <p class="field-hint" id="picked"></p>
      </div>
      <div class="field">
        <label for="inv-name">Invoice name</label>
        <input id="inv-name" name="name" required placeholder="Bahamas cruise, March 2027">
      </div>

      <p style="font-size:.8rem;font-weight:600;color:var(--navy-800);margin:1.2rem 0 .5rem;">Line items</p>
      <div id="items"></div>
      <button class="btn btn-ghost btn-sm" type="button" id="add-item">Add line</button>

      <div class="field-row" style="margin-top:1.2rem;">
        <div class="field"><label for="issueDate">Issue date</label>
          <input id="issueDate" name="issueDate" type="date"></div>
        <div class="field"><label for="dueDate">Due date</label>
          <input id="dueDate" name="dueDate" type="date"></div>
      </div>
      <div class="field"><label for="notes">Terms or notes</label>
        <textarea id="notes" name="notes" placeholder="Deposit due at booking, balance 60 days before sailing."></textarea></div>
      <label style="display:flex;gap:.55rem;align-items:center;font-weight:500;">
        <input type="checkbox" id="send" name="send" style="width:auto;">
        Email it to the client straight away
      </label>
      <p class="field-hint">Leave unticked to raise it as a draft you can review first.</p>
    </div>
    <div class="dialog-foot">
      <span class="muted" id="total" style="margin-right:auto;align-self:center;"></span>
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Create invoice</button>
    </div>
  </form>
</dialog>

<script type="module">
import { api, mountShell, esc, money, timeAgo, showError, onSubmit } from '/js/app.js';
await mountShell();

const panelInv = document.getElementById('invoices');
const panelTx = document.getElementById('transactions');
const statsEl = document.getElementById('stats');
const errBox = document.getElementById('err');

const INV_TONE = {
  paid: 'badge-green', sent: 'badge-amber', overdue: 'badge-red',
  draft: 'badge-navy', void: 'badge-red', partially_paid: 'badge-amber',
  payment_processing: 'badge-amber',
};
const TX_TONE = { succeeded: 'badge-green', paid: 'badge-green', failed: 'badge-red', pending: 'badge-amber' };

function render(d) {
  const s = d.stats;
  statsEl.innerHTML = `
    <div class="stat"><p class="label">Invoiced</p><p class="value">${money(s.invoicedCents)}</p>
      <p class="meta">${s.invoiceCount} invoice${s.invoiceCount === 1 ? '' : 's'}</p></div>
    <div class="stat"><p class="label">Collected</p><p class="value">${money(s.collectedCents)}</p>
      <p class="meta">Recorded against invoices</p></div>
    <div class="stat"><p class="label">Outstanding</p><p class="value">${money(s.outstandingCents)}</p>
      <p class="meta">Sent but not settled</p></div>
    <div class="stat"><p class="label">Transactions</p><p class="value">${money(s.settledCents)}</p>
      <p class="meta">${s.transactionCount} successful payment${s.transactionCount === 1 ? '' : 's'}</p></div>`;

  // The point of this page: what reservations expect against what the CRM has seen.
  const b = d.bookings;
  const gap = b.grossCents - s.invoicedCents;
  document.getElementById('reconcile').hidden = false;
  document.getElementById('reconcile').innerHTML = `
    <div class="card-head"><h2>Reservations against invoices</h2></div>
    <div class="card-pad">
      <dl class="kv" style="grid-template-columns:220px 1fr;">
        <dt>Booked volume</dt><dd>${money(b.grossCents)} <span class="muted">from your reservations</span></dd>
        <dt>Invoiced in CTT Tools</dt><dd>${money(s.invoicedCents)}</dd>
        <dt>Difference</dt><dd style="color:${gap === 0 ? 'var(--green-600)' : 'var(--amber-600)'};font-weight:650;">
          ${money(Math.abs(gap))} ${gap === 0 ? 'matched' : gap > 0 ? 'booked but not invoiced' : 'invoiced beyond reservations'}</dd>
        <dt>Commission expected</dt><dd>${money(b.commissionCents)}</dd>
        <dt>Commission received</dt><dd>${money(b.commissionPaidCents)}</dd>
      </dl>
      <p class="field-hint" style="margin-top:.9rem;">Booked volume is what you entered on the Reservations page.
      Invoiced is what exists in CTT Tools. A gap usually means an invoice has not been raised yet.</p>
    </div>`;

  document.getElementById('inv-count').textContent = d.unavailable.invoices ? 'unavailable' : `${d.invoices.length} shown`;
  panelInv.innerHTML = d.unavailable.invoices
    ? '<div class="empty"><p>Invoices are not available with the current CTT Tools permissions.</p></div>'
    : d.invoices.length
    ? `<div class="table-wrap"><table>
        <thead><tr><th>Invoice</th><th>Client</th><th>Status</th><th>Due</th>
          <th class="num">Total</th><th class="num">Paid</th></tr></thead>
        <tbody>${d.invoices.map((i) => `<tr>
          <td><span class="name">${esc(i.number || i.name || i.id.slice(0, 8))}</span>
            <div class="muted">${esc(i.name && i.number ? i.name : '')}</div></td>
          <td>${i.contactId
              ? `<a href="/app/contact?id=${encodeURIComponent(i.contactId)}">${esc(i.contactName || 'Contact')}</a>`
              : esc(i.contactName || '-')}
            <div class="muted">${esc(i.contactEmail || '')}</div></td>
          <td><span class="badge ${INV_TONE[i.status] || 'badge-navy'}">${esc(i.status.replace(/_/g, ' ') || 'unknown')}</span></td>
          <td>${i.dueDate ? esc(timeAgo(i.dueDate)) : '<span class="muted">-</span>'}</td>
          <td class="num">${money(i.totalCents)}</td>
          <td class="num">${money(i.paidCents)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty"><h3>No invoices yet</h3><p>Invoices raised in CTT Tools appear here.</p></div>';

  document.getElementById('tx-count').textContent = d.unavailable.transactions ? 'unavailable' : `${d.transactions.length} shown`;
  panelTx.innerHTML = d.unavailable.transactions
    ? '<div class="empty"><p>Transactions are not available with the current CTT Tools permissions.</p></div>'
    : d.transactions.length
    ? `<div class="table-wrap"><table>
        <thead><tr><th>Client</th><th>Status</th><th>Source</th><th>When</th><th class="num">Amount</th></tr></thead>
        <tbody>${d.transactions.map((t) => `<tr>
          <td>${t.contactId
              ? `<a href="/app/contact?id=${encodeURIComponent(t.contactId)}">${esc(t.contactName || 'Contact')}</a>`
              : esc(t.contactName || '-')}</td>
          <td><span class="badge ${TX_TONE[t.status] || 'badge-navy'}">${esc(t.status || 'unknown')}</span></td>
          <td><span class="muted">${esc(t.paymentProvider || t.entityType || '-')}</span></td>
          <td><span class="muted">${esc(t.createdAt ? timeAgo(t.createdAt) : '-')}</span></td>
          <td class="num">${money(t.amountCents)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty"><h3>No transactions yet</h3><p>Payments taken through CTT Tools appear here.</p></div>';
}

function renderSubscriptions(d) {
  const el = document.getElementById('subscriptions');
  document.getElementById('sub-count').textContent =
    d.unavailable.subscriptions ? 'unavailable' : `${d.subscriptions.length} shown`;
  el.innerHTML = d.unavailable.subscriptions
    ? '<div class="empty"><p>Subscriptions are not available with the current CTT Tools permissions.</p></div>'
    : d.subscriptions.length
    ? `<ul class="rows">${d.subscriptions.map((sub) => `<li><div class="row-between">
        <div><div class="t">${esc(sub.contactName || 'Subscriber')}</div>
          <div class="m"><span class="badge ${TX_TONE[sub.status] || 'badge-navy'}">${esc(sub.status || 'unknown')}</span></div></div>
        <div class="num">${money(sub.amountCents)}</div></div></li>`).join('')}</ul>`
    : '<div class="empty"><p>No recurring subscriptions.</p></div>';
}

async function load() {
  panelInv.innerHTML = '<p class="spinner">Loading...</p>';
  try { const d = await api('/api/billing'); render(d); renderSubscriptions(d); }
  catch (err) { statsEl.innerHTML = ''; showError(errBox, err); panelInv.innerHTML = ''; }
}
// --- raise an invoice -----------------------------------------------------
const dlg = document.getElementById('inv-dialog');
const invForm = document.getElementById('inv-form');
const itemsEl = document.getElementById('items');
const totalEl = document.getElementById('total');

function itemRow() {
  const row = document.createElement('div');
  row.className = 'field-row item-row';
  row.style.marginBottom = '.5rem';
  row.innerHTML = `
    <div class="field" style="margin:0;">
      <input class="i-name" placeholder="Description" aria-label="Line description">
    </div>
    <div class="field" style="margin:0;display:flex;gap:.5rem;">
      <input class="i-amount" inputmode="decimal" placeholder="0.00" aria-label="Amount">
      <input class="i-qty" type="number" min="1" value="1" style="max-width:72px;" aria-label="Quantity">
      <button class="icon-btn" type="button" aria-label="Remove line">&times;</button>
    </div>`;
  row.querySelector('.icon-btn').addEventListener('click', () => { row.remove(); recalc(); });
  row.querySelectorAll('input').forEach((i) => i.addEventListener('input', recalc));
  return row;
}

function recalc() {
  let cents = 0;
  itemsEl.querySelectorAll('.item-row').forEach((r) => {
    const amt = Number(String(r.querySelector('.i-amount').value).replace(/[$,\s]/g, '')) || 0;
    const qty = Number(r.querySelector('.i-qty').value) || 1;
    cents += Math.round(amt * 100) * qty;
  });
  totalEl.textContent = cents ? `Total ${money(cents)}` : '';
}

document.getElementById('add-item').addEventListener('click', () => { itemsEl.appendChild(itemRow()); recalc(); });

document.getElementById('new-invoice').addEventListener('click', () => {
  invForm.reset();
  itemsEl.innerHTML = '';
  itemsEl.appendChild(itemRow());
  document.getElementById('contactId').value = '';
  document.getElementById('picked').textContent = '';
  invForm.querySelector('.notice-error').hidden = true;
  recalc();
  dlg.showModal();
});
dlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => dlg.close()));

const contactSearch = document.getElementById('contact-search');
const picker = document.getElementById('picker');
let pickTimer;
contactSearch.addEventListener('input', () => {
  clearTimeout(pickTimer);
  const q = contactSearch.value.trim();
  if (q.length < 2) { picker.hidden = true; return; }
  pickTimer = setTimeout(async () => {
    try {
      const { contacts } = await api(`/api/leads?q=${encodeURIComponent(q)}&limit=8`);
      picker.innerHTML = contacts.length
        ? contacts.map((c) => `<button type="button" data-cid="${esc(c.id)}" data-cname="${esc(c.name)}">
            ${esc(c.name)}<br><span class="muted">${esc(c.email || c.phone || '')}</span></button>`).join('')
        : '<button type="button" disabled>No matches</button>';
      picker.hidden = false;
      picker.querySelectorAll('[data-cid]').forEach((b) => b.addEventListener('click', () => {
        document.getElementById('contactId').value = b.dataset.cid;
        document.getElementById('picked').textContent = `Invoicing ${b.dataset.cname}`;
        contactSearch.value = b.dataset.cname;
        picker.hidden = true;
      }));
    } catch { picker.hidden = true; }
  }, 300);
});

onSubmit(invForm, async (values) => {
  if (!values.contactId) throw new Error('Pick a client to invoice.');
  const items = [...itemsEl.querySelectorAll('.item-row')].map((r) => ({
    name: r.querySelector('.i-name').value,
    amount: r.querySelector('.i-amount').value,
    qty: r.querySelector('.i-qty').value,
  }));
  const res = await api('/api/billing/invoices', {
    method: 'POST',
    body: { ...values, items, send: Boolean(values.send) },
  });
  dlg.close();
  await load();
  if (res.sent) alert('Invoice created and emailed to the client.');
});

document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
