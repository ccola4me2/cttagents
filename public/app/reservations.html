<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservations | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Reservations</h1><p class="sub">Trips, vendor deadlines and commission.</p></div>
      <div class="toolbar" style="margin:0;">
        <span id="scope"></span>
        <a class="btn btn-primary btn-sm" href="/app/new">Add a reservation</a>
      </div>
    </header>
    <div class="content">
      <section id="stats" class="stat-grid"></section>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Client, vendor, conf #" style="min-width:250px;">
        <select id="status-filter" aria-label="Status">
          <option value="">All statuses</option>
          <option value="quoted">Quoted</option>
          <option value="booked">Booked</option>
          <option value="travelled">Travelled</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <section class="card" id="panel"><p class="spinner">Loading reservations...</p></section>
    </div>
  </div>
</div>


<script type="module">
import { api, mountShell, esc, money, dateFmt, daysUntil, showError, onSubmit,
         mountScopePicker, advisorParam } from '/js/app.js';
const ME = (await mountShell()).id;

const panel = document.getElementById('panel');
const statsEl = document.getElementById('stats');
const search = document.getElementById('search');
const statusFilter = document.getElementById('status-filter');
let cache = [];

const STATUS_TONE = { booked: 'badge-green', quoted: 'badge-amber', travelled: 'badge-navy', cancelled: 'badge-red' };

// The one status where a commission of nought is the answer rather than a
// number nobody has typed yet.
const NO_COMMISSION = 'none';

function render(bookings, stats, scope, d = {}) {
  // Only worth a column when the list spans more than one advisor. Showing
  // your own name in every row of your own list is noise.
  const showAdvisor = Boolean(scope && scope.all);
  cache = bookings;
  statsEl.innerHTML = `
    <div class="stat"><p class="label">Reservations</p><p class="value">${stats.total}</p>
      <p class="meta">${stats.booked} booked, ${stats.quoted} quoted</p></div>
    <div class="stat"><p class="label">Volume</p><p class="value">${money(stats.grossCents)}</p>
      <p class="meta">Booked and travelled</p></div>
    <div class="stat"><p class="label">Commission</p><p class="value">${money(stats.commissionCents)}</p>
      <p class="meta">${money(stats.commissionPaidCents)} received</p></div>`;

  if (!bookings.length) {
    panel.innerHTML = '<div class="empty"><h3>No reservations yet</h3><p>Add one to start tracking payment dates and commission.</p></div>';
    return;
  }

  panel.innerHTML = `
    ${d.truncated ? `<div class="notice notice-warn">Showing the first ${d.cap} only.
      Search to narrow it down; filtering what is on screen will not reach the rest.</div>` : ''}<div class="table-wrap"><table>
    <thead><tr><th>Client</th>${showAdvisor ? '<th>Advisor</th>' : ''}<th>Vendor</th><th>Conf #</th>
      <th>Trip</th><th>Departing</th><th>Final payment</th>
      <th class="num">Gross</th><th class="num">Commission</th><th></th></tr></thead>
    <tbody>${bookings.map((b) => {
      // The final payment is a cancellation deadline, not an invoice date.
      //
      // And a deadline says when the vendor wants the money, never whether it
      // arrived. Read on its own it turned a reservation paid in full red and
      // said "past due, may be cancelled", which is the most alarming thing
      // this table can say and it was saying it to five rows out of six. The
      // reservation page fixed exactly this and the list was never told.
      //
      // Hard rows only, like every other money total here: a soft row is this
      // portal's own reminder to chase, and a reminder nobody needs is not the
      // vendor waiting. No hard rows at all is not the same as none left, so
      // the deadline still speaks for a reservation with no schedule on it.
      const owing = Number(b.owing_cents || 0);
      const scheduled = Number(b.hard_rows || 0) > 0;
      const settled = scheduled && owing <= 0;
      const left = daysUntil(b.final_payment_due);
      const tone = settled ? 'badge-green'
        : left === null ? '' : left < 0 ? 'badge-red' : left <= 14 ? 'badge-red' : left <= 30 ? 'badge-amber' : 'badge-navy';
      return `<tr>
        <td><a class="name" href="/app/reservation?id=${esc(b.id)}">${esc(b.client_name)}</a>
          <div><span class="badge ${STATUS_TONE[b.status] || 'badge-navy'}">${esc(b.status)}</span></div></td>
        ${showAdvisor ? `<td class="muted">${esc(b.advisor_name || '-')}</td>` : ''}
        <td>${b.supplier ? esc(b.supplier) : '<span class="muted">-</span>'}</td>
        <td>${b.confirmation_number ? esc(b.confirmation_number) : '<span class="muted">-</span>'}</td>
        <td>${esc(b.product_name || '-')}
          <div class="muted">${esc(b.destination || '')}</div></td>
        <td>${b.depart_date ? esc(dateFmt(b.depart_date)) : '<span class="muted">-</span>'}
          <div class="muted">${b.return_date ? 'back ' + esc(dateFmt(b.return_date)) : ''}</div></td>
        <td>${b.final_payment_due || settled
            ? `${b.final_payment_due ? esc(dateFmt(b.final_payment_due)) : ''}<div><span class="badge ${tone}">${
                settled ? 'paid in full'
                  : left < 0 ? 'past due, may be cancelled'
                  : left === 0 ? 'cancels today' : `cancels in ${left}d`}</span></div>`
            : '<span class="muted">-</span>'}</td>
        <!-- A dash where nothing was typed, not $0. Every other column on this
             row already says "-" for an empty field; these two answered zero,
             which reads as a free trip and a trip that earns nothing rather
             than as a price nobody has put in yet. A reservation marked no
             commission is the one case where nought is the answer, and it says
             so in words. -->
        <td class="num">${b.gross_cents
          ? money(b.gross_cents) : '<span class="muted">-</span>'}</td>
        <td class="num">${b.commission_status === NO_COMMISSION
          ? '<span class="muted">No commission</span>'
          : `${b.commission_cents ? money(b.commission_cents) : '<span class="muted">-</span>'}
             <div class="muted">${esc(b.commission_status)}</div>`}</td>
        <td class="num"><a class="btn btn-ghost btn-sm" href="/app/reservation?id=${esc(b.id)}">Open</a></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;

}

async function load() {
  panel.innerHTML = '<p class="spinner">Loading reservations...</p>';
  try {
    const params = new URLSearchParams();
    if (search.value.trim()) params.set('q', search.value.trim());
    if (statusFilter.value) params.set('status', statusFilter.value);
    if (advisorParam()) params.set('advisor', new URLSearchParams(location.search).get('advisor'));
    const data = await api(`/api/bookings${params.toString() ? '?' + params : ''}`);
    mountScopePicker(document.getElementById('scope'), data, load);
    render(data.bookings, data.stats, data.scope, data);
  } catch (err) {
    showError(panel, err);
  }
}

// Adding a reservation is a page now, so the button is a link in the markup.

let timer;
search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 350); });
statusFilter.addEventListener('change', load);


const params = new URLSearchParams(location.search);
await load();

// Arriving from search: open the reservation that was picked. It may not be in
// the list that just loaded, since the list is filtered and capped, so fall
// back to fetching that one record rather than silently doing nothing.
// Kept because links to it exist. A reservation is edited on its own page
// now, so this sends you there rather than reopening a dialog that no longer
// does the job.
// Both deep links kept, because links to them exist. A reservation is created
// and edited on its own page now, so these send you there rather than opening
// a dialog that is no longer here.
const focus = params.get('focus');
if (focus) location.replace(`/app/reservation?id=${encodeURIComponent(focus)}`);
if (params.get('new')) location.replace('/app/new');
</script>
</body></html>
