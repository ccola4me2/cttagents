<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New reservation | Trip Vara Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <a class="back-link" href="/app/reservations">&larr; All reservations</a>
        <h1>New reservation</h1>
        <p class="sub">Who is going and who it is booked with. The money comes next, on the reservation itself.</p>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>


      <section class="card">
        <div class="card-head"><h2>Reservation information</h2></div>
        <form id="new-form">
          <div class="card-pad">
            <div class="notice notice-error" hidden></div>
            <div id="fields"></div>
          </div>
          <div class="card-foot">
            <a class="btn btn-ghost" href="/app/reservations">Cancel</a>
            <button class="btn btn-primary" type="submit">Next: pricing</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>

<script type="module">
import { api, mountShell, esc, dateFmt, showError, onSubmit } from '/js/app.js';
import { mountSupplierPicker } from '/js/supplier-picker.js';
import { mountClientSuggest } from '/js/client-suggest.js';
await mountShell();

const err = document.getElementById('err');
const form = document.getElementById('new-form');

const OPT_LABEL = {
  event_ticket: 'Event ticket', visa_passport: 'Visa or passport', car: 'Car hire',
  covered_elsewhere: 'Covered elsewhere', purchased_outside: 'Bought elsewhere',
  unknown: 'Not discussed yet',
};
const optionText = (v) => OPT_LABEL[v] || (v ? v[0].toUpperCase() + v.slice(1) : '');
const selectOptions = (list, current) => (list || [])
  .map((v) => `<option value="${esc(v)}"${v === current ? ' selected' : ''}>${esc(optionText(v))}</option>`)
  .join('');

// The lists come from the API rather than being written out here, so this form
// and the validator behind it cannot disagree about what a status may be.
const list = await api('/api/bookings?limit=1').catch(() => ({}));
const o = list.fieldOptions || {};
const ME = (await api('/api/auth/me').catch(() => ({}))).user?.id;

// Only the advisor's own open groups: a reservation cannot be sold out of
// somebody else's block.
const groups = await api('/api/groups?status=open')
  .then((g) => g.groups.filter((x) => x.user_id === ME)).catch(() => []);

// The CRM people currently on offer, by name, so choosing one can carry their
// contact id and details onto the reservation instead of just their name.
let crmByName = new Map();

// The box itself is shared with the task form, which asks the same question
// for the same reason. See /js/client-suggest.js.
const suggestClients = (input) => mountClientSuggest(input, {
  onChoose(row) { if (row.source === 'crm') crmByName.set(row.name, row); },
});

const text = (name, label, extra = '') => `
  <div class="field"><label for="f-${name}">${esc(label)}</label>
    <input id="f-${name}" name="${name}" ${extra}></div>`;
const date = (name, label) => `
  <div class="field"><label for="f-${name}">${esc(label)}</label>
    <input id="f-${name}" name="${name}" type="date"></div>`;
const select = (name, label, options, value) => `
  <div class="field"><label for="f-${name}">${esc(label)}</label>
    <select id="f-${name}" name="${name}">${selectOptions(options, value)}</select></div>`;
const row = (...cells) => `<div class="field-row">${cells.join('')}</div>`;
const group = (title) => `<p class="label" style="margin:1.4rem 0 .4rem;">${esc(title)}</p>`;

document.getElementById('fields').innerHTML = [
  group('Who and what'),
  row(text('clientName', 'Client', 'required autofocus'),
      select('status', 'Status', o.statuses, 'quoted')),

  // Asked rather than left to be noticed. It was a tickbox under the product
  // type, which is where somebody booking their own holiday in a hurry would
  // never look, and answering it wrong puts them on their own call list.
  `<div class="field"><label for="f-reservation-type">Reservation type</label>
     <select id="f-reservation-type">
       <option value="client">Client reservation</option>
       <option value="personal">My own travel</option>
     </select>
     <p class="field-hint" id="type-hint">Whose trip this is. Your own travel stays off the lists
       of clients to ring, and the commission on it still counts.</p></div>`,

  row(select('productType', 'Type', o.productTypes, 'cruise'),
      select('bookingMethod', 'Booked through', o.bookingMethods, 'direct')),

  group('Vendor'),
  // Filled in by the shared supplier picker once the vendors and the catalog
  // are loaded. Empty until then rather than a shell of disabled boxes.
  '<div id="vendor-pick-field"></div>',
  row(text('supplier', 'Vendor'), text('productName', 'Ship, hotel or product')),
  row(text('confirmationNumber', 'Confirmation number'),
      select('insuranceStatus', 'Insurance', o.insuranceStatuses, 'unknown')),
  groups.length
    ? `<div class="field"><label for="f-groupId">Sold from a group</label>
        <select id="f-groupId" name="groupId"><option value="">Not from a group</option>
        ${groups.map((g) => `<option value="${esc(g.id)}">${
          esc([g.group_code, g.name].filter(Boolean).join(' / '))}</option>`).join('')}</select></div>`
    : '',

  group('Travel'),
  row(date('departDate', 'Departing'), date('returnDate', 'Returning')),
  row(text('destination', 'Destination'), text('itinerary', 'Itinerary')),
  row(text('cabinCategory', 'Category'), text('cabin', 'Cabin or room')),

  group('Who is going'),
  `<p class="field-hint" style="margin:-.2rem 0 .6rem;">Named here, they get a column each in
    the pricing grid, and their passports get checked against the return date. The client is
    filled in as the first traveller; change it if the person who booked is not going.</p>
   <div id="traveller-rows"></div>
   <button class="btn btn-ghost btn-sm" type="button" id="add-traveller">Add another traveller</button>`,

  group('Notes'),
  '<div class="field"><textarea id="f-notes" name="notes" maxlength="2000"></textarea></div>',
].join('');

suggestClients(form.elements.clientName);

/**
 * Started from the cruise search: fill in the sailing that was chosen.
 *
 * The search answers "which sailing", and arriving here to type the line, the
 * ship and the dates back in by hand would waste the answer. Only the fields
 * the sailing actually decides are set; everything else is left alone, and all
 * of it can be typed over.
 */
(async () => {
  const sailingId = new URLSearchParams(location.search).get('sailing');
  if (!sailingId) return;

  let s;
  try {
    s = (await api(`/api/catalog/sailing?id=${encodeURIComponent(sailingId)}`)).sailing;
  } catch { return; }
  if (!s) return;

  const set = (name, value) => {
    const el = form.elements[name];
    if (el && value) el.value = value;
  };

  set('productType', 'cruise');
  form.elements.productType.dispatchEvent(new Event('change'));
  set('supplier', s.cruise_line);
  set('productName', s.ship);
  set('itinerary', s.name);
  set('destination', s.destination);
  set('departDate', s.depart_date);
  set('returnDate', s.return_date);

  const err = document.getElementById('err');
  if (err) {
    err.innerHTML = `<div class="notice notice-ok">Filled in from the catalog: ${
      esc(s.cruise_line || '')} ${esc(s.ship || '')}, ${esc(s.depart_date || '')}${
      s.nights ? `, ${s.nights} nights` : ''}. Change anything that is not right.</div>`;
  }
})();

/**
 * Who this is booked with, and which sailing.
 *
 * Both pickers live in /js/supplier-picker.js, because the groups form needs
 * exactly the same pair and the copy is the thing that drifts. This page only
 * says what "cruise" is called here and where the answers get written.
 */
(async () => {
  const host = document.getElementById('vendor-pick-field');
  if (!host) return;

  const set = (field, value) => {
    if (field === 'supplier') { form.elements.supplier.value = value; return; }
    if (field === 'vendor' && form.elements.bookingMethod
        && !form.elements.bookingMethod.value) {
      form.elements.bookingMethod.value = 'direct';
    }
  };

  const picker = await mountSupplierPicker(host, {
    typeOf: () => form.elements.productType.value,
    set,
    onSailing(r) {
      const put = (n, v) => { const el = form.elements[n]; if (el && v) el.value = v; };
      put('supplier', r.cruise_line);
      put('productName', r.ship);
      put('itinerary', r.name);
      put('destination', r.destination);
      put('departDate', r.depart_date);
      put('returnDate', r.return_date);
      put('productType', 'cruise');
    },
  });

  // The vendor already chosen may not sell the new type, so the list is drawn
  // again and the choice dropped if it is no longer in it.
  form.elements.productType.addEventListener('change', () => picker.refresh());
})();

// The client box means something different on a personal booking, so the
// label says so rather than asking for a "client" who is the advisor.
document.getElementById('f-reservation-type').addEventListener('change', (e) => {
  const own = e.target.value === 'personal';
  const label = document.querySelector('label[for="f-clientName"]');
  if (label) label.textContent = own ? 'Travelling as' : 'Client';
  document.getElementById('type-hint').textContent = own
    ? 'Your own travel. It stays off the lists of clients to ring, and the commission still counts.'
    : 'Whose trip this is. Your own travel stays off the lists of clients to ring, and the '
      + 'commission on it still counts.';
});

/**
 * The people going, named on the way in.
 *
 * CP Maxx asks for travellers on the first step of a reservation and prices
 * them on the second, which is the right order: pricing is a column per
 * person, and a reservation created without them has nobody to put in the
 * columns. Asking for a headcount instead produced a grid with one column
 * called "This trip" and no way to say that she took the drinks package.
 */
let travellerCount = 0;
function addTravellerRow(value = '') {
  travellerCount += 1;
  const n = travellerCount;
  const box = document.createElement('div');
  box.className = 'field';
  box.style.marginBottom = '.5rem';
  box.innerHTML = `<input id="t-name-${n}" class="traveller-name" maxlength="120"
    placeholder="${n === 1 ? 'Full name, as on the passport' : 'Another traveller'}"
    value="${esc(value)}">`;
  document.getElementById('traveller-rows').append(box);
  suggestClients(box.querySelector('input'));
}
addTravellerRow();
document.getElementById('add-traveller').addEventListener('click', () => addTravellerRow());

/**
 * The client is the first traveller until somebody says otherwise.
 *
 * On most reservations the person who booked is one of the people going, so
 * typing their name twice is a keystroke tax on the common case.
 *
 * It mirrors only while the box is untouched. Once the advisor edits the first
 * traveller, it stops following: somebody booking a trip for their parents
 * types the client, corrects the traveller to their mother, and must not have
 * that undone by going back to fix a typo in the client's surname.
 */
const firstTraveller = () => document.querySelector('.traveller-name');
let mirrored = '';
form.elements.clientName.addEventListener('input', () => {
  const box = firstTraveller();
  if (!box) return;
  const typed = box.value.trim();
  if (typed && typed !== mirrored) return;
  box.value = form.elements.clientName.value;
  mirrored = box.value.trim();
});


// Straight to the reservation, which is where the pricing, the travellers and
// the payment schedule are. Creating one and being left on a list is being
// sent back to look for the thing you just made.
onSubmit(form, async (values) => {
  // A checkbox reads as "on" or nothing through a form, and the API wants a
  // boolean either way round.
  values.personal = document.getElementById('f-reservation-type').value === 'personal';
  const names = [...document.querySelectorAll('.traveller-name')]
    .map((el) => el.value.trim()).filter(Boolean);
  // Nobody named means the client is the one travelling, which is true of most
  // reservations and is a better guess than a trip with no passengers.
  if (!names.length && values.clientName) names.push(values.clientName.trim());

  // Picked somebody the CRM already knows: carry their contact id through, so
  // the reservation is joined to the person the agency has been talking to
  // rather than to a new record with the same name on it.
  const known = crmByName.get(values.clientName?.trim());
  if (known?.contactId) values.ghlContactId = known.contactId;

  const res = await api('/api/bookings', { method: 'POST', body: values });
  const id = res.booking.id;

  // One at a time, and failures are not fatal: the reservation exists and the
  // names can be added on it. Losing the trip because a passenger name was
  // rejected would be the wrong way round.
  for (const [i, name] of names.entries()) {
    await api(`/api/bookings/${encodeURIComponent(id)}/travellers`,
      { method: 'POST', body: { name, isLead: i === 0 } }).catch(() => null);
  }

  location.href = `/app/reservation?id=${encodeURIComponent(id)}`;
});
</script>
</body></html>
