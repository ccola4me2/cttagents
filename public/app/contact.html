<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div>
        <a class="back-link" href="/app/leads">&larr; All leads</a>
        <h1 id="name">Loading...</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="toolbar" style="margin:0;">
        <a class="btn btn-ghost btn-sm" id="ghl-link" target="_blank" rel="noopener" hidden>Open in CTT Tools</a>
        <a class="btn btn-primary btn-sm" id="new-booking" href="/app/reservations?new=1">Add a reservation</a>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <div class="split" id="body" hidden>
        <div class="stack">
          <section class="card">
            <div class="card-head"><h2>Notes</h2></div>
            <div class="card-pad">
              <form id="note-form">
                <div class="field" style="margin-bottom:.7rem;">
                  <label class="sr-only" for="note">Add a note</label>
                  <textarea id="note" name="body" placeholder="What happened on this call?" required></textarea>
                </div>
                <button class="btn btn-secondary btn-sm" type="submit">Add note</button>
              </form>
            </div>
            <ul class="timeline" id="notes"></ul>
          </section>

          <section class="card">
            <div class="card-head"><h2>Tasks</h2></div>
            <div class="card-pad">
              <form id="task-form" class="field-row" style="margin:0;">
                <div class="field" style="margin:0;">
                  <label class="sr-only" for="title">Task</label>
                  <input id="title" name="title" placeholder="Follow up about cabin choice" required>
                </div>
                <div class="field" style="margin:0;display:flex;gap:.6rem;">
                  <input id="dueDate" name="dueDate" type="date" aria-label="Due date">
                  <button class="btn btn-secondary btn-sm" type="submit" style="white-space:nowrap;">Add</button>
                </div>
              </form>
            </div>
            <ul class="timeline" id="tasks"></ul>
          </section>

          <section class="card">
            <div class="card-head"><h2>Opportunities</h2></div>
            <div id="opps"></div>
          </section>
        </div>

        <div class="stack">
          <section class="card">
            <div class="card-head"><h2>Automations</h2></div>
            <div class="card-pad">
              <div class="notice notice-ok" id="wf-ok" hidden>Added to the workflow.</div>
              <div class="notice notice-error" id="wf-err" hidden></div>
              <form id="wf-form">
                <div class="field">
                  <label class="sr-only" for="workflowId">Workflow</label>
                  <select id="workflowId" name="workflowId" required>
                    <option value="">Loading workflows...</option>
                  </select>
                </div>
                <button class="btn btn-secondary btn-sm" type="submit" id="wf-submit" disabled>
                  Add to workflow
                </button>
              </form>
              <p class="field-hint" style="margin-top:.7rem;">Drops this contact into an automation
              in CTT Tools. Build the automation itself there.</p>
            </div>
          </section>

          <section class="card">
            <div class="card-head"><h2>Details</h2></div>
            <div class="card-pad">
              <div class="contact-head" style="margin-bottom:1.1rem;">
                <span class="avatar" id="avatar"></span>
                <div>
                  <p style="margin:0;font-weight:650;color:var(--navy-800);" id="full-name"></p>
                  <p class="muted" id="added" style="margin:0;font-size:.8rem;"></p>
                </div>
              </div>
              <dl class="kv" id="kv"></dl>
              <div id="tags" style="margin-top:1rem;"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, money, timeAgo, dateFmt, showError, onSubmit } from '/js/app.js';
await mountShell();

const id = new URLSearchParams(location.search).get('id');
const errBox = document.getElementById('err');
if (!id) {
  errBox.innerHTML = '<div class="notice notice-error">No contact id in the URL.</div>';
  throw new Error('no id');
}

const initials = (n) => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2)
  .map((p) => p[0].toUpperCase()).join('');

function renderNotes(notes, unavailable) {
  const el = document.getElementById('notes');
  if (unavailable) {
    el.innerHTML = '<li class="muted" style="padding:1rem 1.25rem;">Notes are not available with the current CTT Tools permissions.</li>';
    return;
  }
  el.innerHTML = notes.length
    ? notes.map((n) => `<li><div>${esc(n.body)}</div><div class="when">${esc(timeAgo(n.createdAt))}</div></li>`).join('')
    : '<li class="muted" style="padding:1rem 1.25rem;">No notes yet.</li>';
}

function renderTasks(tasks, unavailable) {
  const el = document.getElementById('tasks');
  if (unavailable) {
    el.innerHTML = '<li class="muted" style="padding:1rem 1.25rem;">Tasks are not available with the current CTT Tools permissions.</li>';
    return;
  }
  if (!tasks.length) {
    el.innerHTML = '<li class="muted" style="padding:1rem 1.25rem;">No open tasks.</li>';
    return;
  }
  el.innerHTML = tasks.map((t) => `
    <li class="task ${t.completed ? 'done' : ''}">
      <input type="checkbox" ${t.completed ? 'checked' : ''} data-task="${esc(t.id)}"
             aria-label="Mark complete">
      <div>
        <div class="task-title" style="font-weight:600;color:var(--navy-800);">${esc(t.title)}</div>
        ${t.body ? `<div style="font-size:.85rem;">${esc(t.body)}</div>` : ''}
        ${t.dueDate ? `<div class="when">Due ${esc(dateFmt(String(t.dueDate).slice(0, 10)))}</div>` : ''}
      </div>
    </li>`).join('');

  el.querySelectorAll('[data-task]').forEach((box) => box.addEventListener('change', async () => {
    box.disabled = true;
    try {
      await api(`/api/leads/${encodeURIComponent(id)}/tasks/${encodeURIComponent(box.dataset.task)}`,
        { method: 'PUT', body: { completed: box.checked } });
      await load();
    } catch (e) { alert(e.message); box.checked = !box.checked; box.disabled = false; }
  }));
}

function renderOpps(opps, unavailable) {
  const el = document.getElementById('opps');
  if (unavailable) {
    el.innerHTML = '<div class="empty"><p>Opportunities are not available with the current CTT Tools permissions.</p></div>';
    return;
  }
  el.innerHTML = opps.length
    ? `<div class="table-wrap"><table><thead><tr><th>Deal</th><th>Status</th><th class="num">Value</th></tr></thead>
       <tbody>${opps.map((o) => `<tr>
         <td><span class="name">${esc(o.name)}</span></td>
         <td><span class="badge badge-navy">${esc(o.status)}</span></td>
         <td class="num">${money(o.monetaryValue * 100)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty"><p>No deals for this contact yet.</p></div>';
}

async function load() {
  try {
    const d = await api(`/api/leads/${encodeURIComponent(id)}/detail`);
    const c = d.contact;

    document.getElementById('name').textContent = c.name;
    document.getElementById('full-name').textContent = c.name;
    document.getElementById('avatar').textContent = initials(c.name);
    document.getElementById('added').textContent = c.createdAt ? `Added ${timeAgo(c.createdAt)}` : '';
    document.getElementById('sub').textContent =
      [c.email, c.phone].filter(Boolean).join('  ·  ') || 'No contact details on file';

    const rows = [
      ['Email', c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '<span class="muted">-</span>'],
      ['Phone', c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '<span class="muted">-</span>'],
      ['Source', esc(c.source || '-')],
      ['Location', esc([c.city, c.state, c.country].filter(Boolean).join(', ') || '-')],
      ['Last update', esc(c.updatedAt ? timeAgo(c.updatedAt) : '-')],
    ];
    document.getElementById('kv').innerHTML =
      rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('');

    document.getElementById('tags').innerHTML = c.tags.length
      ? c.tags.map((t) => `<span class="badge badge-navy" style="margin:0 .3rem .3rem 0;">${esc(t)}</span>`).join('')
      : '';

    renderNotes(d.notes, d.unavailable.notes);
    renderTasks(d.tasks, d.unavailable.tasks);
    renderOpps(d.opportunities, d.unavailable.opportunities);

    document.getElementById('new-booking').href =
      `/app/reservations?new=1&contact=${encodeURIComponent(id)}&name=${encodeURIComponent(c.name)}`;
    document.getElementById('body').hidden = false;
  } catch (err) {
    showError(errBox, err);
  }
}

// --- workflows ------------------------------------------------------------
const wfSelect = document.getElementById('workflowId');
const wfSubmit = document.getElementById('wf-submit');
try {
  const { workflows } = await api('/api/workflows');
  const usable = workflows.filter((w) => w.status !== 'draft');
  wfSelect.innerHTML = usable.length
    ? '<option value="">Choose a workflow</option>' +
      usable.map((w) => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')
    : '<option value="">No published workflows</option>';
  wfSubmit.disabled = usable.length === 0;
} catch {
  wfSelect.innerHTML = '<option value="">Workflows unavailable</option>';
}

onSubmit(document.getElementById('wf-form'), async (values) => {
  if (!values.workflowId) throw new Error('Choose a workflow first.');
  const name = wfSelect.options[wfSelect.selectedIndex]?.text || '';
  await api(`/api/leads/${encodeURIComponent(id)}/workflow`, {
    method: 'POST', body: { workflowId: values.workflowId, workflowName: name },
  });
  const ok = document.getElementById('wf-ok');
  ok.textContent = `Added to ${name}.`;
  ok.hidden = false;
  setTimeout(() => { ok.hidden = true; }, 4000);
}, { errorBox: document.getElementById('wf-err') });

onSubmit(document.getElementById('note-form'), async (values) => {
  await api(`/api/leads/${encodeURIComponent(id)}/notes`, { method: 'POST', body: values });
  document.getElementById('note-form').reset();
  await load();
});

onSubmit(document.getElementById('task-form'), async (values) => {
  await api(`/api/leads/${encodeURIComponent(id)}/tasks`, { method: 'POST', body: values });
  document.getElementById('task-form').reset();
  await load();
});

await load();
</script>
</body></html>
