<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales opportunities | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Sales opportunities</h1><p class="sub">Where every live reservation stands, by stage.</p></div>
      <div class="toolbar" style="margin:0;">
        <span id="scope"></span>
        <select id="pipeline-select" aria-label="Pipeline" hidden></select>
        <select id="view" aria-label="How to show them" style="width:auto;">
          <option value="board">Board</option>
          <option value="list">List</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
      </div>
    </header>
    <div class="content">
      <section id="summary" class="stat-grid" hidden></section>
      <section id="panel"><p class="spinner">Loading pipeline...</p></section>
    </div>
  </div>
</div>


<script type="module">
import { api, mountShell, esc, money, showError, onSubmit,
  mountScopePicker, advisorParam } from '/js/app.js';
const ME = (await mountShell()).id;

// This board opens on your own work.
//
// It is a working screen rather than a report: the question it answers is
// "where do my deals stand", and an owner landing on the whole agency's is
// both noise and a way to act on somebody else's trip by mistake. Choosing
// All advisors is one click away and is remembered in the address bar, so the
// wider view is asked for rather than arrived at.
if (!new URLSearchParams(location.search).has('advisor')) {
  const url = new URL(location.href);
  url.searchParams.set('advisor', ME);
  history.replaceState(null, '', url);
}

const panel = document.getElementById('panel');
const summary = document.getElementById('summary');
const select = document.getElementById('pipeline-select');
const viewSelect = document.getElementById('view');
let lastData = null;
// Remembered per browser, because whichever of the two somebody thinks in is
// not a thing they want to re-choose every morning.
let view = (() => {
  try { return localStorage.getItem('ctt.pipeline.view') || 'board'; } catch { return 'board'; }
})();
viewSelect.value = view;
viewSelect.addEventListener('change', () => {
  view = viewSelect.value;
  try { localStorage.setItem('ctt.pipeline.view', view); } catch { /* private window */ }
  // Redrawn from what is already loaded: the two views are the same data.
  if (lastData) render(lastData);
});

function render(data) {
  lastData = data;

  const openCount = data.stages.reduce((n, s) => n + s.count, 0);
  const openValue = data.stages.reduce((n, s) => n + s.valueTotal, 0);
  summary.hidden = false;
  summary.innerHTML = `
    <div class="stat"><p class="label">Opportunities</p><p class="value">${openCount}</p>
      <p class="meta">${esc(data.pipeline.name)}</p></div>
    <div class="stat"><p class="label">Pipeline value</p><p class="value">${money(openValue * 100)}</p>
      <p class="meta">Across all stages shown</p></div>
    <div class="stat"><p class="label">Stages</p><p class="value">${data.stages.length}</p>
      <p class="meta">In this pipeline</p></div>`;

  if (view === 'list') { drawList(data); return; }

  panel.innerHTML = `<div class="board">${data.stages.map((s) => `
    <div class="board-col"${s.id ? ` data-stage="${esc(s.id)}"` : ''}>
      <h3>${esc(s.name)}</h3>
      <p class="col-meta">${s.count} &middot; ${money(s.valueTotal * 100)}</p>
      ${s.opportunities.map((o) => `
        <article class="opp${data.derived ? ' opp-link' : ''}"${
          data.derived ? '' : ' draggable="true"'} data-opp="${esc(o.id)}">
          ${o.href ? `<a class="t" href="${esc(o.href)}">${esc(o.name)}</a>`
            : `<p class="t">${esc(o.name)}</p>`}
          ${o.contactName ? `<p class="c">${esc(o.contactName)}</p>` : ''}
          ${o.monetaryValue ? `<p class="v">${money(o.monetaryValue * 100)}</p>` : ''}
          ${o.departDate ? `<p class="c">Departs ${esc(o.departDate)}</p>` : ''}
          ${data.derived ? '' : `<div class="move">
            <label class="sr-only" for="mv-${esc(o.id)}">Move stage</label>
            <select id="mv-${esc(o.id)}" data-move="${esc(o.id)}">
              ${data.stages.filter((st) => st.id).map((st) =>
                `<option value="${esc(st.id)}"${st.id === o.stageId ? ' selected' : ''}>${esc(st.name)}</option>`).join('')}
            </select>
          </div>`}
        </article>`).join('') || '<p class="muted" style="font-size:.8rem;">Nothing here.</p>'}
    </div>`).join('')}</div>`;

  // Dragging moves a CRM card. A reservation's stage is worked out from the
  // reservation, so there is nothing to drag it to: the way to move one along
  // is to send the quote or post the payment, and the card follows.
}

/**
 * The same opportunities down a page instead of across one.
 *
 * A board answers "where is everything", which is the question on a Monday. A
 * list answers "what is worth the most" and "what has not moved", which are
 * the questions when there are eighty of them and the board has become a
 * horizontal scroll nobody reads to the end of.
 *
 * Sorted by value rather than by stage, because that is the ordering a board
 * cannot express.
 */
function drawList(data) {
  const rows = data.stages.flatMap((s) =>
    s.opportunities.map((o) => ({ ...o, stageName: s.name })))
    .sort((a, b) => (b.monetaryValue || 0) - (a.monetaryValue || 0));

  if (!rows.length) {
    panel.innerHTML = `<div class="card"><div class="empty"><h3>Nothing in this pipeline</h3>
      <p>${data.derived
        ? 'Reservations appear here as soon as you take one, at whatever stage they have reached.'
        : 'Opportunities you add show up here and on the board.'}</p></div></div>`;
    return;
  }

  panel.innerHTML = `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Opportunity</th><th>Client</th><th>Stage</th>
      <th class="num">Value</th></tr></thead>
    <tbody>${rows.map((o) => `
      <tr>
        <td>${o.href ? `<a class="name" href="${esc(o.href)}">${esc(o.name)}</a>`
          : `<span class="name">${esc(o.name)}</span>`}</td>
        <td>${o.contactName ? esc(o.contactName) : '<span class="muted">-</span>'}</td>
        <td>${data.derived ? esc(o.stageName)
          : `<label class="sr-only" for="lv-${esc(o.id)}">Move stage</label>
          <select id="lv-${esc(o.id)}" data-move="${esc(o.id)}" style="width:auto;">
            ${data.stages.filter((st) => st.id).map((st) =>
              `<option value="${esc(st.id)}"${st.id === o.stageId ? ' selected' : ''}>${
                esc(st.name)}</option>`).join('')}
          </select>`}</td>
        <td class="num">${o.monetaryValue ? money(o.monetaryValue * 100) : '-'}</td>
      </tr>`).join('')}</tbody></table></div></div>`;

  // The same select the cards carry, so moving a deal works the same either way.
}

/** Drag to move, with a per-card select so touch and keyboard also work. */
async function load() {
  panel.innerHTML = '<p class="spinner">Loading the board...</p>';
  try {
    const params = [];
    if (advisorParam()) params.push(advisorParam());
    const data = await api(`/api/opportunities${params.length ? `?${params.join('&')}` : ''}`);
    mountScopePicker(document.getElementById('scope'), data, () => load());
    render(data);
  } catch (err) {
    summary.hidden = true;
    showError(panel, err);
  }
}

document.getElementById('refresh').addEventListener('click', () => load());
await load();
</script>
</body></html>
