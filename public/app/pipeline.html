<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales opportunities | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Sales opportunities</h1><p class="sub">Open opportunities by stage.</p></div>
      <div class="toolbar" style="margin:0;">
        <select id="pipeline-select" aria-label="Pipeline" hidden></select>
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        <button class="btn btn-primary btn-sm" id="new-deal">New deal</button>
      </div>
    </header>
    <div class="content">
      <section id="summary" class="stat-grid" hidden></section>
      <section id="panel"><p class="spinner">Loading pipeline...</p></section>
    </div>
  </div>
</div>

<dialog id="deal-dialog">
  <form id="deal-form" method="dialog">
    <div class="card-head"><h2>New deal</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dialog-body">
      <div class="notice notice-error" hidden></div>
      <div class="field picker">
        <label for="contact-search">Contact</label>
        <input id="contact-search" autocomplete="off" placeholder="Search a name, email or phone">
        <input type="hidden" name="contactId" id="contactId">
        <div class="picker-results" id="picker" hidden></div>
        <p class="field-hint" id="picked"></p>
      </div>
      <div class="field">
        <label for="deal-name">Deal name</label>
        <input id="deal-name" name="name" required placeholder="Bahamas cruise, March 2027">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="stageId">Stage</label>
          <select id="stageId" name="stageId"></select>
        </div>
        <div class="field">
          <label for="monetaryValue">Value (USD)</label>
          <input id="monetaryValue" name="monetaryValue" inputmode="decimal" placeholder="0">
        </div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Create deal</button>
    </div>
  </form>
</dialog>

<script type="module">
import { api, mountShell, esc, money, showError, onSubmit } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
const summary = document.getElementById('summary');
const select = document.getElementById('pipeline-select');
let lastData = null;

function render(data) {
  lastData = data;
  if (!data.pipeline) {
    panel.innerHTML = '<div class="card"><div class="empty"><h3>No pipelines found</h3><p>Create a pipeline in CTT Tools and it will show up here.</p></div></div>';
    return;
  }

  if (data.pipelines.length > 1) {
    select.hidden = false;
    select.innerHTML = data.pipelines.map((p) =>
      `<option value="${esc(p.id)}"${p.id === data.pipeline.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
  }

  const openCount = data.stages.reduce((n, s) => n + s.count, 0);
  const openValue = data.stages.reduce((n, s) => n + s.valueTotal, 0);
  summary.hidden = false;
  summary.innerHTML = `
    <div class="stat"><p class="label">Opportunities</p><p class="value">${openCount}</p>
      <p class="meta">${esc(data.pipeline.name)}</p></div>
    <div class="stat"><p class="label">Pipeline value</p><p class="value">${money(openValue * 100)}</p>
      <p class="meta">Across all stages shown</p></div>
    <div class="stat"><p class="label">Stages</p><p class="value">${data.stages.length}</p>
      <p class="meta">In this pipeline</p></div>`;

  panel.innerHTML = `<div class="board">${data.stages.map((s) => `
    <div class="board-col"${s.id ? ` data-stage="${esc(s.id)}"` : ''}>
      <h3>${esc(s.name)}</h3>
      <p class="col-meta">${s.count} &middot; ${money(s.valueTotal * 100)}</p>
      ${s.opportunities.map((o) => `
        <article class="opp" draggable="true" data-opp="${esc(o.id)}">
          <p class="t">${esc(o.name)}</p>
          ${o.contactName ? `<p class="c">${esc(o.contactName)}</p>` : ''}
          ${o.monetaryValue ? `<p class="v">${money(o.monetaryValue * 100)}</p>` : ''}
          <div class="move">
            <label class="sr-only" for="mv-${esc(o.id)}">Move stage</label>
            <select id="mv-${esc(o.id)}" data-move="${esc(o.id)}">
              ${data.stages.filter((st) => st.id).map((st) =>
                `<option value="${esc(st.id)}"${st.id === o.stageId ? ' selected' : ''}>${esc(st.name)}</option>`).join('')}
            </select>
          </div>
        </article>`).join('') || '<p class="muted" style="font-size:.8rem;">Nothing here.</p>'}
    </div>`).join('')}</div>`;

  wireBoard();
}

/** Drag to move, with a per-card select so touch and keyboard also work. */
function wireBoard() {
  let draggedId = null;

  panel.querySelectorAll('.opp[data-opp]').forEach((card) => {
    card.addEventListener('dragstart', (e) => {
      draggedId = card.dataset.opp;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    });
    card.addEventListener('dragend', () => {
      draggedId = null;
      card.classList.remove('dragging');
    });
  });

  panel.querySelectorAll('.board-col[data-stage]').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop-target'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop-target'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('drop-target');
      const id = draggedId || e.dataTransfer.getData('text/plain');
      const stageId = col.dataset.stage;
      if (!id || !stageId) return;
      await moveOpportunity(id, stageId);
    });
  });

  panel.querySelectorAll('[data-move]').forEach((sel) => {
    sel.addEventListener('change', () => moveOpportunity(sel.dataset.move, sel.value));
  });
}

async function moveOpportunity(id, stageId) {
  try {
    await api(`/api/opportunities/${encodeURIComponent(id)}`, { method: 'PUT', body: { stageId } });
    await load(select.value || undefined);
  } catch (err) {
    alert(err.message);
    await load(select.value || undefined);
  }
}

async function load(pipelineId) {
  panel.innerHTML = '<p class="spinner">Loading pipeline...</p>';
  try {
    render(await api(`/api/opportunities${pipelineId ? `?pipelineId=${encodeURIComponent(pipelineId)}` : ''}`));
  } catch (err) {
    summary.hidden = true;
    showError(panel, err);
  }
}

// --- new deal -------------------------------------------------------------
const dealDialog = document.getElementById('deal-dialog');
const dealForm = document.getElementById('deal-form');
const contactSearch = document.getElementById('contact-search');
const picker = document.getElementById('picker');

document.getElementById('new-deal').addEventListener('click', () => {
  if (!lastData || !lastData.pipeline) { alert('No pipeline to add a deal to yet.'); return; }
  dealForm.reset();
  document.getElementById('contactId').value = '';
  document.getElementById('picked').textContent = '';
  dealForm.querySelector('.notice-error').hidden = true;
  document.getElementById('stageId').innerHTML = lastData.stages
    .filter((st) => st.id)
    .map((st) => `<option value="${esc(st.id)}">${esc(st.name)}</option>`).join('');
  dealDialog.showModal();
});
dealDialog.querySelectorAll('[data-close]').forEach((b) =>
  b.addEventListener('click', () => dealDialog.close()));

let pickTimer;
contactSearch.addEventListener('input', () => {
  clearTimeout(pickTimer);
  const q = contactSearch.value.trim();
  if (q.length < 2) { picker.hidden = true; return; }
  pickTimer = setTimeout(async () => {
    try {
      const { contacts } = await api(`/api/leads?q=${encodeURIComponent(q)}&limit=8`);
      picker.innerHTML = contacts.length
        ? contacts.map((c) => `<button type="button" data-cid="${esc(c.id)}" data-cname="${esc(c.name)}">
             ${esc(c.name)}<br><span class="muted">${esc(c.email || c.phone || '')}</span></button>`).join('')
        : '<button type="button" disabled>No matches</button>';
      picker.hidden = false;
      picker.querySelectorAll('[data-cid]').forEach((b) => b.addEventListener('click', () => {
        document.getElementById('contactId').value = b.dataset.cid;
        document.getElementById('picked').textContent = `Attached to ${b.dataset.cname}`;
        contactSearch.value = b.dataset.cname;
        picker.hidden = true;
      }));
    } catch { picker.hidden = true; }
  }, 300);
});

onSubmit(dealForm, async (values) => {
  if (!values.contactId) throw new Error('Pick a contact for this deal.');
  await api('/api/opportunities', {
    method: 'POST',
    body: { ...values, pipelineId: lastData.pipeline.id, status: 'open' },
  });
  dealDialog.close();
  await load(select.value || undefined);
});

select.addEventListener('change', () => load(select.value));
document.getElementById('refresh').addEventListener('click', () => load(select.value || undefined));
await load();
</script>
</body></html>
