<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Clients</h1><p class="sub">Everyone in your book of business, prospects included.</p></div>
      <button class="btn btn-primary btn-sm" id="add-lead">Add a lead</button>
    </header>
    <div class="content">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search name, email or phone" style="min-width:260px;">
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        <span class="muted" id="count"></span>
      </div>
      <section class="card" id="panel"><p class="spinner">Loading leads...</p></section>
    </div>
  </div>
</div>

<dialog id="lead-dialog">
  <form id="lead-form" method="dialog">
    <div class="card-head"><h2>Add a lead</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dialog-body">
      <div class="notice notice-error" hidden></div>
      <div class="field-row">
        <div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName"></div>
        <div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName"></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
      <div class="field"><label for="source">Source</label><input id="source" name="source" placeholder="Referral, website, event"></div>
      <p class="field-hint">A name plus either an email or a phone number is enough to create the contact.</p>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Add lead</button>
    </div>
  </form>
</dialog>

<script type="module">
import { api, mountShell, esc, timeAgo, showError, onSubmit } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
const countEl = document.getElementById('count');
const search = document.getElementById('search');
const dialog = document.getElementById('lead-dialog');

function render(contacts, total, syncing) {
  countEl.textContent = total ? `${total} contact${total === 1 ? '' : 's'}` : '';
  if (!contacts.length) {
    // An empty list while the first import is still running is not the same
    // as having no contacts, and saying so avoids a false alarm.
    panel.innerHTML = syncing
      ? '<div class="empty"><h3>Importing your contacts</h3><p>The first import is still running. This page fills in as it goes, usually within a few minutes.</p></div>'
      : '<div class="empty"><h3>No leads yet</h3><p>Contacts you add here go straight into CTT Tools.</p></div>';
    return;
  }
  panel.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Source</th><th>Added</th></tr></thead>
    <tbody>${contacts.map((c) => `<tr data-href="/app/contact?id=${encodeURIComponent(c.id)}">
      <td><span class="name">${esc(c.name)}</span>${c.tags.length ? `<div>${c.tags.slice(0,3).map((t) => `<span class="badge badge-navy">${esc(t)}</span>`).join(' ')}</div>` : ''}</td>
      <td>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '<span class="muted">-</span>'}</td>
      <td>${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '<span class="muted">-</span>'}</td>
      <td><span class="muted">${esc(c.source || '-')}</span></td>
      <td><span class="muted">${esc(timeAgo(c.createdAt))}</span></td>
    </tr>`).join('')}</tbody></table></div>`;

  // Whole row opens the contact, but clicks on the mailto and tel links inside
  // it must still do their own thing.
  panel.querySelectorAll('tr[data-href]').forEach((row) => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      location.href = row.dataset.href;
    });
  });
}

let controller = null;
async function load() {
  if (controller) controller.abort();
  controller = new AbortController();
  panel.innerHTML = '<p class="spinner">Loading leads...</p>';
  try {
    const q = search.value.trim();
    const data = await api(`/api/leads${q ? `?q=${encodeURIComponent(q)}` : ''}`, { signal: controller.signal });
    render(data.contacts, data.total, data.syncing);
  } catch (err) {
    if (err.name === 'AbortError') return;
    countEl.textContent = '';
    showError(panel, err);
  }
}

let timer;
search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 350); });
document.getElementById('refresh').addEventListener('click', load);
document.getElementById('add-lead').addEventListener('click', () => dialog.showModal());
dialog.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => dialog.close()));

onSubmit(document.getElementById('lead-form'), async (values) => {
  await api('/api/leads', { method: 'POST', body: values });
  dialog.close();
  document.getElementById('lead-form').reset();
  await load();
});

await load();
</script>
</body></html>
