<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Messages</h1><p class="sub">SMS and email threads with your clients.</p></div>
      <div class="toolbar" style="margin:0;">
        <input id="search" type="search" placeholder="Search conversations">
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <div class="inbox" id="inbox">
        <section class="card threads" id="threads"><p class="spinner">Loading...</p></section>
        <section class="card" id="pane">
          <div class="empty"><h3>No conversation selected</h3><p>Choose a thread on the left to read it and reply.</p></div>
        </section>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, timeAgo, showError } from '/js/app.js';
await mountShell();

const threadsEl = document.getElementById('threads');
const pane = document.getElementById('pane');
const inbox = document.getElementById('inbox');
const search = document.getElementById('search');
const errBox = document.getElementById('err');
let threads = [];
let current = null;

function renderThreads() {
  if (!threads.length) {
    threadsEl.innerHTML = '<div class="empty"><h3>No conversations</h3><p>Threads appear here once a contact messages you.</p></div>';
    return;
  }
  threadsEl.innerHTML = threads.map((t) => `
    <button class="thread" type="button" data-id="${esc(t.id)}"
            aria-current="${current && current.id === t.id}">
      <div class="who">${esc(t.contactName || t.email || t.phone || 'Unknown')}
        ${t.unreadCount ? `<span class="unread">${t.unreadCount}</span>` : ''}</div>
      <div class="snip">${esc(t.lastMessageBody || 'No messages yet')}</div>
      <div class="meta">${esc(t.lastMessageType || '')} ${esc(t.lastMessageDate ? timeAgo(t.lastMessageDate) : '')}</div>
    </button>`).join('');

  threadsEl.querySelectorAll('[data-id]').forEach((b) =>
    b.addEventListener('click', () => open(b.dataset.id)));
}

function renderPane(messages) {
  const t = current;
  pane.innerHTML = `
    <div class="card-head">
      <div>
        <h2>${esc(t.contactName || t.email || t.phone || 'Conversation')}</h2>
        <p class="sub">${esc([t.email, t.phone].filter(Boolean).join('  ·  '))}</p>
      </div>
      ${t.contactId ? `<a class="btn btn-ghost btn-sm" href="/app/contact?id=${encodeURIComponent(t.contactId)}">Open contact</a>` : ''}
    </div>
    <div class="messages" id="messages">
      ${messages.length ? messages.map((m) => `
        <div class="msg ${m.direction === 'inbound' ? 'in' : 'out'}">${esc(m.body || '(no text)')}
          <span class="stamp">${esc(m.type)} ${esc(timeAgo(m.createdAt))}</span></div>`).join('')
        : '<p class="muted" style="text-align:center;">No messages in this thread yet.</p>'}
    </div>
    <form class="composer" id="send-form">
      <div class="notice notice-error" hidden></div>
      <div class="field" id="subject-field" style="margin:0 0 .6rem;" hidden>
        <label class="sr-only" for="subject">Subject</label>
        <input id="subject" name="subject" placeholder="Subject">
      </div>
      <label class="sr-only" for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write a reply..." required></textarea>
      <div class="row">
        <select id="type" name="type" aria-label="Send as">
          <option value="sms">SMS</option>
          <option value="email">Email</option>
        </select>
        <button class="btn btn-primary btn-sm" type="submit">Send</button>
      </div>
    </form>`;

  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;

  const typeSel = document.getElementById('type');
  const subjField = document.getElementById('subject-field');
  typeSel.addEventListener('change', () => { subjField.hidden = typeSel.value !== 'email'; });

  document.getElementById('send-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const btn = form.querySelector('button[type="submit"]');
    const box2 = form.querySelector('.notice-error');
    box2.hidden = true;
    btn.disabled = true;
    try {
      const values = Object.fromEntries(new FormData(form).entries());
      await api('/api/conversations/send', {
        method: 'POST',
        body: { ...values, contactId: current.contactId, conversationId: current.id },
      });
      form.reset();
      subjField.hidden = true;
      await open(current.id);
    } catch (err) {
      box2.textContent = err.message;
      box2.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });
}

async function open(id) {
  current = threads.find((t) => t.id === id) || current;
  if (!current) return;
  inbox.classList.add('viewing');
  renderThreads();
  pane.innerHTML = '<p class="spinner">Loading messages...</p>';
  try {
    const { messages } = await api(`/api/conversations/${encodeURIComponent(id)}/messages`);
    renderPane(messages);
  } catch (err) {
    showError(pane, err);
  }
}

async function load() {
  threadsEl.innerHTML = '<p class="spinner">Loading...</p>';
  try {
    const q = search.value.trim();
    const data = await api(`/api/conversations${q ? `?q=${encodeURIComponent(q)}` : ''}`);
    threads = data.conversations;
    renderThreads();
    const wanted = new URLSearchParams(location.search).get('id');
    if (wanted && threads.some((t) => t.id === wanted)) await open(wanted);
  } catch (err) {
    threadsEl.innerHTML = '';
    showError(errBox, err);
  }
}

let timer;
search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 350); });
document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
