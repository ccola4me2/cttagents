<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Media</h1><p class="sub">Files in your CTT Tools library.</p></div>
      <span class="toolbar" style="margin:0;padding:0;">
        <button class="btn btn-primary btn-sm" id="add">Add files</button>
        <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
      </span>
    </header>
    <div class="content">
      <div id="err"></div>
      <input id="picker" type="file" multiple hidden
        accept="image/*,video/*,application/pdf">
      <div id="progress"></div>
      <section class="card" id="panel"><p class="spinner">Loading files...</p></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, showError } from '/js/app.js';
await mountShell();
const panel = document.getElementById('panel');
const isImage = (n) => /\.(png|jpe?g|gif|webp|svg|avif)$/i.test(n || '');

const picker = document.getElementById('picker');
const progress = document.getElementById('progress');

document.getElementById('add').addEventListener('click', () => picker.click());

/**
 * Uploaded straight into the CTT Tools library, not stored here.
 *
 * That is where a campaign or a social post looks for a file, so a copy kept
 * on this side would be a second library to keep in step with the first.
 *
 * One at a time on purpose: the library is somebody else's API, and six
 * uploads at once is how a rate limit turns into six failures instead of one
 * slow queue. Each file says what happened to it.
 */
picker.addEventListener('change', async () => {
  const files = [...picker.files];
  picker.value = '';
  if (!files.length) return;

  document.getElementById('err').innerHTML = '';
  let done = 0;
  const failed = [];

  for (const file of files) {
    progress.innerHTML = `<div class="notice notice-info">Uploading ${
      esc(file.name)}${files.length > 1 ? ` (${done + 1} of ${files.length})` : ''}...</div>`;
    const body = new FormData();
    body.append('file', file, file.name);
    body.append('name', file.name);
    try {
      // FormData, so no JSON content type: fetch writes the boundary itself.
      const res = await fetch('/api/library/media', { method: 'POST', body });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
      done += 1;
    } catch (e) {
      failed.push(`${file.name}: ${e.message}`);
    }
  }

  progress.innerHTML = failed.length
    ? `<div class="notice notice-error">${done} uploaded, ${failed.length} not:
        ${esc(failed.join(' · '))}</div>`
    : `<div class="notice notice-ok">${done} file${done === 1 ? '' : 's'} added to the library.</div>`;

  await load();
});

async function load() {
  panel.innerHTML = '<p class="spinner">Loading files...</p>';
  try {
    const d = await api('/api/library');
    if (d.unavailable && d.unavailable.files) {
      panel.innerHTML = '<div class="empty"><p>The media library is not available with the current CTT Tools permissions.</p></div>';
      return;
    }
    if (!d.files.length) {
      panel.innerHTML = '<div class="empty"><h3>No files</h3><p>Anything uploaded to CTT Tools appears here.</p></div>';
      return;
    }
    panel.innerHTML = `<div class="media-grid">${d.files.map((f) => `
      <a class="media-item" href="${esc(f.url)}" target="_blank" rel="noopener" style="text-decoration:none;display:block;">
        ${isImage(f.name) && f.url
          ? `<img src="${esc(f.url)}" alt="" loading="lazy">`
          : '<div style="height:96px;display:flex;align-items:center;justify-content:center;color:var(--ink-400);font-size:.75rem;background:var(--navy-50);">file</div>'}
        <div class="cap">${esc(f.name)}</div>
      </a>`).join('')}</div>`;
  } catch (err) { showError(document.getElementById('err'), err); panel.innerHTML = ''; }
}
document.getElementById('refresh').addEventListener('click', load);
await load();
</script>
</body></html>
