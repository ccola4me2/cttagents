<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Dashboard</h1><p class="sub" id="greeting">Loading...</p></div>
      <div class="toolbar" style="margin:0;">
        <span id="scope"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="customise">Customise</button>
        <a class="btn btn-primary btn-sm" href="/app/reservations?new=1">New reservation</a>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <section id="stats" class="stat-grid"></section>
      <section id="stat-note"></section>
      <section id="ghl-state"></section>
      <section class="card customiser" id="customiser" hidden>
        <div class="card-head"><h2>Your dashboard</h2>
          <div class="toolbar" style="margin:0;">
            <button class="btn btn-ghost btn-sm" type="button" id="reset-layout">Reset to default</button>
            <button class="btn btn-primary btn-sm" type="button" id="done-customising">Done</button>
          </div></div>
        <div class="card-pad">
          <p class="field-hint" style="margin:0 0 .9rem;">Drag a panel to move it. Untick one to take it off
            your dashboard. Changes save as you make them, and follow you to any device you sign in on.</p>
          <div class="customise-split">
            <ul class="panel-list" id="panel-list"></ul>
            <div>
              <p class="preview-label">Where they will sit</p>
              <div class="layout-preview" id="layout-preview"></div>
            </div>
          </div>
          <div id="links-editor"></div>
        </div>
      </section>
      <section class="widgets" id="widgets"></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, money, dateFmt, timeAgo, daysUntil, showError,
         mountScopePicker, advisorParam } from '/js/app.js';
await mountShell();

const widgetsEl = document.getElementById('widgets');
let d = null;
let layout = { widgets: [], links: [] };

const fmtShort = (iso) => (iso ? dateFmt(iso).replace(/,? \d{4}$/, '') : '-');

/** A panel with its own tab strip. Tabs render lazily from a map of builders. */
function widget(title, link, tabs, initial) {
  const id = `w${Math.random().toString(36).slice(2, 8)}`;
  const el = document.createElement('section');
  el.className = 'widget';
  el.innerHTML = `
    <header><h2>${esc(title)}</h2>${link ? `<a href="${esc(link.href)}">${esc(link.label)}</a>` : ''}</header>
    ${tabs.length > 1 ? `<div class="wtabs">${tabs.map((t) => `
      <button class="wtab" type="button" data-tab="${esc(t.key)}"
        aria-selected="${t.key === initial}">${esc(t.label)}</button>`).join('')}</div>` : ''}
    <div class="wbody" id="${id}"></div>`;

  const body = el.querySelector(`#${id}`);
  const draw = (key) => {
    const tab = tabs.find((t) => t.key === key) || tabs[0];
    body.innerHTML = tab.render() || '<p class="wempty">Nothing here yet.</p>';
  };
  el.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
    el.querySelectorAll('[data-tab]').forEach((x) =>
      x.setAttribute('aria-selected', String(x.dataset.tab === b.dataset.tab)));
    draw(b.dataset.tab);
  }));
  draw(initial);
  return el;
}

function documentTable(rows, empty) {
  if (!rows.length) return `<p class="wempty">${esc(empty)}</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Traveller</th><th>Trip</th><th>Departing</th><th>Passport</th></tr></thead>
    <tbody>${rows.slice(0, 15).map((r) => {
      const days = daysUntil(r.depart_date);
      return `<tr>
        <td><span class="name">${esc(r.name)}</span>
          <div class="muted">${esc(r.client_name)}</div></td>
        <td><a href="/app/reservation?id=${esc(r.booking_id)}">${
          esc(r.product_name || r.supplier || 'reservation')}</a></td>
        <td>${esc(fmtShort(r.depart_date))}
          ${days !== null && days <= 60
            ? `<div><span class="badge ${days <= 30 ? 'badge-red' : 'badge-amber'}">in ${days}d</span></div>`
            : ''}</td>
        <td><span class="badge ${r.kind === 'expiring' ? 'badge-red' : 'badge-amber'}">${
          esc(r.detail)}</span>
          ${r.passport_expiry ? `<div class="muted">expires ${esc(fmtShort(r.passport_expiry))}</div>` : ''}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

function reservationTable(rows, cols) {
  if (!rows.length) return '';
  return `<div class="table-wrap"><table><thead><tr>${
    cols.map((c) => `<th${c.num ? ' class="num"' : ''}>${esc(c.label)}</th>`).join('')
  }</tr></thead><tbody>${rows.map((r) => `<tr>${
    cols.map((c) => `<td${c.num ? ' class="num"' : ''}>${c.cell(r)}</td>`).join('')
  }</tr></tbody>`).join('')}</tbody></table></div>`;
}

function paymentRows(list) {
  if (!list.length) return '';
  return `<div class="table-wrap"><table>
    <thead><tr><th>Due</th><th>Details</th><th class="num">Amount</th></tr></thead>
    <tbody>${list.map((p) => {
      const left = daysUntil(p.due_date);
      const hard = p.payment_class === 'hard';
      const tone = left === null ? 'badge-navy'
        : left < 0 ? 'badge-red'
        : hard && left <= 14 ? 'badge-red'
        : left <= 14 ? 'badge-amber' : 'badge-navy';
      const label = left === null ? ''
        : left < 0 ? (hard ? 'past due' : 'reminder passed')
        : hard ? `cancels in ${left}d` : `remind in ${left}d`;
      return `<tr>
        <td>${esc(fmtShort(p.due_date))}<div><span class="badge ${tone}">${esc(label)}</span></div></td>
        <td><span class="name">${esc(p.client_name)}</span>
          <div class="muted">${esc([p.supplier, p.product_name].filter(Boolean).join(' · '))}</div></td>
        <td class="num">${money(p.amount_cents)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function build() {
  const s = d.stats;
  const everyone = Boolean(d.scope && d.scope.all);
  const p = d.payStats;

  document.getElementById('greeting').textContent = `${d.user.name}, here is where things stand.`;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><p class="label">Chase this week</p><p class="value">${money(p.softDueCents)}</p>
      <p class="meta">${p.softCount} client${p.softCount === 1 ? '' : 's'} to ring in the next 7 days</p></div>
    <div class="stat"><p class="label">At risk of cancelling</p>
      <p class="value" style="${p.hardDueCents ? 'color:var(--red-600);' : ''}">${money(p.hardDueCents)}</p>
      <p class="meta">${p.hardCount} vendor deadline${p.hardCount === 1 ? '' : 's'} in the next 14 days</p></div>
    <div class="stat"><p class="label">Active reservations</p><p class="value">${s.booked}</p>
      <p class="meta">${s.quoted} quoted, ${s.travelled} travelled</p></div>
    <div class="stat"><p class="label">${everyone ? 'Agency earnings' : 'Your earnings'}</p>
      <p class="value">${money(s.commissionCents)}</p>
      <p class="meta">${money(s.commissionPaidCents)} paid out</p></div>`;

  // Said once, in plain words, because the same balance appears in both
  // figures a week apart and that is not obvious from two numbers side by side.
  document.getElementById('stat-note').innerHTML =
    `<p class="stat-note">Usually the same money twice. <strong>Chase this week</strong> is your own
     reminder to collect. <strong>At risk of cancelling</strong> is the vendor's own deadline, a week
     later, after which they cancel the trip.</p>`;

  if (d.ghlStatus === 'not_configured') showError(document.getElementById('ghl-state'), { code: 'not_configured' });
  else if (d.ghlStatus === 'error') document.getElementById('ghl-state').innerHTML =
    '<div class="notice notice-error">Could not reach CTT Tools just now. Reservation figures above are still accurate.</div>';

  drawPanels();
}

// Module scope, because the panel builders below run outside build().
const byClass = (cls) => d.upcomingPayments.filter((x) =>
  cls === 'past' ? x.due_date < d.today : (x.payment_class === cls && x.due_date >= d.today));

// --------------------------------------------------------------- panels ---
// One builder per panel id. The server holds the same list of ids and drops
// anything it does not recognise, so a panel exists in exactly two places
// rather than being spelled out again in the layout, the picker and the page.
const PANELS = {
  notices: () => widget('Notices', null, [
    { key: 'all', label: 'All', render: () => d.notices.length
      ? `<ul class="notice-list">${d.notices.map((n) => `<li class="tone-${esc(n.tone)}">
          <div class="t">${esc(n.title)}</div>
          <div class="m">${esc(n.detail)}</div>
          <a href="${esc(n.href)}">${esc(n.label)}</a></li>`).join('')}</ul>`
      : '<p class="wempty">Nothing needs you right now.</p>' },
  ], 'all'),

  tasks: () => widget('To do', { href: '/app/tasks', label: 'All tasks' }, [
    { key: 'due', label: 'Due', render: () => taskRows(openTasks().filter((t) => t.due_date && t.due_date <= d.today)) },
    { key: 'soon', label: 'Coming up', render: () => taskRows(openTasks().filter((t) => t.due_date && t.due_date > d.today)) },
    { key: 'someday', label: 'No date', render: () => taskRows(openTasks().filter((t) => !t.due_date)) },
  ], 'due'),

  month: () => monthWidget(),

  deadlines: () => widget('Deadlines', { href: '/app/payments', label: 'All payments' }, [
    { key: 'soft', label: 'To chase', render: () => paymentRows(byClass('soft')) },
    { key: 'hard', label: 'Vendor deadline', render: () => paymentRows(byClass('hard')) },
    { key: 'past', label: 'Passed', render: () => paymentRows(byClass('past')) },
  ], 'soft'),

  bookings: () => widget('Latest bookings', { href: '/app/reservations', label: 'All reservations' }, [
    { key: 'added', label: 'Newest', render: () => reservationTable(d.reservations.added, RES_COLS) },
    { key: 'modified', label: 'Recently changed', render: () => reservationTable(d.reservations.modified, RES_COLS) },
  ], 'added'),

  travelling: () => widget("Who's travelling", null, [
    { key: 'upcoming', label: 'Leaving soon', render: () => reservationTable(d.current.upcoming, CUR_COLS) },
    { key: 'traveling', label: 'Away now', render: () => reservationTable(d.current.traveling, CUR_COLS) },
    { key: 'returned', label: 'Just back', render: () => reservationTable(d.current.returned, CUR_COLS) },
  ], 'upcoming'),

  // Two tabs, not one list, because the two say different things. One is
  // "this passport will be refused"; the other is "nobody has asked". Mixing
  // them would put a certainty and a question under the same heading.
  documents: () => widget('Before they travel', null, [
    { key: 'expiring', label: 'Will be refused', render: () =>
      documentTable((d.documents || []).filter((r) => r.kind === 'expiring'),
        'No passport on file expires too close to a trip.') },
    { key: 'unknown', label: 'Nothing on file', render: () =>
      documentTable((d.documents || []).filter((r) => r.kind === 'unknown'),
        'Every traveller leaving in the next few months has a passport recorded.') },
    // Not a sales prompt. Declined is already a different fact from not asked,
    // and if something goes wrong on a trip the difference between "they
    // turned it down" and "nobody raised it" is the advisor's whole position.
    { key: 'insurance', label: 'Insurance not discussed', render: () => {
      const rows = d.insurance || [];
      if (!rows.length) return '<p class="wempty">Every upcoming trip has insurance recorded one way or the other.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Client</th><th>Trip</th><th>Departing</th><th></th></tr></thead>
        <tbody>${rows.slice(0, 15).map((b) => `<tr>
          <td><a class="name" href="/app/reservation?id=${esc(b.id)}">${esc(b.client_name)}</a>
            <div class="muted">${esc(b.supplier || '')}</div></td>
          <td>${esc(b.product_name || '-')}</td>
          <td>${esc(fmtShort(b.depart_date))}
            <div class="muted">in ${b.days_to_departure}d</div></td>
          <td>${b.past_final_payment
            ? '<span class="badge badge-red">final payment passed</span>'
            : '<span class="badge badge-amber">still time</span>'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    } },
  ], 'expiring'),

  groups: () => widget('Group space', { href: '/app/groups', label: 'All groups' }, [
    { key: 'upcoming', label: 'Open blocks', render: () => {
      const rows = d.groups || [];
      if (!rows.length) return '<p class="wempty">No group space open.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Vendor</th><th>Departing</th><th>Number / name</th><th class="num">Left</th></tr></thead>
        <tbody>${rows.map((g) => {
          const left = Math.max(0, (g.cabins_held || 0) - (g.cabins_sold || 0));
          const days = daysUntil(g.option_date);
          return `<tr>
            <td>${esc(g.vendor || '-')}</td>
            <td>${esc(fmtShort(g.depart_date))}</td>
            <td><span class="name">${esc([g.group_code, g.name].filter(Boolean).join(' / '))}</span>
              ${left > 0 && days !== null && days <= 45
                ? `<div><span class="badge ${days < 0 ? 'badge-red' : days <= 14 ? 'badge-red' : 'badge-amber'}">${
                    days < 0 ? 'space released' : `releases in ${days}d`}</span></div>` : ''}</td>
            <td class="num">${left}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    } },
  ], 'upcoming'),

  deals: () => widget('Deals in play', { href: '/app/pipeline', label: 'Pipeline' }, [
    { key: 'closed', label: 'Closed', render: () => {
      const c = d.pipeline && d.pipeline.closed;
      if (!c) return '<p class="wempty">Pipeline unavailable.</p>';
      if (!c.won && !c.lost && !c.abandoned) return '<p class="wempty">Nothing closed in the last year.</p>';
      return `<div style="padding:.9rem 1rem;">
        <p style="font-size:.82rem;margin:0 0 .7rem;">Closing rate
          <strong style="font-size:1.4rem;">${c.closingRate === null ? '-' : c.closingRate + '%'}</strong>
          <span class="muted">won against won plus lost, last 12 months</span></p>
        <div class="stage-row"><span style="min-width:6rem;">Won</span>
          <span class="n">${c.won} &middot; ${esc(money(c.wonValue * 100))}</span></div>
        <div class="stage-row"><span style="min-width:6rem;">Lost</span><span class="n">${c.lost}</span></div>
        <div class="stage-row"><span style="min-width:6rem;">Went quiet</span>
          <span class="n">${c.abandoned}<span class="muted"> (not counted in the rate)</span></span></div>
      </div>`;
    } },
    { key: 'active', label: 'Open', render: () => {
      if (!d.pipeline) return '<p class="wempty">Pipeline unavailable.</p>';
      if (!d.pipeline.openCount) return '<p class="wempty">No open opportunities.</p>';
      const total = d.pipeline.openCount;
      return `<p style="padding:.7rem 1rem 0;font-size:.82rem;">Total open:
          <strong>${total}</strong> &middot; ${money(d.pipeline.openValue * 100)}</p>
        ${d.pipeline.stages.map((st) => `<div class="stage-row">
          <span style="min-width:8rem;">${esc(st.name)}</span>
          <span class="bar"><span style="width:${Math.round((st.count / total) * 100)}%"></span></span>
          <span class="n">${st.count} · ${Math.round((st.count / total) * 100)}%</span></div>`).join('')}`;
    } },
  ], 'active'),

  rebook: () => widget('Worth a call', { href: '/app/credits', label: 'Credits' }, [
    { key: 'lapsed', label: 'Nothing booked', render: () => {
      const rows = d.rebook || [];
      if (!rows.length) return '<p class="wempty">Everyone who has travelled has something booked.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Client</th><th>Last trip</th><th class="num">Trips</th><th class="num">Lifetime</th></tr></thead>
        <tbody>${rows.map((r) => `<tr>
          <td><a class="name" href="/app/client?name=${encodeURIComponent(r.client_name)}">${esc(r.client_name)}</a>
            <div class="muted">${esc(r.last_vendor || '')}</div></td>
          <td>${esc(fmtShort(r.last_travelled))}</td>
          <td class="num">${r.trips}</td>
          <td class="num">${esc(money(r.lifetime_cents))}</td></tr>`).join('')}</tbody></table></div>`;
    } },
    // A quote sent and never followed up is the largest quiet leak in travel
    // sales, and it appears nowhere else: not in production, which counts
    // bookings, and not on the to do list, because nobody wrote a task.
    { key: 'quotes', label: 'Quotes with no answer', render: () => {
      const rows = d.quotes || [];
      if (!rows.length) return '<p class="wempty">No quote is waiting on an answer.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Client</th><th>Trip</th><th class="num">Worth</th><th>Where it stands</th></tr></thead>
        <tbody>${rows.map((q) => `<tr>
          <td><a class="name" href="/app/reservation?id=${esc(q.id)}">${esc(q.client_name)}</a>
            <div class="muted">${esc(q.supplier || '')}</div></td>
          <td>${esc(q.product_name || '-')}
            <div class="muted">${esc(q.depart_date ? fmtShort(q.depart_date) : 'no dates')}</div></td>
          <td class="num">${esc(money(q.gross_cents))}</td>
          <td>${q.state === 'unsent'
            ? '<span class="badge badge-amber">never sent</span>'
            : `<span class="badge ${q.quiet_days >= 21 ? 'badge-red' : 'badge-navy'}">quiet ${
                q.quiet_days}d</span>`}
            <div class="muted" style="font-size:.72rem;">${q.state === 'unsent'
              ? 'written, not sent to the client'
              : `sent ${q.quote_sent_count > 1 ? q.quote_sent_count + ' times' : 'once'}`}</div></td>
        </tr>`).join('')}</tbody></table></div>`;
    } },

    // The one contact in the whole arc where nothing goes wrong if you skip
    // it: no vendor cancels anything, no deadline passes, the client simply
    // drifts and books with somebody else next year.
    { key: 'welcome', label: 'Just back', render: () => {
      const rows = d.welcome || [];
      if (!rows.length) return '<p class="wempty">Everyone who is back has been rung.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Client</th><th>Trip</th><th>Home</th><th></th></tr></thead>
        <tbody>${rows.map((b) => `<tr>
          <td><a class="name" href="/app/reservation?id=${esc(b.id)}">${esc(b.client_name)}</a>
            <div class="muted">${esc(b.supplier || '')}</div></td>
          <td>${esc(b.product_name || '-')}</td>
          <td>${esc(fmtShort(b.return_date || b.depart_date))}
            <div class="muted">${b.back_days === 0 ? 'today' : `${b.back_days}d ago`}</div></td>
          <td class="num"><button class="btn btn-ghost btn-sm" data-welcomed="${esc(b.id)}">Rang them</button></td>
        </tr>`).join('')}</tbody></table></div>`;
    } },

    { key: 'birthdays', label: 'Birthdays', render: () => {
      const rows = d.birthdays || [];
      if (!rows.length) return '<p class="wempty">No birthdays in the next month, or none recorded.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Who</th><th>When</th><th class="num">Trips</th></tr></thead>
        <tbody>${rows.map((p) => `<tr>
          <td><a class="name" href="/app/client?name=${encodeURIComponent(p.client_name)}">${esc(p.name)}</a>
            ${p.email ? `<div class="muted">${esc(p.email)}</div>` : ''}</td>
          <td>${esc(fmtShort(p.on))}
            <div class="muted">${p.in_days === 0 ? 'today' : `in ${p.in_days}d`}${
              p.turning ? ` &middot; turning ${p.turning}` : ''}</div></td>
          <td class="num">${p.trips}</td>
        </tr>`).join('')}</tbody></table></div>`;
    } },

    { key: 'credits', label: 'Credits expiring', render: () => {
      const rows = (d.credits || []).filter((c) => c.expires_on).slice(0, 12);
      if (!rows.length) return '<p class="wempty">No credits on file.</p>';
      return `<div class="table-wrap"><table>
        <thead><tr><th>Expires</th><th>Client</th><th class="num">Worth</th></tr></thead>
        <tbody>${rows.map((c) => {
          const left = daysUntil(c.expires_on);
          const tone = left === null ? '' : left < 0 ? 'badge-red' : left <= 60 ? 'badge-amber' : 'badge-navy';
          return `<tr>
            <td>${esc(fmtShort(c.expires_on))}
              <div><span class="badge ${tone}">${left < 0 ? 'lapsed' : `${left}d left`}</span></div></td>
            <td><span class="name">${esc(c.client_name)}</span>
              <div class="muted">${esc(c.vendor || '')}</div></td>
            <td class="num">${esc(money(c.amount_cents))}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    } },
  ], 'lapsed'),

  goal: () => widget('Target', { href: '/app/goals', label: 'Set targets' }, [
    { key: 'now', label: 'This year', render: () => {
      const g = d.goal;
      if (!g) return '<p class="wempty">Targets unavailable.</p>';
      if (!g.set || (!g.sales.goal && !g.commission.goal && !g.bookings.goal)) {
        return '<p class="wempty">No target set for this year.</p>';
      }
      const row = (label, line, fmt) => {
        if (!line.goal) return '';
        const pct = Math.min(100, Math.max(0, (line.actual / line.goal) * 100));
        const pace = Math.min(100, Math.max(0, (line.pace / line.goal) * 100));
        const ahead = line.ahead >= 0;
        return `<div class="goal-row compact">
          <p class="goal-label">${esc(label)}<span>${fmt(line.actual)} of ${fmt(line.goal)}</span></p>
          <div class="goal-bar">
            <span class="fill ${ahead ? 'ahead' : 'behind'}" style="width:${pct}%"></span>
            <span class="pace" style="left:${pace}%"></span>
          </div>
          <p class="goal-meta"><strong class="${ahead ? 'up' : 'down'}">${
            ahead ? 'ahead by' : 'behind by'} ${fmt(Math.abs(line.ahead))}</strong></p>
        </div>`;
      };
      return `<div style="padding:.8rem 1rem;">
        ${row('Trips booked', g.sales, money)}
        ${row('Commission', g.commission, money)}
        ${row('Reservations', g.bookings, (n) => String(n))}
        <p class="muted" style="font-size:.74rem;margin:.4rem 0 0;">${g.elapsed}% of the year gone</p>
      </div>`;
    } },
  ], 'now'),

  commission: () => widget('Commission owed', { href: '/app/commissions', label: 'All commission' }, [
    { key: 'age', label: 'By age', render: () => {
      const c = d.commission;
      if (!c || !c.owedCents) return '<p class="wempty">Nothing outstanding.</p>';
      return `<div style="padding:.8rem 1rem;">
        <p style="font-size:.82rem;margin:0 0 .7rem;">Claimable now

const everyoneNow = () => Boolean(d.scope && d.scope.all);

// ------------------------------------------------------------- calendar ---
// A month of everything with a date on it: departures, returns, vendor
// deadlines, own reminders, tasks and the day a group's unsold space goes
// back. Built here rather than pulled in as a library because a month grid is
// forty two divs and a date loop.
const KIND_TONE = {
  depart: 'depart', return: 'return', hard: 'hard', soft: 'soft', task: 'task', option: 'option',
};
const KIND_NAME = {
  depart: 'Departure', return: 'Return', hard: 'Vendor deadline',
  soft: 'Reminder', task: 'Task', option: 'Group option date',
};

let monthCursor = null;

function monthWidget() {
  const el = document.createElement('section');
  el.className = 'widget';
  el.innerHTML = `<header><h2>This month</h2>
      <a href="/app/calendar">Appointments</a></header>
    <div class="wbody" id="month-body"><p class="spinner">Loading...</p></div>`;
  // Drawn after the element is in the DOM, so the fetch cannot race the mount.
  queueMicrotask(() => drawMonth(el.querySelector('#month-body')));
  return el;
}

async function drawMonth(host) {
  if (!host) return;
  const month = monthCursor || d.today.slice(0, 7);
  let data;
  try {
    data = await api(`/api/month?month=${month}${advisorParam() ? '&' + advisorParam() : ''}`);
  } catch {
    host.innerHTML = '<p class="wempty">Could not load the month.</p>';
    return;
  }
  monthCursor = data.month;

  const byDay = new Map();
  for (const e of data.events) {
    if (!byDay.has(e.date)) byDay.set(e.date, []);
    byDay.get(e.date).push(e);
  }

  const [y, m] = data.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = first.getUTCDay();
  const title = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric', timeZone: 'UTC' });

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="cal-day empty"></span>');
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${data.month}-${String(day).padStart(2, '0')}`;
    const events = byDay.get(iso) || [];
    const kinds = [...new Set(events.map((e) => e.kind))];
    cells.push(`<button type="button" class="cal-day${iso === data.today ? ' today' : ''}${
      events.length ? ' has' : ''}" data-day="${iso}"
      ${events.length ? `aria-label="${day}, ${events.length} item${events.length === 1 ? '' : 's'}"` : ''}>
      <span class="n">${day}</span>
      <span class="dots">${kinds.slice(0, 4).map((k) => `<i class="dot ${KIND_TONE[k]}"></i>`).join('')}</span>
    </button>`);
  }

  host.innerHTML = `<div class="cal">
      <div class="cal-head">
        <button type="button" class="cal-nav" data-move="-1" aria-label="Previous month">&lsaquo;</button>
        <strong>${esc(title)}</strong>
        <button type="button" class="cal-nav" data-move="1" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="cal-grid">
        ${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((n) => `<span class="cal-dow">${n}</span>`).join('')}
        ${cells.join('')}
      </div>
      <div class="cal-detail" id="cal-detail"></div>
    </div>`;

  host.querySelectorAll('[data-move]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const step = Number(btn.dataset.move);
      const next = new Date(Date.UTC(y, m - 1 + step, 1));
      monthCursor = `${next.getUTCFullYear()}-${String(next.getUTCMonth() + 1).padStart(2, '0')}`;
      drawMonth(host);
    });
  });

  const detail = host.querySelector('#cal-detail');
  const show = (iso) => {
    const events = byDay.get(iso) || [];
    host.querySelectorAll('.cal-day').forEach((c) => c.classList.toggle('picked', c.dataset.day === iso));
    if (!events.length) { detail.innerHTML = '<p class="cal-none">Nothing on this day.</p>'; return; }
    detail.innerHTML = `<ul class="rows">${events.map((e) => `<li>
      <a href="${esc(e.href)}" class="cal-event">
        <i class="dot ${KIND_TONE[e.kind]}"></i>
        <span><span class="t">${esc(e.title)}</span>
          <span class="m">${esc(KIND_NAME[e.kind])}${e.detail ? ' · ' + esc(e.detail) : ''}${
            e.amountCents ? ' · ' + esc(money(e.amountCents)) : ''}</span></span>
      </a></li>`).join('')}</ul>`;
  };

  host.querySelectorAll('.cal-day[data-day]').forEach((cell) => {
    cell.addEventListener('click', () => show(cell.dataset.day));
  });

  // Opens on today when you are looking at this month, and on the first day
  // that has anything when you are not, so paging never lands on a blank list.
  const opening = data.month === data.today.slice(0, 7)
    ? data.today
    : (data.events[0] && data.events[0].date);
  if (opening) show(opening);
  else detail.innerHTML = '<p class="cal-none">Nothing dated this month.</p>';
}
const openTasks = () => (d.tasks || []).filter((t) => !t.done_at);

/**
 * Tasks tick off in place. Going to another screen and back to record that you
 * rang somebody is how a task list stops being used by the second week.
 */
function taskRows(list) {
  if (!list.length) return '';
  return `<ul class="rows task-rows">${list.map((t) => {
    const late = t.due_date && t.due_date < d.today;
    return `<li>
      <label class="task-tick">
        <input type="checkbox" data-task="${esc(t.id)}">
        <span>
          <span class="t" style="font-size:.84rem;">${esc(t.title)}</span>
          <span class="m">${[
            t.due_date ? `<span class="${late ? 'late' : ''}">${esc(fmtShort(t.due_date))}</span>` : 'no date',
            t.priority === 'high' ? '<span class="badge badge-coral">high</span>' : '',
            t.booking_client ? esc(t.booking_client) : '',
            everyoneNow() && t.advisor_name ? esc(t.advisor_name) : '',
          ].filter(Boolean).join(' &middot; ')}</span>
        </span>
      </label></li>`;
  }).join('')}</ul>`;
}

const TYPE_LABEL = {
  cruise: 'Cruise', hotel: 'Hotel', resort: 'Resort', package: 'Package', tour: 'Tour',
  air: 'Air', rail: 'Rail', car: 'Car hire', transfer: 'Transfer', excursion: 'Excursion',
  attraction: 'Attraction', event_ticket: 'Event ticket', insurance: 'Travel insurance',
  parking: 'Parking', visa_passport: 'Visa or passport', other: 'Other',
};

/** A ranked bar list. Reads better than a pie for fifteen categories. */
function breakdown(rows, labels) {
  if (!rows || !rows.length) return '<p class="wempty">Nothing booked ahead yet.</p>';
  const top = Math.max(...rows.map((r) => r.gross_cents || 0), 1);
  return `<div style="padding:.4rem 0 .6rem;">${rows.map((r) => `
    <div class="stage-row">
      <span style="min-width:8.5rem;">${esc((labels && labels[r.label]) || r.label)}</span>
      <span class="bar"><span style="width:${Math.round(((r.gross_cents || 0) / top) * 100)}%"></span></span>
      <span class="n">${esc(money(r.gross_cents))}</span>
    </div>`).join('')}</div>`;
}

function trendBars(field) {
  const rows = d.trend || [];
  if (!rows.length) return '<p class="wempty">No booked departures yet.</p>';
  const max = Math.max(...rows.map((m) => m[field] || 0), 1);
  return `<div class="trend">${rows.map((m) => `
    <div class="trend-col" title="${esc(m.month)}: ${esc(money(m[field]))}">
      <span class="trend-bar" style="height:${Math.max(Math.round(((m[field] || 0) / max) * 96), 2)}px"></span>
      <span class="trend-label">${esc((m.month || '').slice(5))}</span>
    </div>`).join('')}</div>
    <p class="trend-foot">${esc(money(rows.reduce((n, m) => n + (m[field] || 0), 0)))} over
      ${rows.length} month${rows.length === 1 ? '' : 's'}</p>`;
}

function drawPanels() {
  const visible = layout.widgets.filter((w) => !w.hidden && PANELS[w.id]);
  widgetsEl.replaceChildren(...visible.map((w) => {
    const el = PANELS[w.id]();
    el.dataset.panel = w.id;
    return el;
  }));
  // Delegated, because a widget redraws its body whenever a tab is clicked and
  // per checkbox listeners would be lost the first time that happened.
  widgetsEl.querySelectorAll('[data-panel="tasks"]').forEach((panel) => {
    panel.addEventListener('change', async (e) => {
      const box = e.target.closest('[data-task]');
      if (!box) return;
      box.disabled = true;
      try {
        await api(`/api/tasks/${encodeURIComponent(box.dataset.task)}`,
          { method: 'PUT', body: { done: box.checked } });
        const t = (d.tasks || []).find((x) => x.id === box.dataset.task);
        if (t) t.done_at = box.checked ? Math.floor(Date.now() / 1000) : null;
        // Removed in place rather than redrawing the dashboard. Every tab of
        // this panel lists open tasks, so a ticked one leaves whichever tab
        // you are on; redrawing rebuilds every panel from its default tab, so
        // ticking a task off "Coming up" would drop you back on "Due" and you
        // would lose your place every single time.
        const row = box.closest('li');
        const list = row && row.parentElement;
        if (row) row.remove();
        if (list && !list.querySelector('li')) list.remove();
      } catch {
        box.checked = !box.checked;
        box.disabled = false;
      }
    });
  });
  // Delegated for the same reason: the panel redraws whenever a tab is clicked.
  widgetsEl.querySelectorAll('[data-panel="rebook"]').forEach((panel) => {
    panel.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-welcomed]');
      if (!btn) return;
      btn.disabled = true;
      try {
        await api(`/api/bookings/${encodeURIComponent(btn.dataset.welcomed)}/welcomed`,
          { method: 'POST', body: {} });
        d.welcome = (d.welcome || []).filter((b) => b.id !== btn.dataset.welcomed);
        // The row is removed rather than the dashboard redrawn. Redrawing
        // rebuilds every panel from its default tab, so recording a call would
        // throw you back to a different tab of the panel you were working in.
        const row = btn.closest('tr');
        const wrap = row && row.closest('.table-wrap');
        if (row) row.remove();
        if (wrap && !wrap.querySelector('tbody tr')) {
          wrap.outerHTML = '<p class="wempty">Everyone who is back has been rung.</p>';
        }
      } catch { btn.disabled = false; }
    });
  });

  if (!visible.length) {
    widgetsEl.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      <h3>Every panel is switched off</h3><p>Open Customise to put some back.</p></div>`;
  }
}

// ----------------------------------------------------------- customiser ---
// Reordering is drag and drop with a keyboard equivalent beside it. Drag alone
// would make the dashboard unarrangeable for anyone not using a mouse, and the
// arrows cost four lines.
function drawCustomiser() {
  const list = document.getElementById('panel-list');
  const byId = Object.fromEntries((d.panels || []).map((p) => [p.id, p]));

  list.innerHTML = layout.widgets.map((w, i) => {
    const meta = byId[w.id] || { title: w.id, hint: '' };
    return `<li draggable="true" data-id="${esc(w.id)}" data-index="${i}">
      <span class="pos" aria-hidden="true">${i + 1}</span>
      <span class="grip" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/>
          <circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/>
          <circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
      <label class="panel-name">
        <input type="checkbox" data-toggle="${esc(w.id)}"${w.hidden ? '' : ' checked'}>
        <span><b>${esc(meta.title)}</b><small>${esc(meta.hint || '')}</small></span>
      </label>
      <span class="move">
        <button type="button" data-move="up" data-id="${esc(w.id)}" aria-label="Move ${esc(meta.title)} up"
          ${i === 0 ? 'disabled' : ''}>&uarr;</button>
        <button type="button" data-move="down" data-id="${esc(w.id)}" aria-label="Move ${esc(meta.title)} down"
          ${i === layout.widgets.length - 1 ? 'disabled' : ''}>&darr;</button>
      </span>
    </li>`;
  }).join('');

  list.querySelectorAll('[data-toggle]').forEach((box) => {
    box.addEventListener('change', () => {
      const w = layout.widgets.find((x) => x.id === box.dataset.toggle);
      if (w) w.hidden = !box.checked;
      saveLayout();
    });
  });

  list.querySelectorAll('[data-move]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const from = layout.widgets.findIndex((x) => x.id === btn.dataset.id);
      const to = btn.dataset.move === 'up' ? from - 1 : from + 1;
      if (from < 0 || to < 0 || to >= layout.widgets.length) return;
      const [moved] = layout.widgets.splice(from, 1);
      layout.widgets.splice(to, 0, moved);
      saveLayout();
      drawCustomiser();
      // Keep the keyboard on the button that just moved, or arrowing a panel
      // down the list means finding it again after every single step.
      list.querySelector(`[data-move="${btn.dataset.move}"][data-id="${btn.dataset.id}"]`)?.focus();
    });
  });

  let dragging = null;
  list.querySelectorAll('li').forEach((li) => {
    li.addEventListener('dragstart', (e) => {
      dragging = li.dataset.id;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      // Firefox will not start a drag without something on the transfer.
      e.dataTransfer.setData('text/plain', li.dataset.id);
    });
    li.addEventListener('dragend', () => { li.classList.remove('dragging'); dragging = null; });
    li.addEventListener('dragover', (e) => {
      if (!dragging || dragging === li.dataset.id) return;
      e.preventDefault();
      li.classList.add('drop-target');
    });
    li.addEventListener('dragleave', () => li.classList.remove('drop-target'));
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      li.classList.remove('drop-target');
      if (!dragging || dragging === li.dataset.id) return;
      const from = layout.widgets.findIndex((x) => x.id === dragging);
      const to = layout.widgets.findIndex((x) => x.id === li.dataset.id);
      if (from < 0 || to < 0) return;
      const [moved] = layout.widgets.splice(from, 1);
      layout.widgets.splice(to, 0, moved);
      saveLayout();
      drawCustomiser();
    });
  });

  drawPreview();
  drawLinksEditor();
}

/**
 * A picture of the two column grid, because the list on the left is one
 * column and the dashboard is two. Without this you have to work out in your
 * head that moving something to position three puts it on the left of the
 * second row, which nobody should have to do.
 */
function drawPreview() {
  const host = document.getElementById('layout-preview');
  if (!host) return;
  const byId = Object.fromEntries((d.panels || []).map((p) => [p.id, p]));
  const shown = layout.widgets.filter((w) => !w.hidden);
  if (!shown.length) {
    host.innerHTML = '<p class="wempty">Nothing to show.</p>';
    return;
  }
  host.innerHTML = shown.map((w, i) => `<span class="preview-cell">
    <b>${i + 1}</b>${esc((byId[w.id] || {}).title || w.id)}</span>`).join('');
}

function drawLinksEditor() {
  const host = document.getElementById('links-editor');
  host.innerHTML = `<h3 style="font-size:.85rem;margin:1.4rem 0 .5rem;">Quick links</h3>
    <p class="field-hint" style="margin:0 0 .7rem;">Shortcuts to whatever you open every day: a vendor's
      booking engine, a shared drive, a supplier portal. They appear in the Quick links panel.</p>
    <ul class="rows" id="link-rows">${layout.links.map((l, i) => `<li>
      <div class="row-between">
        <span><span class="t" style="font-size:.85rem;">${esc(l.label)}</span>
          <span class="m">${esc(l.href)}</span></span>
        <button class="btn btn-ghost btn-sm" type="button" data-drop-link="${i}">Remove</button>
      </div></li>`).join('')}</ul>
    <div class="field-row" style="margin-top:.7rem;">
      <div class="field" style="margin:0;"><label for="link-label">Name</label>
        <input id="link-label" maxlength="40" placeholder="Vendor portal"></div>
      <div class="field" style="margin:0;"><label for="link-href">Address</label>
        <input id="link-href" type="url" placeholder="https://..."></div>
    </div>
    <p class="field-hint" id="link-error" style="color:var(--red-600);" hidden></p>
    <button class="btn btn-secondary btn-sm" type="button" id="add-link" style="margin-top:.6rem;">Add link</button>`;

  host.querySelectorAll('[data-drop-link]').forEach((btn) => {
    btn.addEventListener('click', () => {
      layout.links.splice(Number(btn.dataset.dropLink), 1);
      saveLayout();
      drawLinksEditor();
      drawPanels();
    });
  });

  host.querySelector('#add-link').addEventListener('click', () => {
    const label = host.querySelector('#link-label').value.trim();
    const href = host.querySelector('#link-href').value.trim();
    const error = host.querySelector('#link-error');
    // The same rule the server enforces, said here so it is a message rather
    // than a link that silently disappears on save.
    if (!label || !/^https?:\/\//i.test(href)) {
      error.textContent = 'Give it a name and a web address starting with http:// or https://.';
      error.hidden = false;
      return;
    }
    error.hidden = true;
    layout.links.push({ label, href });
    saveLayout();
    drawLinksEditor();
    drawPanels();
  });
}

/**
 * Saves in the background and redraws immediately.
 *
 * A dashboard that waits on the network before it moves a panel feels broken,
 * and the cost of being wrong is one panel in the wrong order until a reload.
 * A failure says so rather than leaving you thinking it saved.
 */
let saveTimer = null;
function saveLayout() {
  drawPanels();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await api('/api/prefs/dashboard', { method: 'PUT', body: { layout } });
      layout = res.layout;
    } catch {
      const box = document.getElementById('ghl-state');
      box.innerHTML = '<div class="notice notice-error">Could not save your dashboard layout. '
        + 'It will look right until you reload.</div>';
    }
  }, 300);
}

const customiser = document.getElementById('customiser');
document.getElementById('customise').addEventListener('click', () => {
  customiser.hidden = !customiser.hidden;
  if (!customiser.hidden) { drawCustomiser(); customiser.scrollIntoView({ block: 'nearest' }); }
});
document.getElementById('done-customising').addEventListener('click', () => { customiser.hidden = true; });
document.getElementById('reset-layout').addEventListener('click', async () => {
  const res = await api('/api/prefs/dashboard', { method: 'DELETE' });
  layout = res.layout;
  drawCustomiser();
  drawPanels();
});

try {
  d = await api(`/api/dashboard${advisorParam() ? '?' + advisorParam() : ''}`);
  layout = d.layout;
  mountScopePicker(document.getElementById('scope'), d, () => location.reload());

  // A panel that failed to build is blank, and a blank panel reads as nothing
  // to do. Said out loud instead, because "no clients to welcome home" and
  // "we could not work out who to welcome home" are different facts.
  const err = document.getElementById('err');
  if (err && d.failed?.length) {
    const names = d.failed.map((f) => (typeof f === 'string' ? f : f.name));
    // The reason, where the server worked one out. A missing column names the
    // migration to run, which turns this from a mystery into an instruction.
    const hints = [...new Set(d.failed
      .map((f) => (typeof f === 'string' ? null : f.hint))
      .filter(Boolean))];
    err.innerHTML = `<div class="notice notice-error">
      <div>${names.length} panel${names.length === 1 ? '' : 's'} could not be built, so ${
  names.length === 1 ? 'it is' : 'they are'} showing empty: ${esc(names.join(', '))}.</div>
      ${hints.map((h) => `<div style="margin-top:.4rem;">${esc(h)}</div>`).join('')}</div>`;
  }

  build();
}
catch (err) { showError(document.getElementById('ghl-state'), err); }
</script>
</body></html>
