<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTT Tools | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>CTT Tools</h1><p class="sub">The parts of CTT Tools the portal cannot rebuild, one click away.</p></div>
    </header>
    <div class="content">
      <div class="notice notice-info">
        The portal covers leads, conversations, pipeline, calendar and billing directly. Builders
        and editors have no useful API, so these open CTT Tools in a new tab, already on your
        account.
      </div>
      <section id="panel"><p class="spinner">Loading...</p></section>
    </div>
  </div>
</div>
<script type="module">
import { api, mountShell, esc, showError } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
try {
  const d = await api('/api/crm/links');
  panel.innerHTML = `<div class="stat-grid">${d.sections.map((s) => `
    <a class="card card-pad" href="${esc(s.href)}" target="_blank" rel="noopener"
       style="text-decoration:none;display:block;">
      <p style="font-weight:650;color:var(--navy-800);margin:0;">
        ${esc(s.label)} <span aria-hidden="true" style="color:var(--coral-400);">&#8599;</span>
      </p>
      <p class="muted" style="margin:.45rem 0 0;font-size:.85rem;line-height:1.45;">${esc(s.note)}</p>
    </a>`).join('')}</div>
    <p class="field-hint" style="margin-top:1.2rem;">Sub-account
      <code>${esc(d.locationId)}</code> on <code>${esc(d.base.replace(/^https?:\/\//, ''))}</code>.
      If a link lands in the wrong place, tell me and it is a one-line fix.</p>`;
} catch (err) { showError(panel, err); }
</script>
</body></html>
