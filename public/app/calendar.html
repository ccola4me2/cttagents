<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Calendar</h1><p class="sub">Departures, money due and appointments, on one run of days.</p></div>
      <div class="toolbar" style="margin:0;">
        <select id="range" aria-label="Range">
          <option value="7">Next 7 days</option>
          <option value="30" selected>Next 30 days</option>
          <option value="90">Next 90 days</option>
        </select>
        <button class="btn btn-primary btn-sm" id="book">Book appointment</button>
      </div>
    </header>
    <div class="content">
      <section id="stats" class="stat-grid"></section>
      <section class="card" id="panel"><p class="spinner">Loading calendar...</p></section>
    </div>
  </div>
</div>

<dialog id="appt-dialog">
  <form id="appt-form" method="dialog">
    <div class="card-head"><h2>Book an appointment</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button></div>
    <div class="dialog-body">
      <div class="notice notice-error" hidden></div>
      <div class="field">
        <label for="calendarId">Calendar</label>
        <select id="calendarId" name="calendarId" required></select>
      </div>
      <div class="field picker">
        <label for="contact-search">Contact</label>
        <input id="contact-search" autocomplete="off" placeholder="Search a name, email or phone">
        <input type="hidden" name="contactId" id="contactId">
        <div class="picker-results" id="picker" hidden></div>
        <p class="field-hint" id="picked"></p>
      </div>
      <div class="field"><label for="title">Title</label>
        <input id="title" name="title" placeholder="Discovery call"></div>
      <div class="field-row">
        <div class="field"><label for="startTime">Starts</label>
          <input id="startTime" name="startTime" type="datetime-local" required></div>
        <div class="field"><label for="durationMinutes">Minutes</label>
          <input id="durationMinutes" name="durationMinutes" type="number" min="5" max="480" value="30"></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">Book it</button>
    </div>
  </form>
</dialog>

<script type="module">
import { api, mountShell, esc, money, timeAgo, showError, onSubmit } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
const statsEl = document.getElementById('stats');
const range = document.getElementById('range');
const dlg = document.getElementById('appt-dialog');
let calendars = [];

// Days are keyed as YYYY-MM-DD so an appointment's timestamp and a
// reservation's plain date land on the same key and sort against each other.
const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${
  String(d.getDate()).padStart(2, '0')}`;
const dayKey = (iso) => localDay(new Date(iso));
// A bare date parses as UTC midnight, which reads as the day before anywhere
// west of Greenwich. Built from the parts instead, so a departure shows on the
// day it is written on the reservation.
const fromDay = (day) => {
  const [y, m, dd] = String(day).slice(0, 10).split('-').map(Number);
  return new Date(y, (m || 1) - 1, dd || 1);
};
const dayLabel = (day) => {
  const d = fromDay(day);
  if (localDay(d) === localDay(new Date())) return 'Today';
  if (localDay(d) === localDay(new Date(Date.now() + 86400000))) return 'Tomorrow';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
};
const timeLabel = (iso) =>
  new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

const TRAVEL_TONE = {
  departure: { icon: 'Departs', tone: 'var(--teal-600, var(--navy-600))' },
  return: { icon: 'Home', tone: 'var(--green-600)' },
  payment: { icon: 'Due', tone: 'var(--amber-600)' },
};

/**
 * One stream of days, holding two different kinds of thing.
 *
 * Appointments come from the CRM and have a time. Departures, returns and
 * money due come off the reservations and are all-day facts, so they sort to
 * the top of their day rather than pretending to happen at midnight.
 */
function merge(d) {
  const items = [];
  for (const e of d.events || []) {
    items.push({ day: dayKey(e.startTime), at: Date.parse(e.startTime) || 0, appt: e });
  }
  for (const t of d.travel || []) {
    items.push({ day: t.date, at: -1, travel: t });
  }
  return items.sort((a, b) => (a.day === b.day ? a.at - b.at : a.day.localeCompare(b.day)));
}

function render(d) {
  calendars = d.calendars || [];
  const items = merge(d);
  const today = new Date().toISOString().slice(0, 10);
  const ahead = items.filter((i) => i.day >= today);
  const travelAhead = ahead.filter((i) => i.travel);
  const nextTrip = travelAhead.find((i) => i.travel.kind === 'departure');
  const dueSoon = travelAhead.filter((i) => i.travel.kind === 'payment');

  statsEl.innerHTML = `
    <div class="stat"><p class="label">Coming up</p><p class="value">${ahead.length}</p>
      <p class="meta">In the next ${d.days} days</p></div>
    <div class="stat"><p class="label">Next departure</p>
      <p class="value" style="font-size:1.1rem;">${nextTrip
        ? esc(dayLabel(nextTrip.travel.date)) : 'None booked'}</p>
      <p class="meta">${nextTrip ? esc(nextTrip.travel.title) : ''}</p></div>
    <div class="stat"><p class="label">Money due</p><p class="value">${dueSoon.length}</p>
      <p class="meta">Vendor deadlines in this window</p></div>
    <div class="stat"><p class="label">Calendars</p><p class="value">${calendars.length}</p>
      <p class="meta">${calendars.filter((c) => c.isActive).length} active</p></div>`;

  if (!items.length) {
    panel.innerHTML = '<div class="empty"><h3>Nothing scheduled</h3>'
      + '<p>No departures, payments or appointments in this window.</p></div>';
    return;
  }

  let html = d.crmError
    ? `<div class="notice notice-info">Showing your reservations. The CRM calendars could not be
        reached, so appointments are missing from this view.</div>`
    : '';
  let lastDay = null;
  for (const item of items) {
    if (item.day !== lastDay) {
      html += `<div class="day-head">${esc(dayLabel(item.day))}</div>`;
      lastDay = item.day;
    }
    if (item.travel) {
      const t = item.travel;
      const tone = TRAVEL_TONE[t.kind] || TRAVEL_TONE.departure;
      html += `<div class="event">
        <div class="time" style="color:${tone.tone};font-weight:600;">${esc(tone.icon)}</div>
        <div class="what">
          <div class="title"><a class="name" href="/app/reservation?id=${esc(t.bookingId)}">${
            esc(t.title)}</a>${t.personal ? ' <span class="badge badge-navy">own travel</span>' : ''}</div>
          <div class="muted">${esc(t.detail || '')}${
            t.amountCents ? ` · ${money(t.amountCents)}` : ''}${
            t.reference ? ` · ${esc(t.reference)}` : ''}</div>
        </div></div>`;
    } else {
      const e = item.appt;
      html += `<div class="event">
        <div class="time">${esc(timeLabel(e.startTime))}</div>
        <div class="what">
          <div class="title">${esc(e.title)}</div>
          <div class="muted">${esc(e.calendarName || '')}${e.status ? ' · ' + esc(e.status) : ''}</div>
          ${e.contactId ? `<a class="muted" href="/app/contact?id=${encodeURIComponent(e.contactId)}">Open contact</a>` : ''}
        </div></div>`;
    }
  }
  panel.innerHTML = html;
}

async function load() {
  panel.innerHTML = '<p class="spinner">Loading calendar...</p>';
  try { render(await api(`/api/calendar?days=${range.value}`)); }
  catch (err) { statsEl.innerHTML = ''; showError(panel, err); }
}

document.getElementById('book').addEventListener('click', () => {
  if (!calendars.length) { alert('No calendars available in CTT Tools yet.'); return; }
  const form = document.getElementById('appt-form');
  form.reset();
  document.getElementById('contactId').value = '';
  document.getElementById('picked').textContent = '';
  form.querySelector('.notice-error').hidden = true;
  document.getElementById('calendarId').innerHTML = calendars
    .filter((c) => c.isActive)
    .map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  dlg.showModal();
});
dlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => dlg.close()));

const contactSearch = document.getElementById('contact-search');
const picker = document.getElementById('picker');
let pickTimer;
contactSearch.addEventListener('input', () => {
  clearTimeout(pickTimer);
  const q = contactSearch.value.trim();
  if (q.length < 2) { picker.hidden = true; return; }
  pickTimer = setTimeout(async () => {
    try {
      const { contacts } = await api(`/api/leads?q=${encodeURIComponent(q)}&limit=8`);
      picker.innerHTML = contacts.length
        ? contacts.map((c) => `<button type="button" data-cid="${esc(c.id)}" data-cname="${esc(c.name)}">
             ${esc(c.name)}<br><span class="muted">${esc(c.email || c.phone || '')}</span></button>`).join('')
        : '<button type="button" disabled>No matches</button>';
      picker.hidden = false;
      picker.querySelectorAll('[data-cid]').forEach((b) => b.addEventListener('click', () => {
        document.getElementById('contactId').value = b.dataset.cid;
        document.getElementById('picked').textContent = `Appointment for ${b.dataset.cname}`;
        contactSearch.value = b.dataset.cname;
        picker.hidden = true;
      }));
    } catch { picker.hidden = true; }
  }, 300);
});

onSubmit(document.getElementById('appt-form'), async (values) => {
  if (!values.contactId) throw new Error('Pick a contact for this appointment.');
  await api('/api/calendar/appointments', { method: 'POST', body: values });
  dlg.close();
  await load();
});

range.addEventListener('change', load);
await load();
</script>
</body></html>
