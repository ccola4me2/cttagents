<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Lead forms</h1><p class="sub">Your own forms, hosted on your domain. Every
        submission is a lead here and a contact in the CRM.</p></div>
      <div class="toolbar" style="margin:0;padding:0;">
        <select id="report-days" aria-label="Period" style="width:auto;">
          <option value="30">Last 30 days</option>
          <option value="90" selected>Last 90 days</option>
          <option value="365">Last year</option>
        </select>
        <button class="btn btn-primary btn-sm" id="new-form">Build a form</button>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <section id="stats" class="stat-grid"></section>
      <section class="card" id="panel" style="margin-top:1.25rem;"><p class="spinner">Loading forms...</p></section>
      <section class="card" id="subs" hidden style="margin-top:1.25rem;"></section>
      <section class="card" id="all-subs" style="margin-top:1.25rem;">
        <div class="card-head"><h2>Leads from your forms</h2>
          <span class="muted" id="subs-count"></span></div>
        <div id="lead-list"><p class="spinner">Loading...</p></div>
      </section>
    </div>
  </div>
</div>



<script type="module">
import { api, mountShell, esc, timeAgo, showError } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
const subsEl = document.getElementById('subs');
let cache = [];


function render(forms) {
  cache = forms;
  if (!forms.length) {
    panel.innerHTML = '<div class="empty"><h3>No forms yet</h3><p>Build one and it gets its own page on your domain, ready to share or embed.</p></div>';
    return;
  }
  panel.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Form</th><th>Link</th><th class="num">Submissions</th><th>Updated</th><th></th></tr></thead>
    <tbody>${forms.map((f) => `<tr>
      <td><span class="name">${esc(f.name)}</span>
        <div><span class="badge ${f.active ? 'badge-green' : 'badge-navy'}">${f.active ? 'live' : 'off'}</span></div></td>
      <td><a href="/f/${esc(f.slug)}" target="_blank" rel="noopener">/f/${esc(f.slug)}</a>
        <div><button class="btn btn-ghost btn-sm" data-copy="${esc(f.slug)}">Copy link</button></div></td>
      <td class="num"><button class="btn btn-ghost btn-sm" data-subs="${esc(f.id)}">${f.submissions}</button></td>
      <td><span class="muted">${esc(timeAgo(f.updatedAt))}</span></td>
      <td class="num"><a class="btn btn-ghost btn-sm" href="/app/form?id=${
        encodeURIComponent(f.id)}">Edit</a></td>
    </tr>`).join('')}</tbody></table></div>`;

  panel.querySelectorAll('[data-subs]').forEach((b) =>
    b.addEventListener('click', () => showSubs(b.dataset.subs)));
  panel.querySelectorAll('[data-copy]').forEach((b) =>
    b.addEventListener('click', async () => {
      const url = `${location.origin}/f/${b.dataset.copy}`;
      try { await navigator.clipboard.writeText(url); b.textContent = 'Copied'; }
      catch { prompt('Copy this link:', url); }
      setTimeout(() => { b.textContent = 'Copy link'; }, 2000);
    }));
}

async function showSubs(id) {
  subsEl.hidden = false;
  subsEl.innerHTML = '<p class="spinner">Loading submissions...</p>';
  try {
    const d = await api(`/api/myforms/${encodeURIComponent(id)}`);
    subsEl.innerHTML = `<div class="card-head"><h2>${esc(d.form.name)} submissions</h2>
        <span class="muted">${d.submissions.length}</span></div>` +
      (d.submissions.length
        ? `<ul class="timeline">${d.submissions.map((s) => `<li>
            <div class="row-between"><div>
              <span class="name">${esc(s.name || s.email || 'Anonymous')}</span>
              <div class="muted">${esc([s.email, s.phone].filter(Boolean).join('  ·  '))}</div></div>
              <div style="text-align:right;">
                <div class="when">${esc(timeAgo(s.createdAt))}</div>
                ${s.contactId ? `<a class="btn btn-ghost btn-sm" style="margin-top:.35rem;"
                   href="/app/contact?id=${encodeURIComponent(s.contactId)}">Open contact</a>` : ''}
              </div></div>
            <dl class="kv" style="margin-top:.7rem;">${Object.entries(s.data)
              .map(([k, v]) => `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
          </li>`).join('')}</ul>`
        : '<div class="empty"><p>No submissions yet.</p></div>');
    subsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) { showError(subsEl, err); }
}

document.getElementById('new-form').addEventListener('click', () => {
  location.href = '/app/form';
});


const daysSel = document.getElementById('report-days');
const leadList = document.getElementById('lead-list');

function drawReport(r) {
  const t = r.totals;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><p class="label">Leads in</p><p class="value">${t.submissions}</p>
      <p class="meta">Last ${r.days} days</p></div>
    <div class="stat"><p class="label">Reached the CRM</p><p class="value">${t.reachedCrm}</p>
      <p class="meta">${t.strandedHere
        ? `${t.strandedHere} stopped here and nobody was told`
        : 'Every one of them'}</p></div>
    <div class="stat"><p class="label">Live forms</p><p class="value">${t.activeForms}</p>
      <p class="meta">Of ${t.forms} built</p></div>
    <div class="stat"><p class="label">All time</p><p class="value">${t.allTime}</p>
      <p class="meta">Every submission ever</p></div>`;

  document.getElementById('subs-count').textContent =
    `${r.submissions.length} in the last ${r.days} days`;

  leadList.innerHTML = r.submissions.length
    ? `<div class="table-wrap"><table>
        <thead><tr><th>Who</th><th>Form</th><th>They said</th><th>When</th><th>CRM</th>
          <th></th></tr></thead>
        <tbody>${r.submissions.map((s) => {
          // The answers beyond name, email and phone, which is the part that
          // says what they actually want.
          const said = Object.entries(s.data || {})
            .filter(([k]) => !/^(first_?name|last_?name|name|email|phone|mobile)$/i.test(k))
            .map(([k, v]) => `${k.replace(/_/g, ' ')}: ${v}`)
            .filter((x) => x.length < 120)
            .slice(0, 3).join(' · ');
          return `<tr>
            <td><span class="name">${esc(s.name || s.email || 'Anonymous')}</span>
              <div class="muted">${esc([s.email, s.phone].filter(Boolean).join(' · '))}</div></td>
            <td>${esc(s.formName)}</td>
            <td class="muted" style="max-width:22rem;">${esc(said)}</td>
            <td class="muted">${esc(timeAgo(s.createdAt))}</td>
            <td>${s.contactId
              ? `<a class="muted" href="/app/contact?id=${encodeURIComponent(s.contactId)}">open</a>`
              : '<span class="badge badge-amber">not sent</span>'}</td>
            <td class="num"><button class="btn btn-ghost btn-sm"
              data-quote="${esc(s.id)}">Start a reservation</button></td>
          </tr>`;
        }).join('')}</tbody></table></div>`
    : `<div class="empty"><h3>No leads yet</h3>
        <p>Share a form's link and the people who fill it in appear here.</p></div>`;

  leadList.querySelectorAll('[data-quote]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Starting...';
      try {
        const made = await api(`/api/leads/submissions/${encodeURIComponent(btn.dataset.quote)}/reservation`,
          { method: 'POST' });
        // Straight onto the reservation, which is where the next thing happens.
        location.href = `/app/reservation?id=${encodeURIComponent(made.bookingId)}`;
      } catch (e) {
        showError(document.getElementById('err'), e);
        btn.disabled = false;
        btn.textContent = 'Start a reservation';
      }
    });
  });
}

daysSel.addEventListener('change', load);

async function load() {
  panel.innerHTML = '<p class="spinner">Loading forms...</p>';
  try {
    const [list, report] = await Promise.all([
      api('/api/myforms'),
      api(`/api/myforms/report?days=${daysSel.value}`),
    ]);
    render(list.forms);
    drawReport(report);
  }
  catch (err) { showError(document.getElementById('err'), err); panel.innerHTML = ''; }
}
await load();
</script>
</body></html>
