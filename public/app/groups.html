<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group space | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Group space</h1><p class="sub">Cabins a vendor is holding for you, and how long you have to sell them.</p></div>
      <div class="toolbar" style="margin:0;">
        <span id="scope"></span>
        <a class="btn btn-primary btn-sm" href="/app/group">Open a group</a>
      </div>
    </header>
    <div class="content">
      <section id="stats" class="stat-grid"></section>
      <div class="toolbar">
        <select id="status-filter" aria-label="Status">
          <option value="">All groups</option>
          <option value="open" selected>Open</option>
          <option value="closed">Closed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <section class="card" id="panel"><p class="spinner">Loading groups...</p></section>
    </div>
  </div>
</div>

<script type="module">
import { api, mountShell, esc, dateFmt, daysUntil, showError,
         mountScopePicker, advisorParam } from '/js/app.js';
await mountShell();

const panel = document.getElementById('panel');
const statusFilter = document.getElementById('status-filter');
let clashes = new Set();

const short = (iso) => (iso ? dateFmt(iso).replace(/,? \d{4}$/, '') : '-');

function render(d) {
  const showAdvisor = Boolean(d.scope && d.scope.all);
  clashes = new Set(d.clashingCodes || []);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><p class="label">Open groups</p><p class="value">${d.stats.open}</p>
      <p class="meta">Blocks still selling</p></div>
    <div class="stat"><p class="label">Cabins held</p><p class="value">${d.stats.held}</p>
      <p class="meta">${d.stats.sold} sold so far</p></div>
    <div class="stat"><p class="label">Releasing in 30 days</p>
      <p class="value" style="${d.stats.releasing ? 'color:var(--red-600);' : ''}">${d.stats.releasing}</p>
      <p class="meta">Unsold cabins going back to the vendor</p></div>
    <div class="stat"><p class="label">Still to sell</p>
      <p class="value">${Math.max(0, d.stats.held - d.stats.sold)}</p>
      <p class="meta">Across every open group</p></div>`;

  if (!d.groups.length) {
    panel.innerHTML = `<div class="empty"><h3>No group space</h3>
      <p>Open a group when a vendor holds a block of cabins for you.</p>
      <a class="btn btn-primary btn-sm" href="/app/group">Open a group</a></div>`;
    return;
  }

  panel.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Group</th>${showAdvisor ? '<th>Advisor</th>' : ''}<th>Vendor</th><th>Departing</th>
      <th>Option date</th><th class="num">Held</th><th class="num">Sold</th><th class="num">Left</th><th></th></tr></thead>
    <tbody>${d.groups.map((g) => {
      const left = Math.max(0, (g.cabins_held || 0) - (g.cabins_sold || 0));
      const days = daysUntil(g.option_date);
      const tone = days === null ? '' : days < 0 ? 'badge-red' : days <= 14 ? 'badge-red'
        : days <= 45 ? 'badge-amber' : 'badge-navy';
      const label = days === null ? '' : days < 0 ? 'space released'
        : days === 0 ? 'releases today' : `releases in ${days}d`;
      const href = `/app/group?id=${encodeURIComponent(g.id)}`;
      return `<tr>
        <td><a class="name" href="${href}">${esc(g.name)}</a>
          <div class="muted">${esc([g.group_code, g.product_name].filter(Boolean).join(' / '))}</div>
          ${clashes.has(g.group_code) ? '<div><span class="badge badge-red">code used twice</span></div>' : ''}
          ${g.registration_open ? '<div><span class="badge badge-green">taking sign-ups</span></div>' : ''}</td>
        ${showAdvisor ? `<td class="muted">${esc(g.advisor_name || '-')}</td>` : ''}
        <td>${esc(g.vendor || '-')}</td>
        <td>${esc(short(g.depart_date))}</td>
        <td>${g.option_date ? `${esc(short(g.option_date))}
            ${left > 0 && label ? `<div><span class="badge ${tone}">${esc(label)}</span></div>` : ''}`
          : '<span class="muted">none set</span>'}</td>
        <td class="num">${g.cabins_held || 0}</td>
        <td class="num">${g.cabins_sold || 0}</td>
        <td class="num"><strong>${left}</strong></td>
        <td class="num"><a class="btn btn-ghost btn-sm" href="${href}">Open</a></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

async function load() {
  try {
    const q = [statusFilter.value ? `status=${statusFilter.value}` : '', advisorParam()]
      .filter(Boolean).join('&');
    const d = await api(`/api/groups${q ? '?' + q : ''}`);
    mountScopePicker(document.getElementById('scope'), d, load);
    render(d);
  } catch (err) { showError(panel, err); }
}

statusFilter.addEventListener('change', load);

await load();
</script>
</body></html>
