<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Clients</h1><p class="sub">Everyone who has booked or holds a credit, built from your own records.</p></div>
      <span id="scope"></span>
    </header>
    <div class="content">
      <div id="err"></div>
      <section id="stats" class="stat-grid"></section>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Name, email or phone" style="min-width:240px;">
        <label style="display:flex;align-items:center;gap:.4rem;font-weight:400;">
          <input type="checkbox" id="pinned-only" style="width:auto;"> Pinned only</label>
      </div>
      <div id="picked"></div>
      <section class="card" id="panel"><p class="spinner">Loading clients...</p></section>
    </div>
  </div>
</div>

<script type="module">
import { api, mountShell, esc, money, dateFmt, showError, mountScopePicker, advisorParam } from '/js/app.js';
const ME = (await mountShell()).id;

const panel = document.getElementById('panel');
const err = document.getElementById('err');
const q = document.getElementById('q');
const pinnedOnly = document.getElementById('pinned-only');
let timer = null;

const short = (iso) => (iso ? dateFmt(iso).replace(/,? \d{4}$/, '') : '-');

/**
 * The people ticked, which survives a search.
 *
 * Two of a household are rarely next to each other in a nineteen thousand row
 * list, so this has to hold across the searches it takes to find them both.
 * Names are kept alongside the ids because the bar names who is picked, and a
 * client filtered off the screen is no longer in the rows to look it up from.
 */
const picked = new Set();
const pickedNames = new Map();
const pickedBar = document.getElementById('picked');

function drawPicked() {
  if (picked.size === 0) { pickedBar.innerHTML = ''; return; }
  const who = [...picked].map((id) => pickedNames.get(id) || 'somebody');
  pickedBar.innerHTML = `<div class="notice notice-info call-undo">
    <span><strong>${picked.size} chosen</strong> &middot; ${esc(who.join(', '))}${
    picked.size < 2 ? ' &middot; pick one more to make a household' : ''}</span>
    <span style="display:flex;gap:.4rem;">
      ${picked.size >= 2
    ? '<button class="btn btn-primary btn-sm" id="make-house">Make a household</button>' : ''}
      <button class="btn btn-ghost btn-sm" id="clear-picked">Clear</button></span></div>`;

  document.getElementById('clear-picked').addEventListener('click', () => {
    picked.clear();
    pickedNames.clear();
    document.querySelectorAll('[data-pick]').forEach((b) => { b.checked = false; });
    drawPicked();
  });

  const make = document.getElementById('make-house');
  if (make) make.addEventListener('click', async () => {
    make.disabled = true;
    try {
      const out = await api('/api/households',
        { method: 'POST', body: { clientIds: [...picked] } });
      picked.clear();
      pickedNames.clear();
      pickedBar.innerHTML = '';
      err.innerHTML = `<div class="notice notice-ok">${esc(out.name)} &middot; ${
        out.members} people now live together. Their address goes on the household.</div>`;
      await load();
    } catch (e) { make.disabled = false; showError(err, e); }
  });
}

function render(d) {
  const s = d.stats;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><p class="label">Clients</p><p class="value">${s.total}</p>
      <p class="meta">${s.pinned} pinned</p></div>
    <div class="stat"><p class="label">Nothing booked</p>
      <p class="value" style="${s.lapsed ? 'color:var(--amber-600);' : ''}">${s.lapsed}</p>
      <p class="meta">Travelled with you, nothing ahead</p></div>
    <div class="stat"><p class="label">Lifetime value</p><p class="value">${money(s.lifetimeCents)}</p>
      <p class="meta">Across everyone listed</p></div>`;

  if (!d.clients.length) {
    panel.innerHTML = `
    <div class="empty"><h3>No clients yet</h3>
      <p>A client record appears the first time you take a reservation for them.</p></div>`;
    return;
  }

  panel.innerHTML = `
    ${d.truncated ? `<div class="notice notice-warn">Showing the first ${d.cap} only.
      Search to narrow it down; filtering what is on screen will not reach the rest.</div>` : ''}
    <div class="table-wrap"><table>
    <thead><tr><th style="width:2rem;"></th><th style="width:2rem;"></th>
      <th>Client</th><th>Contact</th><th>Last trip</th>
      <th>Next trip</th><th class="num">Trips</th><th class="num">Lifetime</th></tr></thead>
    <tbody>${d.clients.map((c) => `<tr>
      <td>${c.user_id === ME
        ? `<input type="checkbox" class="pick" data-pick="${esc(c.id)}" style="width:auto;"
             ${picked.has(c.id) ? 'checked' : ''}
             aria-label="Choose ${esc(c.name)}">` : ''}</td>
      <td>${c.user_id === ME
        ? `<button type="button" class="pin${c.pinned_at ? ' on' : ''}" data-pin="${esc(c.id)}"
             aria-pressed="${Boolean(c.pinned_at)}" aria-label="${c.pinned_at ? 'Unpin' : 'Pin'} ${esc(c.name)}">
             <svg viewBox="0 0 24 24" width="14" height="14" fill="${c.pinned_at ? 'currentColor' : 'none'}"
               stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
               <path d="M9 3h6l-1 6 4 3v2H6v-2l4-3-1-6Zm3 11v7"/></svg></button>`
        : ''}</td>
      <td><a class="name" href="/app/client?id=${esc(c.id)}">${esc(c.name)}</a>
        ${c.household_name
      ? `<div class="muted" style="font-size:.76rem;">${esc(c.household_name)}</div>` : ''}</td>
      <td>${[c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '',
             c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '']
            .filter(Boolean).join('<br>') || '<span class="muted">none on file</span>'}</td>
      <td>${esc(short(c.last_date))}</td>
      <td>${c.next_date ? esc(short(c.next_date)) : '<span class="muted">nothing booked</span>'}</td>
      <td class="num">${c.trips}</td>
      <td class="num">${money(c.lifetime_cents)}</td>
    </tr>`).join('')}</tbody></table></div>`;

  panel.querySelectorAll('[data-pick]').forEach((box) => {
    box.addEventListener('change', () => {
      const row = box.closest('tr');
      if (box.checked) {
        picked.add(box.dataset.pick);
        pickedNames.set(box.dataset.pick, row.querySelector('.name').textContent.trim());
      } else {
        picked.delete(box.dataset.pick);
        pickedNames.delete(box.dataset.pick);
      }
      drawPicked();
    });
  });

  panel.querySelectorAll('[data-pin]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const on = btn.classList.contains('on');
      btn.disabled = true;
      try { await api(`/api/clients/${encodeURIComponent(btn.dataset.pin)}`,
        { method: 'PUT', body: { pinned: !on } }); await load(); }
      catch (e) { showError(err, e); btn.disabled = false; }
    });
  });
}

async function load() {
  try {
    const params = [];
    if (q.value.trim()) params.push(`q=${encodeURIComponent(q.value.trim())}`);
    if (pinnedOnly.checked) params.push('pinned=1');
    if (advisorParam()) params.push(advisorParam());
    const d = await api(`/api/clients${params.length ? '?' + params.join('&') : ''}`);
    mountScopePicker(document.getElementById('scope'), d, load);
    render(d);
  } catch (e) { showError(panel, e); }
}

q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 200); });
pinnedOnly.addEventListener('change', load);
await load();
</script>
</body></html>
