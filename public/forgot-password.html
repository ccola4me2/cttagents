<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
  <a class="auth-brand" href="/">
    <img src="/logo-mark.png" alt="">
    <span><b>Cruises Tours &amp; Travel</b><small>Travel Advisor Portal</small></span>
  </a>
  <div class="auth-card">
    <div class="auth-card-head">
      <h1>Reset your password</h1>
      <p>Enter your email address and we will send you a reset link.</p>
    </div>
    <div class="auth-card-body">
      <div class="notice notice-error" hidden></div>
      <div class="notice notice-ok" id="sent" hidden>
        If that address has an account, a reset link is on its way. Check your inbox and spam folder.
      </div>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <button class="btn btn-primary" type="submit">Send reset link</button>
      </form>
      <p class="auth-foot"><a href="/login">Back to sign in</a></p>
    </div>
  </div>
  <p class="auth-legal">&copy; 2026 Cruises Tours &amp; Travel. All rights reserved.<br>
    <!-- Seller of travel registration numbers go here once issued. Nothing is
         placed in this slot until the real numbers exist: a plausible looking
         licence number is worse than none. -->
  </p>
</div>
<script type="module">
import { api, onSubmit } from '/js/app.js';
const form = document.getElementById('forgot-form');
onSubmit(form, async (values) => {
  await api('/api/auth/forgot', { method: 'POST', body: values });
  form.hidden = true;
  document.getElementById('sent').hidden = false;
});
</script>
</body></html>
