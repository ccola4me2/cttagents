<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request access | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
  <a class="auth-brand" href="/">
    <img src="/logo-mark.png" alt="">
    <span><b>Cruises Tours &amp; Travel</b><small>Travel Advisor Portal</small></span>
  </a>
  <div class="auth-card">
    <div class="auth-card-head">
      <h1>Request access</h1>
      <p>An administrator approves each account before it goes live.</p>
    </div>
    <div class="auth-card-body">
      <div class="notice notice-error" hidden></div>
      <form id="signup-form" novalidate>
        <div class="field-row">
          <div class="field">
            <label for="firstName">First name</label>
            <input id="firstName" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input id="lastName" name="lastName" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="phone">Phone <span style="font-weight:400;color:var(--ink-400);">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel">
        </div>
        <div class="field">
          <label for="agencyName">Agency or host <span style="font-weight:400;color:var(--ink-400);">(optional)</span></label>
          <input id="agencyName" name="agencyName">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
          <p class="field-hint">At least 10 characters.</p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
        </div>
        <button class="btn btn-primary" type="submit">Request access</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
  <p class="auth-legal">&copy; 2026 Cruises Tours &amp; Travel. All rights reserved.<br>
    <!-- Seller of travel registration numbers go here once issued. Nothing is
         placed in this slot until the real numbers exist: a plausible looking
         licence number is worse than none. -->
  </p>
</div>
<script type="module">
import { api, onSubmit, enhancePasswordFields } from '/js/app.js';
enhancePasswordFields();
onSubmit(document.getElementById('signup-form'), async (values) => {
  if (values.password !== values.confirmPassword) {
    throw new Error('The two passwords do not match.');
  }
  await api('/api/auth/signup', { method: 'POST', body: values });
  location.href = '/pending';
});
</script>
</body></html>
