<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
  <span class="auth-brand" id="brand">
    <img src="/logo-mark.svg" alt="">
    <span><b id="brand-name">&nbsp;</b><small id="brand-tagline">&nbsp;</small></span>
  </span>
  <div class="auth-card">
    <div class="auth-card-head">
      <h1 id="head">Join</h1>
      <p id="lede">Checking the link...</p>
    </div>
    <div class="auth-card-body" id="body" hidden>
      <div class="notice notice-error" hidden></div>
      <form id="join-form" novalidate>
        <div class="field-row">
          <div class="field"><label for="firstName">First name</label>
            <input id="firstName" name="firstName" autocomplete="given-name" required></div>
          <div class="field"><label for="lastName">Last name</label>
            <input id="lastName" name="lastName" autocomplete="family-name" required></div>
        </div>
        <div class="field"><label for="email">Work email</label>
          <input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field">
          <label for="phone">Phone <span style="font-weight:400;color:var(--ink-400);">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
          <p class="field-hint">At least 10 characters.</p></div>
        <div class="field"><label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password"
            autocomplete="new-password" minlength="10" required></div>
        <button class="btn btn-primary" type="submit">Request access</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
    </div>
    <div class="auth-card-body" id="closed" hidden>
      <div class="notice notice-warn" id="closed-note"></div>
      <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
  <p class="auth-legal" id="legal">&nbsp;</p>
</div>
<script type="module">
import { api, esc, onSubmit, enhancePasswordFields } from '/js/app.js';

// The slug is the last part of the address, which is the whole link: an
// advisor is handed /join/their-agency and nothing else.
const slug = decodeURIComponent(location.pathname.replace(/^\/join\/?/, '').replace(/\/$/, ''));

const head = document.getElementById('head');
const lede = document.getElementById('lede');

function shut(message) {
  document.getElementById('closed').hidden = false;
  document.getElementById('closed-note').textContent = message;
  head.textContent = 'Not taking signups';
  lede.textContent = '';
}

if (!slug) {
  shut('That link is missing the agency it was meant to point at. Ask whoever sent it for a new one.');
} else {
  try {
    const d = await api(`/api/join/${encodeURIComponent(slug)}`);
    const name = d.brand.name;
    document.title = `Join ${name}`;
    document.getElementById('brand-name').textContent = name;
    document.getElementById('brand-tagline').textContent = d.brand.tagline || '';
    if (d.brand.logoUrl) document.querySelector('#brand img').src = d.brand.logoUrl;
    // One accent, applied the way the portal's own is, so a page that is not
    // Trip Vara does not look like Trip Vara with a different name on it.
    if (d.brand.color) {
      document.documentElement.style.setProperty('--navy-800', d.brand.color);
      document.documentElement.style.setProperty('--navy-600', d.brand.color);
    }
    head.textContent = `Join ${name}`;
    lede.textContent = 'Somebody at the agency approves each account before it goes live.';
    document.getElementById('legal').innerHTML =
      `&copy; ${new Date().getFullYear()} ${esc(name)}`;
    document.getElementById('body').hidden = false;
  } catch (err) {
    shut(err.message || 'That link is not open at the moment.');
  }
}

enhancePasswordFields();
const form = document.getElementById('join-form');
if (form) {
  onSubmit(form, async (values) => {
    if (values.password !== values.confirmPassword) {
      throw new Error('The two passwords do not match.');
    }
    // The slug travels with the signup, which is what puts them in the right
    // agency rather than in whichever one happens to be first.
    await api('/api/auth/signup', { method: 'POST', body: { ...values, agency: slug } });
    location.href = '/pending';
  });
}
</script>
</body></html>
