<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier specials | CTT Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/logo-mark.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<style>
  .ss-search { position: relative; }
  .ss-search input {
    width: 100%; font-size: 1.1rem; padding: .95rem 3rem .95rem 3rem; border-radius: 14px;
    border: 1.5px solid var(--navy-200); background: #fff; box-shadow: var(--shadow-sm);
  }
  .ss-search input:focus { border-color: var(--teal-500); outline: 0; box-shadow: 0 0 0 3px var(--teal-50); }
  .ss-search svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--ink-400); pointer-events: none; }
  .ss-search .ss-clear {
    position: absolute; right: .6rem; top: 50%; transform: translateY(-50%);
    border: 0; background: var(--navy-100); color: var(--navy-700); border-radius: 999px;
    width: 1.9rem; height: 1.9rem; cursor: pointer; font-size: 1rem; line-height: 1;
  }
  .ss-tip { font-size: .78rem; color: var(--ink-400); margin: .55rem .2rem 0; }
  .ss-tip kbd { font: inherit; font-size: .72rem; border: 1px solid var(--navy-200); border-radius: 5px; padding: 0 .35rem; background: #fff; }

  .ss-filters { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; align-items: center; margin: 1.1rem 0 .4rem; }
  .ss-group { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .ss-group > .lbl { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); margin-right: .15rem; }
  .ss-pill {
    font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--navy-200); background: #fff; color: var(--navy-700);
    border-radius: 999px; padding: .3rem .85rem;
  }
  .ss-pill:hover { border-color: var(--navy-400); }
  .ss-pill[aria-pressed="true"] { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
  .ss-pill .n { font-weight: 400; opacity: .7; margin-left: .3rem; font-size: .76rem; }
  .ss-filters select { width: auto; min-width: 0; font-size: .85rem; padding: .35rem 2rem .35rem .7rem; }

  .ss-count { display: flex; align-items: baseline; gap: .8rem; margin: 1.2rem 0 .7rem; flex-wrap: wrap; }
  .ss-count strong { font-size: 1rem; color: var(--navy-800); }
  .ss-count .m { font-size: .84rem; color: var(--ink-500); }
  .ss-count button { margin-left: auto; }

  .ss-brand { margin-bottom: 1rem; overflow: hidden; }
  .ss-brand-head {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    padding: .8rem 1.25rem; background: var(--navy-50); border-bottom: 1px solid var(--navy-100);
  }
  .ss-brand-head h3 { margin: 0; font-size: 1.05rem; color: var(--navy-800); }
  .ss-brand-head .tag { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-400); }
  .ss-brand-head .n { margin-left: auto; font-size: .78rem; color: var(--ink-500); }
  .ss-brand-head a { font-size: .8rem; font-weight: 600; }

  .ss-offer {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.25rem;
    padding: .95rem 1.25rem; border-bottom: 1px solid var(--navy-100); align-items: start;
  }
  .ss-offer:last-child { border-bottom: 0; }
  .ss-offer.over { background: #fafbfc; }
  .ss-offer.over .ss-text { color: var(--ink-500); }
  .ss-text { font-size: .95rem; line-height: 1.5; color: var(--ink-900); }
  .ss-prog { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--teal-600); background: var(--teal-50); border-radius: 6px; padding: .1rem .5rem; margin-right: .4rem; vertical-align: .08rem; }
  .ss-meta { font-size: .82rem; color: var(--ink-500); margin-top: .3rem; display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
  .ss-meta b { color: var(--ink-700); font-weight: 600; }
  .ss-side { display: flex; flex-direction: column; align-items: flex-end; gap: .45rem; }
  .ss-side .row { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ss-code {
    font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem; font-weight: 600;
    color: var(--navy-800); background: #fff; border: 1px dashed var(--navy-400); border-radius: 7px;
    padding: .15rem .55rem; cursor: pointer;
  }
  .ss-code:hover { background: var(--navy-50); }
  .ss-headline { font-weight: 650; color: var(--navy-800); margin-bottom: .15rem; }
  .ss-links { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  mark { background: #fff1b8; color: inherit; border-radius: 3px; padding: 0 .1rem; }
  .ss-new { font-size: .68rem; font-weight: 800; letter-spacing: .06em; color: var(--teal-600); margin-left: .4rem; text-transform: uppercase; }

  .ss-updated { margin: .9rem .1rem 0; font-size: .86rem; color: var(--ink-500); }
  .ss-updated strong { color: var(--navy-800); font-weight: 650; }

  .ss-drop {
    border: 2px dashed var(--navy-300); border-radius: 14px; padding: 2.2rem 1.2rem; text-align: center;
    color: var(--ink-500); background: var(--navy-50); transition: background .15s, border-color .15s;
  }
  .ss-drop.over { background: var(--teal-50); border-color: var(--teal-500); }
  .ss-drop strong { display: block; font-size: 1.05rem; color: var(--navy-800); margin-bottom: .3rem; }

  .ss-prev { width: 100%; border-collapse: collapse; font-size: .84rem; }
  .ss-prev th { text-align: left; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); padding: .4rem .5rem; border-bottom: 1px solid var(--navy-100); position: sticky; top: 0; background: #fff; }
  .ss-prev td { padding: .5rem; border-bottom: 1px solid var(--navy-100); vertical-align: top; }
  .ss-prev tr.same td { color: var(--ink-400); }
  .ss-scroll { max-height: 46vh; overflow: auto; border: 1px solid var(--navy-100); border-radius: 10px; }
  .ss-chips { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .8rem; }
  .ss-hist { list-style: none; margin: 0; padding: 0; }
  .ss-hist li { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; padding: .65rem 1.25rem; border-bottom: 1px solid var(--navy-100); font-size: .86rem; }
  .ss-hist li:last-child { border-bottom: 0; }
  .ss-hist .grow { flex: 1; min-width: 12rem; }

  @media (max-width: 640px) {
    .ss-offer { grid-template-columns: 1fr; }
    .ss-side { align-items: flex-start; }
    .ss-side .row { justify-content: flex-start; }
    .ss-search input { font-size: 1rem; }
  }
  @media print { .noprint { display: none !important; } }

  .ss-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .ss-table th { text-align: left; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); padding: .6rem .8rem; border-bottom: 1px solid var(--navy-100); white-space: nowrap; }
  .ss-table td { padding: .65rem .8rem; border-bottom: 1px solid var(--navy-100); vertical-align: top; }
  .ss-table td.r, .ss-table th.r { text-align: right; }
  .ss-table .sub { font-size: .78rem; color: var(--ink-500); }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>Supplier specials</h1>
        <p class="sub">Upload the weekly list and keep the offers the advisors search.</p></div>
      <div class="toolbar" style="margin:0;">
        <a class="btn btn-ghost btn-sm" href="/app/supplier-specials">What advisors see</a>
        <button class="btn btn-secondary btn-sm" id="add">Add one</button>
        <button class="btn btn-primary btn-sm" id="upload">Upload the weekly list</button>
      </div>
    </header>
    <div class="content">
      <div id="err"></div>
      <p class="ss-updated" id="updated" hidden></p>
      <div class="toolbar" style="margin-top:1rem;">
        <input id="filter" type="search" placeholder="Find an offer to change" autocomplete="off" style="flex:1;min-width:14rem;">
        <select id="show" aria-label="Which offers">
          <option value="live">Running now</option>
          <option value="over">Ended</option>
          <option value="all">Everything</option>
        </select>
      </div>
      <section class="card" id="table-card"><div id="rows"><p class="spinner">Loading...</p></div></section>
      <section class="card" id="history" style="margin-top:1.4rem;" hidden></section>
    </div>
  </div>
</div>

<dialog id="up-dlg">
  <form method="dialog" id="up-form">
    <div class="card-head"><h2 id="up-title">Upload the weekly list</h2>
      <button class="btn btn-ghost btn-sm" type="button" id="up-close">Close</button></div>
    <div class="card-pad" id="up-body"></div>
    <div class="card-foot" id="up-foot"></div>
  </form>
</dialog>

<dialog id="ed-dlg">
  <form method="dialog" id="ed-form">
    <div class="card-head"><h2 id="ed-title">Add a supplier special</h2>
      <button class="btn btn-ghost btn-sm" type="button" id="ed-close">Close</button></div>
    <div class="card-pad">
      <div class="notice notice-error" hidden></div>
      <div class="field-row">
        <div class="field"><label for="brand">Brand</label>
          <input id="brand" name="brand" maxlength="120" required list="brand-names"></div>
        <div class="field"><label for="category">Shelf</label>
          <input id="category" name="category" maxlength="60" list="shelf-names" placeholder="Cruise lines"></div>
      </div>
      <div class="field"><label for="program">Programme <span class="muted">(optional)</span></label>
        <input id="program" name="program" maxlength="120" placeholder="TLN AmaMAX"></div>
      <div class="field"><label for="headline">Headline <span class="muted">(optional)</span></label>
        <input id="headline" name="headline" maxlength="160"></div>
      <div class="field"><label for="offer">The offer</label>
        <textarea id="offer" name="offer" maxlength="800" required rows="3"></textarea></div>
      <div class="field"><label for="windowText">Book by, as the supplier wrote it</label>
        <input id="windowText" name="windowText" maxlength="240" placeholder="Oct 1 to 5, 2026"></div>
      <div class="field-row">
        <div class="field"><label for="startsOn">Starts</label>
          <input id="startsOn" name="startsOn" type="date"></div>
        <div class="field"><label for="endsOn">Ends</label>
          <input id="endsOn" name="endsOn" type="date">
          <p class="field-hint">Leave blank when there is no deadline.</p></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="travelPeriod">Travel period</label>
          <input id="travelPeriod" name="travelPeriod" maxlength="160" placeholder="1/1/2027 - 12/31/2027"></div>
        <div class="field"><label for="link">Link to the offer</label>
          <input id="link" name="link" maxlength="600" placeholder="https://www.travelleaders.com/promotions/..." autocomplete="off">
          <p class="field-hint">Leave it exactly as it was given. The agent id in it credits the lead.</p></div>
      </div>
      <label style="display:flex;align-items:center;gap:.5rem;font-weight:400;margin-bottom:.8rem;">
        <input type="checkbox" id="featured" name="featured" style="width:auto;flex:none;"> Feature this offer</label>
      <div class="field-row">
        <div class="field"><label for="code">Code</label>
          <input id="code" name="code" maxlength="60"></div>
        <div class="field"><label for="notes">Notes</label>
          <input id="notes" name="notes" maxlength="800"></div>
      </div>
    </div>
    <div class="card-foot">
      <button class="btn btn-danger btn-sm" type="button" id="ed-delete" hidden>Delete</button>
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>
</dialog>
<datalist id="brand-names"></datalist>
<datalist id="shelf-names"></datalist>

<script type="module">
import { api, mountShell, esc, dateFmt, showError, onSubmit } from '/js/app.js';
await mountShell({ admin: true });

const $ = (id) => document.getElementById(id);
const errEl = $('err');

let d = null;
const isOver = (s) => Boolean(s.ends_on && s.ends_on < d.today);

function flatten(s) {
  return [s.brand, s.program, s.headline, s.offer, s.code, s.notes, s.window_text, s.travel_period]
    .filter(Boolean).join(' ').toLowerCase();
}

/** Every offer, filtered, as a table with a way to change each one. */
function draw() {
  const q = $('filter').value.trim().toLowerCase();
  const show = $('show').value;
  const rows = d.specials.filter((s) => (show === 'all' || (show === 'over') === isOver(s))
    && (!q || q.split(/\s+/).every((w) => flatten(s).includes(w))))
    .sort((a, b) => a.brand.localeCompare(b.brand) || (a.ends_on || '9999').localeCompare(b.ends_on || '9999'));

  const el = $('updated');
  el.hidden = !d.updatedOn;
  if (d.updatedOn) el.innerHTML = `Updated <strong>${esc(dateFmt(d.updatedOn))}</strong> &middot; ${d.specials.length} offer${d.specials.length === 1 ? '' : 's'} in all`;

  $('rows').innerHTML = rows.length
    ? `<div style="overflow-x:auto;"><table class="ss-table"><thead><tr><th>Brand</th><th>Offer</th><th>Book by</th><th></th></tr></thead><tbody>${
      rows.map((s) => `<tr>
        <td><strong>${esc(s.brand)}</strong>${s.program ? `<div class="sub">${esc(s.program)}</div>` : ''}
          <div class="sub">${esc(s.category || '')}${s.featured ? ' &middot; Featured' : ''}</div></td>
        <td>${s.headline ? `<div><strong>${esc(s.headline)}</strong></div>` : ''}${esc(s.offer)}
          ${s.link ? '<div class="sub">Has a link</div>' : ''}${s.code ? `<div class="sub">Code ${esc(s.code)}</div>` : ''}</td>
        <td>${esc(s.window_text || (s.ends_on ? dateFmt(s.ends_on) : 'No date'))}
          ${isOver(s) ? '<div class="sub">Ended</div>' : ''}</td>
        <td class="r"><button class="btn btn-secondary btn-sm" type="button" data-edit="${esc(s.id)}">Edit</button></td>
      </tr>`).join('')}</tbody></table></div>`
    : `<div class="empty"><h3>${d.specials.length ? 'Nothing matches' : 'No specials yet'}</h3>
      <p>${d.specials.length ? 'Try fewer words, or Everything.' : 'Upload the weekly list and the offers will be here.'}</p></div>`;
}

function drawHistory() {
  const el = $('history');
  if (!d.canEdit || !d.lists.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="card-head"><h2>Uploads</h2></div>
    <ul class="ss-hist">${d.lists.map((l, i) => `<li>
      <span class="grow"><strong>${esc(l.title || 'A list')}</strong>${
  l.issued_on ? ` <span class="muted">dated ${esc(dateFmt(l.issued_on))}</span>` : ''}<br>
        <span class="muted">${l.added_count} added, ${l.updated_count} updated${
  l.filename ? ` from ${esc(l.filename)}` : ''}</span></span>
      <button class="btn btn-ghost btn-sm" type="button" data-undo="${esc(l.id)}">${
  i === 0 ? 'Undo this upload' : 'Remove what it added'}</button>
    </li>`).join('')}</ul>`;
}


function drawAll() {
  draw();
  drawHistory();
  const shelves = [...new Set(d.specials.map((s) => s.category).filter(Boolean))];
  $('shelf-names').innerHTML = ['Cruise lines', 'Tours and land', 'Hotels and resorts', ...shelves]
    .filter((v, i, a) => a.indexOf(v) === i).map((s) => `<option value="${esc(s)}"></option>`).join('');
  $('brand-names').innerHTML = [...new Set(d.specials.map((s) => s.brand))].sort()
    .map((b) => `<option value="${esc(b)}"></option>`).join('');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.edit) openEdit(d.specials.find((x) => x.id === t.dataset.edit));
  else if (t.dataset.undo) undoList(t.dataset.undo);
});
$('filter').addEventListener('input', draw);
$('show').addEventListener('change', draw);

// ---- Editing one -----------------------------------------------------------

const edDlg = $('ed-dlg');
const edForm = $('ed-form');
let editingId = null;

function openEdit(s) {
  editingId = s ? s.id : null;
  edForm.reset();
  $('ed-title').textContent = s ? 'Edit this special' : 'Add a supplier special';
  $('ed-delete').hidden = !s;
  edForm.querySelector('.notice-error').hidden = true;
  const set = (n, v) => { edForm.elements[n].value = v ?? ''; };
  const v = s || { category: 'Cruise lines' };
  set('brand', v.brand); set('category', v.category); set('program', v.program); set('offer', v.offer);
  set('windowText', v.window_text); set('startsOn', v.starts_on); set('endsOn', v.ends_on);
  set('code', v.code); set('notes', v.notes);
  set('headline', v.headline); set('travelPeriod', v.travel_period); set('link', v.link);
  edForm.elements.featured.checked = Boolean(v.featured);
  edDlg.showModal();
}

$('add').addEventListener('click', () => openEdit(null));
$('ed-close').addEventListener('click', () => edDlg.close());
$('ed-delete').addEventListener('click', async () => {
  if (!editingId || !confirm('Delete this special? It disappears for everyone.')) return;
  try { await api(`/api/supplier-specials/${encodeURIComponent(editingId)}`, { method: 'DELETE' }); }
  catch (e) { showError(edForm.querySelector('.notice-error'), e); return; }
  edDlg.close();
  await load();
});
onSubmit(edForm, async (values) => {
  await api(editingId ? `/api/supplier-specials/${encodeURIComponent(editingId)}` : '/api/supplier-specials',
    { method: editingId ? 'PUT' : 'POST', body: values });
  edDlg.close();
  await load();
});

// ---- Uploading the weekly list --------------------------------------------

const upDlg = $('up-dlg');
const upBody = $('up-body');
const upFoot = $('up-foot');
let read = null;

function drawDrop(message) {
  $('up-title').textContent = 'Upload the weekly list';
  upBody.innerHTML = `${message ? `<div class="notice notice-error">${esc(message)}</div>` : ''}
    <div class="ss-drop" id="drop">
      <strong>Drop the weekly specials file here</strong>
      <p style="margin:.2rem 0 1rem;">The weekly Word document (.docx), or the Travel Leaders Network
        specials file (.json) with its links.</p>
      <label class="btn btn-primary btn-sm" for="file" style="cursor:pointer;">Choose a file</label>
      <input id="file" type="file" accept=".docx,.json,application/json,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </div>
    <p class="field-hint" style="margin-top:.9rem;">You will see exactly what it found before anything is added.
      An offer that is already here is updated, not doubled.</p>`;
  upFoot.innerHTML = '';
  const drop = $('drop');
  const input = $('file');
  input.addEventListener('change', () => input.files[0] && readFile(input.files[0]));
  ['dragenter', 'dragover'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) readFile(f); });
}

async function readFile(file) {
  upBody.innerHTML = `<p class="spinner">Reading ${esc(file.name)}...</p>`;
  upFoot.innerHTML = '';
  try {
    const res = await fetch('/api/supplier-specials/read', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/octet-stream', 'X-Filename': file.name }, body: file,
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || 'That file could not be read.');
    read = out;
    drawPreview();
  } catch (e) { drawDrop(e.message); }
}

const flag = (r) => (r.datesNote === 'none' ? 'No date given'
  : r.datesNote === 'unread' ? 'Date not read'
    : r.datesNote === 'several' ? 'Several dates, used the last' : '');

function drawPreview() {
  const c = read.counts;
  $('up-title').textContent = 'Here is what it found';
  const f = read.file;
  upBody.innerHTML = `
    <p style="margin:0 0 .8rem;"><strong>${esc(f.title || f.name)}</strong>${
  f.issuedOn ? ` <span class="muted">dated ${esc(dateFmt(f.issuedOn))}</span>` : ''}</p>
    <div class="ss-chips">
      <span class="badge badge-green">${c.new} new</span>
      <span class="badge badge-amber">${c.changed} changed</span>
      <span class="badge badge-navy">${c.same} already here</span>
    </div>
    ${(read.warnings || []).length ? `<div class="notice notice-warn">${read.warnings.map(esc).join(' ')}</div>` : ''}
    ${read.skipped.length ? `<div class="notice notice-info">Left out: ${read.skipped.map((s) =>
    `${esc(s.label)} (${s.count} rows), ${esc(s.why)}`).join('; ')}.</div>` : ''}
    <div class="ss-scroll"><table class="ss-prev"><thead><tr>
      <th>Brand</th><th>Offer</th><th>Book by</th><th></th></tr></thead><tbody>${read.rows.map((r) => `
      <tr class="${r.status}">
        <td><strong>${esc(r.brand)}</strong>${r.program ? `<br><span class="muted">${esc(r.program)}</span>` : ''}
          ${r.headline ? `<br>${esc(r.headline)}` : ''}${r.featured ? ' <span class="badge badge-coral">Featured</span>' : ''}
          <br><span class="muted">${esc(r.category)}${r.link ? ' · has a link' : ''}</span></td>
        <td>${esc(r.offer.length > 150 ? `${r.offer.slice(0, 150)}...` : r.offer)}${
  r.code ? `<br><span class="ss-code" style="cursor:default;">${esc(r.code)}</span>` : ''}</td>
        <td>${r.endsOn ? esc(dateFmt(r.endsOn)) : '<span class="muted">no end date</span>'}${
  flag(r) ? `<br><span style="color:var(--amber-600);font-size:.76rem;">${esc(flag(r))}</span>` : ''}</td>
        <td><span class="badge ${r.status === 'new' ? 'badge-green' : r.status === 'changed' ? 'badge-amber' : 'badge-navy'}">${
  r.status === 'same' ? 'here' : r.status}</span></td>
      </tr>`).join('')}</tbody></table></div>
    <p class="field-hint" style="margin-top:.8rem;">Anything marked with a date note can be corrected with Edit
      once it is added.</p>`;
  upFoot.innerHTML = `
    <button class="btn btn-ghost" type="button" id="again">Choose a different file</button>
    <button class="btn btn-primary" type="button" id="commit">Add to the list (${c.new + c.changed + c.same})</button>`;
  $('again').addEventListener('click', () => drawDrop(''));
  $('commit').addEventListener('click', commit);
}

async function commit() {
  const btn = $('commit');
  btn.disabled = true;
  btn.textContent = 'Adding...';
  try {
    const out = await api('/api/supplier-specials/import', {
      method: 'POST',
      body: { rows: read.rows, title: read.file.title, issuedOn: read.file.issuedOn,
        intro: read.file.intro, filename: read.file.name },
    });
    upDlg.close();
    errEl.innerHTML = `<div class="notice notice-ok">Added ${out.added} new and updated ${out.updated}${
      out.unchanged ? ` (${out.unchanged} were already here and unchanged)` : ''}.</div>`;
    state.status = 'live';
    await load();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Try again';
    upBody.insertAdjacentHTML('afterbegin', `<div class="notice notice-error">${esc(e.message)}</div>`);
  }
}

async function undoList(id) {
  if (!confirm('Take this upload back out? The offers it added are removed. Changes it made to offers that were already here stay.')) return;
  try {
    const out = await api(`/api/supplier-specials/lists/${encodeURIComponent(id)}`, { method: 'DELETE' });
    errEl.innerHTML = `<div class="notice notice-ok">Removed ${out.removed} offer${out.removed === 1 ? '' : 's'}.</div>`;
    await load();
  } catch (e) { showError(errEl, e); }
}

$('upload').addEventListener('click', () => { read = null; drawDrop(''); upDlg.showModal(); });
$('up-close').addEventListener('click', () => upDlg.close());

// ---------------------------------------------------------------------------

async function load() {
  try {
    d = await api('/api/supplier-specials');
    drawAll();
  } catch (e) { showError($('rows'), e); }
}

await load();
</script>
</body></html>
