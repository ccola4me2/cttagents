# CTT Agent Portal — Cloudflare Worker + static assets + D1.
#
# Deploy model: auto-deploys from GitHub `main` via Cloudflare Workers Builds,
# the same pattern as cruiseshoppers and the phc site. Wrangler runs in
# Cloudflare's build; nothing needs to be installed locally to ship.

name = "cttagents"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static portal files (HTML/CSS/JS) served at the edge.
# run_worker_first = true is REQUIRED: every request goes through the Worker so
# the auth gate on /app and /admin actually runs. Without it Cloudflare serves
# those HTML files directly and the gate is bypassed.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
# The Worker owns URL shape: it maps /login -> /login.html itself. Without
# html_handling = "none" the asset server answers /login.html with a 307 back
# to /login, which the Worker passes through, and the browser loops forever.
html_handling = "none"
not_found_handling = "none"

# D1 (SQLite): advisor accounts, sessions, password resets, and the
# travel-specific booking records GoHighLevel cannot model cleanly.
# Created in the Cloudflare dashboard (Storage & Databases > D1).
#
# CTT's own database, created 2026-09-10. Not Trip Vara's: pointing this at
# f7a1657b... would have this Worker reading and writing another agency's live
# book, which is why the placeholder that used to sit here was invalid rather
# than merely wrong.
[[d1_databases]]
binding = "DB"
database_name = "cttagents"
database_id = "c95cdf55-a781-45a4-88d0-76d63ba5ad56"

# R2: the documents attached to a reservation. Vendor confirmations, insurance
# policies, air tickets. The bucket is private and stays private: every
# download goes through the Worker, which checks the session and the advisor
# who owns the row before streaming a byte. Making the bucket public would put
# client paperwork on the open internet behind guessable keys.
#
# Added only after the bucket existed. A binding pointing at a bucket that does
# not exist fails `wrangler deploy`, which would have blocked every release
# until somebody noticed why.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "cttagents-docs"

# Non-secret config. Secrets (GHL_API_TOKEN, RESEND_API_KEY) are set in the
# dashboard under Settings > Variables and Secrets. Never committed.
[vars]
APP_URL = "https://cttagents.com"
MAIL_FROM = "CTT Agent Portal <noreply@cttagents.com>"
# Where operator notifications go (new advisor signups awaiting approval).
NOTIFY_EMAIL = "brentb@cruisestoursandtravel.com"
SESSION_TTL_DAYS = "30"
RESET_TTL_MINUTES = "60"

# GoHighLevel. The agency default sub-account every advisor falls back to when
# they have no sub-account of their own recorded in D1.
# The CTT sub-account in app.concinnity.digital. Its own, not Trip Vara's:
# pointing this at another agency's location would put their contacts and
# opportunities on these screens.
#
# This is only half of it. GHL_API_TOKEN is a secret and is set in the
# dashboard; until that token exists and can reach this location, every CRM
# screen says "CTT Tools is not connected yet" and the rest of the portal
# works, which is the intended half-configured state rather than a fault.
GHL_DEFAULT_LOCATION_ID = "JxDfISzvUbtcobLNDHl3"
GHL_API_BASE = "https://services.leadconnectorhq.com"
GHL_API_VERSION = "2021-07-28"
# White-labelled GoHighLevel app, used to deep-link the areas that have no
# useful API (funnel builder, workflow editor, email builder and so on).
GHL_APP_BASE = "https://app.concinnity.digital"

# Keeps the local CRM copy current. Each run advances whichever sync jobs still
# have work and no-ops cheaply once everything is complete and recently
# refreshed, so idle runs cost almost nothing. Every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]
